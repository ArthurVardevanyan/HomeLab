---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: gitops-ci
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "1"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" && ("kubernetes/***".pathChanged() || "okd/***".pathChanged()  || "okd/***".pathChanged() || ".tekton/***".pathChanged())
    pipelinesascode.tekton.dev/target-namespace: "homelab"
    pipelinesascode.tekton.dev/task: "[tekton/base/gitops-ci.yaml]"
spec:
  params:
    - name: playbooks
      value: servers
    - name: git-commit
      value: "{{ revision }}"
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-pr-number
      value: "{{ pull_request_number }}"
    - name: target-branch
      value: "{{ target_branch }}"

  pipelineSpec:
    params:
      - name: playbooks
        type: string
      - name: git-commit
        type: string
      - name: git-url
        type: string
        description: Repository URL to clone from.
      - name: git-pr-number
        type: string
      - name: target-branch
        type: string

    workspaces:
      - name: git_auth_secret

    tasks:
      - name: gitops-ci
        params:
          - name: git-commit
            value: $(params.git-commit)
          - name: git-url
            value: $(params.git-url)
          - name: git-pr-number
            value: $(params.git-pr-number)
          - name: target-branch
            value: $(params.target-branch)
        taskRef:
          name: gitops-ci
          kind: Task
        workspaces:
          - name: basic-auth
            workspace: git_auth_secret

  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: git_auth_secret
      secret:
        secretName: "{{ git_auth_secret }}"
