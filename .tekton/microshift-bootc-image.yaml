---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: microshift-bootc-image
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "1"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" &&  target_branch == "main" && "containers/microshift-bootc/***".pathChanged()
    pipelinesascode.tekton.dev/target-namespace: "homelab"
    pipelinesascode.tekton.dev/task: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/tasks/git-clone/0.9.1/git-clone.yaml"
    pipelinesascode.tekton.dev/task-1: "tekton/tasks/buildah/0.7.1/buildah.yaml"
    pipelinesascode.tekton.dev/task-2: "tekton/base/clair-action/clair-action-task.yaml"
    gitops-ci.k8s.io/exempt-image-checksum: "registry.arthurvardevanyan.com/homelab/microshift-bootc,registry.arthurvardevanyan.com/homelab/toolbox:not_latest"
    pipelinesascode.tekton.dev/task-3: "tekton/base/sbom/sbom-task.yaml"
spec:
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: DOCKERFILE
      value: "./bootc.Containerfile"
    - name: CONTEXT
      value: "./containers/microshift-bootc"
    - name: IMAGE_REPO
      value: "registry.arthurvardevanyan.com/homelab/microshift-bootc"
    - name: BUILD_MODE
      value: "release"
    - name: GH_TOKEN
      value: ""
    - name: COCKPIT
      value: "0"
    - name: Domain
      value: "microshift.dc2.vardevanyan.com"
    - name: INJECT_FILES
      valueFrom:
        secretKeyRef:
          name: microshift-bootc-inject
          key: authorized_keys

  pipelineSpec:
    params:
      - name: git-url
        description: Repository URL to clone from.
        type: string
      - name: git-commit
        type: string
      - name: IMAGE_REPO
        description: "Registry + repo (no tag); the tag is composed from the detected version at runtime."
      - name: DOCKERFILE
        description: Path to the Containerfile to build.
        type: string
        default: ./Dockerfile
      - name: CONTEXT
        description: Path to the directory to use as build context.
        type: string
        default: "."
      - name: BUILD_MODE
        description: "RPM source mode: local or release (default: release)."
        type: string
        default: "release"
      - name: GH_TOKEN
        type: string
        description: GitHub token for authenticated API calls during image build.
      - name: COCKPIT
        description: "Enable Cockpit installation (default: 0)."
        type: string
        default: "0"
      - name: Domain
        description: Domain for API server.
        type: string
        default: "microshift.dc2.vardevanyan.com"
      - name: INJECT_FILES
        description: |
          Files to inject into the build context.
          Format: `path relative to CONTEXT=base64content`.
        type: string
        default: ""

    results:
      - description: The common vulnerabilities and exposures (CVE) result
        name: SCAN_OUTPUT
        value: $(tasks.clair-action.results.SCAN_OUTPUT)
        type: string
      - description: The full image reference built by buildah
        name: IMAGE_URL
        value: $(tasks.buildah.results.IMAGE_URL)
        type: string
      - description: The image digest built by buildah
        name: IMAGE_DIGEST
        value: $(tasks.buildah.results.IMAGE_DIGEST)
        type: string
      - description: URL to the SBOM in the OCI image repository
        name: LINK_TO_SBOM
        value: $(tasks.sbom.results.LINK_TO_SBOM)
        type: string

    workspaces:
      - name: data
      - name: git_auth_secret
      - name: dockerconfig

    tasks:
      - name: detect-version
        taskSpec:
          results:
            - name: VERSION
              description: Auto-detected MicroShift version (tag_name with dashes replaced by underscores).
            - name: DATETIME
              description: Build datetime in the same format as the local IMAGE_SUFFIX (YYYY-MM-DD_HHMMSS).
          steps:
            - name: detect
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              script: |
                # Detect version from microshift GitHub releases — mirrors the Makefile exactly.
                URL="https://api.github.com/repos/microshift-io/microshift/releases/latest"
                V=$(curl -fsSL --max-time 20 "$URL" | grep '"tag_name"' | head -1 | awk -F'"' '{print $4}')
                [ -n "$V" ] || V="unknown"
                V=$(echo "$V" | tr '-' '_')
                printf '%s' "$V" > "$(results.VERSION.path)"
                # Datetime suffix: matches the local IMAGE_SUFFIX default (YYYY-MM-DD_HHMMSS)
                printf '%s' "$(date -u +%Y-%m-%d_%H%M%S)" > "$(results.DATETIME.path)"

      - name: git-clone
        taskRef:
          name: git-clone
          kind: Task
        params:
          - name: url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
        workspaces:
          - name: output
            workspace: data
          - name: basic-auth
            workspace: git_auth_secret

      - name: buildah
        runAfter:
          - git-clone
          - detect-version
        taskRef:
          name: buildah
          kind: Task
        params:
          - name: IMAGE
            value: "$(params.IMAGE_REPO):$(tasks.detect-version.results.VERSION)"
          - name: DOCKERFILE
            value: $(params.DOCKERFILE)
          - name: CONTEXT
            value: $(params.CONTEXT)
          - name: INJECT_FILES
            value: $(params.INJECT_FILES)
          - name: BUILD_EXTRA_ARGS
            value: >-
              --build-arg BUILD_MODE=$(params.BUILD_MODE)
              --build-arg COCKPIT=$(params.COCKPIT)
              --build-arg Domain=$(params.Domain)
              --build-arg GH_TOKEN=$(params.GH_TOKEN)
          - name: EXTRA_TAGS
            value: "$(params.IMAGE_REPO):$(tasks.detect-version.results.VERSION)-$(tasks.detect-version.results.DATETIME)"
        workspaces:
          - name: source
            workspace: data
          - name: dockerconfig
            workspace: dockerconfig

      - name: clair-action
        runAfter:
          - buildah
          - detect-version
        taskRef:
          name: clair-action
          kind: Task
        params:
          - name: IMAGE
            value: $(tasks.buildah.results.IMAGE_URL)

      - name: sbom
        runAfter:
          - buildah
        taskRef:
          name: sbom
          kind: Task
        params:
          - name: IMAGE
            value: "$(tasks.buildah.results.IMAGE_URL)@$(tasks.buildah.results.IMAGE_DIGEST)"
        workspaces:
          - name: dockerconfig
            workspace: dockerconfig
          - name: output
            workspace: data

  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: data
      volumeClaimTemplate:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "100Mi"
          storageClassName: rook-ceph-block-ci
    - name: git_auth_secret
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: dockerconfig
      secret:
        secretName: homelab-push-pull-secret
        items:
          - key: .dockerconfigjson
            path: config.json
