title = "HomeLab gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Base64 encoded iPXE binary; random bytes trigger token regex false positives"
paths = ['''okd/okd-nodes/base/metal3-pxe/snponly-homelab\.efi\.b64''']

[[allowlists]]
description = "Public GPG fingerprint of the Gitea GitOps Signer key (not a secret)"
regexes = ['''C67050B3315A43611FC0A723EC72A6C9B5867C44''']
