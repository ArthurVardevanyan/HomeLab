---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitops-ci
  namespace: homelab
  labels:
    app: homelab
    app.kubernetes.io/instance: homelab
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  params:
    - name: image
      type: string
      default: "registry.arthurvardevanyan.com/homelab/toolbox:not_latest"
    - name: git-commit
      type: string
    - name: git-url
      type: string
    - name: git-pr-number
      type: string
    - name: target-branch
      type: string

  workspaces:
    - name: basic-auth

  steps:
    - name: gitops-ci
      image: "$(params.image)"
      computeResources:
        limits:
          cpu: "4"
          memory: 6Gi
        requests:
          cpu: "1"
          memory: 2Gi
      securityContext:
        runAsNonRoot: true
        # runAsUser: 65532
        privileged: false
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
            - MKNOD
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      env:
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_COMMIT
          value: $(params.git-commit)
        - name: GIT_PR_NUMBER
          value: $(params.git-pr-number)
        - name: TARGET_BRANCH
          value: $(params.target-branch)
        - name: WORKSPACE_BASIC_AUTH_PATH
          value: $(workspaces.basic-auth.path)
      script: |
        #!/bin/bash

        set -o errexit  # exit on any failure
        set -o nounset  # exit on undeclared variables
        set -o pipefail # return value of all commands in a pipe
        ## set -o xtrace  # command tracing
        shopt -s failglob # If no matches are found, an error message is printed and the command is not executed

        export URL=arthurvardevanyan.com

        # AVP/Vault login. Not yet exercised by `k8s-gitops-ci pipeline` (the
        # kustomize+argocd-vault-plugin overlay-render engine isn't wired into
        # its validation path yet), but kept so this Task is ready once that
        # lands upstream.
        export AVP_TYPE=vault
        export AVP_AUTH_TYPE=token
        export VAULT_ADDR=https://vault.${URL}
        KUBERNETES_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
        export KUBERNETES_TOKEN
        VAULT_TOKEN="$(vault write -field=token auth/homelab/login role=homelab jwt=${KUBERNETES_TOKEN})"
        export VAULT_TOKEN

        gh auth login --with-token <"/${WORKSPACE_BASIC_AUTH_PATH}/git-provider-token"

        k8s-gitops-ci pipeline \
          --url "${GIT_URL}" \
          --pr "${GIT_PR_NUMBER}" \
          --revision "${GIT_COMMIT}" \
          --target-branch "${TARGET_BRANCH}" \
          --assume-openshift \
          --comment

  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
