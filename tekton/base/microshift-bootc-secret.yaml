---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: microshift-bootc-inject
  namespace: homelab
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: microshift-bootc-inject
  data:
    - secretKey: authorized_keys
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: okd
        property: id_ed25519.pub
        metadataPolicy: None
