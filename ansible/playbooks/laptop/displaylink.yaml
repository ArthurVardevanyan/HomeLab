---
# DisplayLink via copr (crashdummy/Displaylink):
# https://copr.fedorainfracloud.org/coprs/crashdummy/Displaylink/
- name: DisplayLink Setup
  hosts: lenovo
  gather_facts: false
  become: true
  user: arthur
  tasks:
    - name: Install DNF plugins (needed for copr)
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - dkms
        state: present

    - name: Enable DisplayLink copr repo
      ansible.builtin.command:
        cmd: dnf copr enable -y crashdummy/Displaylink
      changed_when: false

    - name: Install DisplayLink driver
      ansible.builtin.dnf:
        name: displaylink
        state: present

    # - name: Set evdi initial device count
    #   ansible.builtin.copy:
    #     dest: /etc/modprobe.d/evdi.conf
    #     content: "options evdi initial_device_count=4\n"
    #     mode: "0644"

    - name: Enable DisplayLink driver service
      ansible.builtin.systemd:
        name: displaylink-driver
        enabled: true
        state: started

    - name: Create udev rule to disable USB autosuspend for DisplayLink
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/50-displaylink.rules
        content: |
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="17e9", ATTR{power/autosuspend}="-1"
        mode: "0644"
      notify: Reload udev rules

  handlers:
    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      changed_when: true
