---
# MutatingAdmissionPolicyBinding that activates map-ols-service-image
# for the openshift-lightspeed namespace (gated by the policy's own
# matchCondition: `object.metadata.name == 'lightspeed-app-server'`).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/created-by: openshift-lightspeed
  name: map-ols-service-image-binding
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openshift-lightspeed
  policyName: map-ols-service-image
