---
# Adds the OpenShift MCP server to AgenticRuns created by the alerts adapter.
# The adapter only sets spec.tools.skills; without an MCP server the agent has
# no cluster access (see README issue 4). spec.tools is immutable after
# creation, so it has to be injected at admission time.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: agenticrun-alert-tools
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  admission: true
  background: false
  rules:
    - name: add-alert-mcp-server
      match:
        any:
          - resources:
              kinds:
                - agentic.openshift.io/v1alpha1/AgenticRun
              operations:
                - CREATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."agentic.openshift.io/source" || '''' }}'
            operator: Equals
            value: alertmanager
      mutate:
        patchStrategicMerge:
          spec:
            tools:
              mcpServers:
                - name: openshift
                  url: https://openshift-mcp-server.openshift-lightspeed.svc:8443/mcp
                  timeoutSeconds: 60
                  headers:
                    - name: Authorization
                      valueFrom:
                        type: ServiceAccountToken
