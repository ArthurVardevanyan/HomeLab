---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: lightspeed-console-plugin
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: lightspeed-console-plugin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lightspeed-console-plugin
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: lightspeed-console-plugin
        minAllowed:
          cpu: 5m
          memory: 16Mi
        maxAllowed:
          cpu: 200m
          memory: 512Mi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly # "RequestsAndLimits"
