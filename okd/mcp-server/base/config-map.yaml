---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server
  namespace: openshift-mcp-server
  labels:
    helm.sh/chart: redhat-openshift-mcp-server-0.3.0
    app.kubernetes.io/name: redhat-openshift-mcp-server
    app.kubernetes.io/instance: openshift-mcp-server
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
data:
  config.toml: |
    cluster_auth_mode = "passthrough"
    require_oauth = true
    authorization_url = "https://zitadel.arthurvardevanyan.com"
    server_url = "https://mcp.okd.homelab.arthurvardevanyan.com"
    disable_dynamic_client_registration = true
    oauth_audience = "398452103078493301"
