port = "8080"
cluster_provider_strategy = "in-cluster"
toolsets = ["config", "core", "helm", "kcp", "kubevirt", "metrics", "netedge", "openshift", "tekton"]
cluster_auth_mode = "passthrough"
require_oauth = true
authorization_url = "https://zitadel.arthurvardevanyan.com"
