# openshift-mcp-server 0.3 advertises itself as the OAuth authorization
# server in its protected resource metadata (server_url) but proxies the
# /.well-known/{oauth-authorization-server,openid-configuration} documents
# verbatim from Zitadel, keeping Zitadel's "issuer". Strict RFC 8414 §3.3
# MCP clients (opencode v2 and later) reject that mismatch and never reach
# the authorization endpoint. This sidecar sits in front of the two
# metadata documents and rewrites "issuer" to the URL the server
# advertises, making the metadata self-consistent. The authorize/token
# endpoints keep pointing at Zitadel; tokens and validation are untouched.
# Remove once upstream rewrites the issuer itself (or gains an
# oauth_issuer knob).

# The ConfigMap is mounted over /etc/nginx/nginx.conf (the image's default
# main configuration), so this file carries the full main/http/server
# configuration. All writable paths point at the pod's /tmp emptyDir
# because the container runs with a read-only root filesystem.

pid /tmp/nginx.pid;
error_log stderr warn;
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8081;

    location = /_healthz {
      return 204;
    }

    # The authorization-server metadata documents: proxy to the MCP
    # server, rewriting the issuer on the way back. Both sub_filter forms
    # cover compact and space-padded JSON serialization of the key.
    location ~ ^/.well-known/(oauth-authorization-server\|openid-configuration)$ {
      proxy_pass http://127.0.0.1:8080;
      # The upstream Go server rejects loopback-accepted requests whose
      # Host is not localhost (DNS-rebinding protection); the real Host
      # is carried through as X-Forwarded-Host instead.
      proxy_set_header Host localhost:8080;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # sub_filter cannot run over compressed responses.
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/json;
      sub_filter '"issuer":"https://zitadel.arthurvardevanyan.com"' '"issuer":"https://mcp.okd.homelab.arthurvardevanyan.com"';
      sub_filter '"issuer": "https://zitadel.arthurvardevanyan.com"' '"issuer": "https://mcp.okd.homelab.arthurvardevanyan.com"';
      sub_filter_once on;
    }

    # Everything else the HTTPRoute sends here (the protected resource
    # metadata under /.well-known/, which needs no rewrite) passes
    # through unchanged.
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host localhost:8080;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
