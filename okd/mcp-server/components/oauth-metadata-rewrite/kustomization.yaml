---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - network-policy.yaml
patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
  - path: http-route-patch.yaml
    target:
      kind: HTTPRoute
      name: openshift-mcp-server
configMapGenerator:
  - files:
      - nginx.conf
    name: oauth-metadata-rewrite
    namespace: openshift-mcp-server
