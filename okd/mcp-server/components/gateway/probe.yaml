---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: openshift-mcp-server
  namespace: openshift-mcp-server
  labels:
    app.kubernetes.io/instance: openshift-mcp-server
spec:
  jobName: urls-static
  interval: 30s
  module: http_2xx
  prober:
    path: /probe
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://mcp.okd.homelab.arthurvardevanyan.com/healthz
