---
openshift: true
fullnameOverride: openshift-mcp-server
config:
  toolsets:
    - config
    - core
    - helm
    - kcp
    - kubevirt
    - metrics
    - netedge
    - openshift
    - ossm
    - tekton
ingress:
  enabled: false
rbac:
  extraClusterRoleBindings:
    - name: use-view-role
      roleRef:
        name: view
        external: true
