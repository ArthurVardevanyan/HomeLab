---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: gpu-1
  namespace: openshift-machine-api
  # annotations:
  #   baremetalhost.metal3.io/boot-interface: "ipxe"
spec:
  bmc:
    # redfish+http
    address: redfish-virtualmedia+http://bmc-shim.bmc-shim.svc.cluster.local:8080/redfish/v1/Systems/7
    credentialsName: "gpu-1-bmc-secret"
  bootMACAddress: 2c:f0:5d:83:73:a2
  # architecture: x86_64
  automatedCleaningMode: metadata
  bootMode: UEFI
  externallyProvisioned: true # false
  # Hardware details are not needed (bmc-shim, fixed hardware); skip IPA inspection
  # inspectionMode: disabled
  online: true
  # Inspection is disabled, so BMO falls back to the default /dev/sda hint; the only disk is NVMe
  # rootDeviceHints:
  #   deviceName: /dev/nvme0n1
  #preprovisioningNetworkDataName: gpu-1-network-data
  # userData:
  #   name: worker-user-data
  #   namespace: openshift-machine-api
# Manually Patched Status for Discovery
# status:
#   hardware:
#     nics:
#       - ip: 10.101.10.107
#         mac: 2c:f0:5d:83:73:a2
#         name: bond0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gpu-1-bmc-secret
  namespace: openshift-machine-api
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gpu-1-bmc-secret
  data:
    - secretKey: username
      remoteRef: # checkov:skip=CKV_SECRET_6 PlaceHolder Values
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/bmc
        property: username
        metadataPolicy: None
    - secretKey: password
      remoteRef: # checkov:skip=CKV_SECRET_6 PlaceHolder Values
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/bmc
        property: password
        metadataPolicy: None
