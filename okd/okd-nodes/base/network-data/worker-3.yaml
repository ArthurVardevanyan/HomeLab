---
apiVersion: v1
kind: Secret
metadata:
  name: worker-3-network-data
  namespace: openshift-machine-api
type: Opaque
stringData:
  nmstate: |
    interfaces:
      - name: bond0
        type: bond
        state: up
        mac-address: 58:47:CA:7A:76:2B
        mtu: 9000
        ipv4:
          enabled: true
          address:
            - ip: 10.101.10.106
              prefix-length: 24
          dhcp: false
        ipv6:
          enabled: false
        link-aggregation:
          mode: active-backup
          options:
            miimon: "150"
            primary: enp3s0
          port:
            - enp3s0
            - enp4s0
    dns-resolver:
      config:
        server:
          - 10.101.1.4
          - 10.101.9.254
    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: 10.101.10.1
          next-hop-interface: bond0
          table-id: 254
