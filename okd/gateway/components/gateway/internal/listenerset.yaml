---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: listeners
  namespace: openshift-ingress
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway
  listeners:
    - name: https
      hostname: "*.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: arthurvardevanyan-cert
    - name: https-cluster
      hostname: "*.okd.homelab.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cluster-cert
