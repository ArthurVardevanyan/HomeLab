---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-gateway
  namespace: openshift-ingress
  labels:
    gateway.networking.k8s.io/gateway-name: https-gateway
spec:
  gatewayClassName: openshift-default
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: gateway
      protocol: HTTPS
      port: 443
      hostname: "internal.gateway.okd.homelab.arthurvardevanyan.com"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: internal-gateway-cert
  infrastructure:
    labels:
      coraza: internal-ruleset
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gw-options-internal
