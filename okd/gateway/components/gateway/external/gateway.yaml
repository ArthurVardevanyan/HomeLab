---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-gateway-external
  namespace: openshift-ingress
  labels:
    gateway.networking.k8s.io/gateway-name: https-gateway-external
spec:
  gatewayClassName: openshift-default
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          gateway-tenancy: external
  listeners:
    - name: gateway
      protocol: HTTPS
      port: 443
      hostname: "external.gateway.okd.homelab.arthurvardevanyan.com"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: external-gateway-cert
  infrastructure:
    # coraza WAF targeting now uses the GEP-1762 gateway-name label that the
    # gateway controller places on gateway pods (Engine spec.target).
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gw-options-external
