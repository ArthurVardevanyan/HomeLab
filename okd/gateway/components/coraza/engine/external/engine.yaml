---
apiVersion: waf.k8s.coraza.io/v1alpha1
kind: Engine
metadata:
  name: coraza-external
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ruleSet:
    name: external-ruleset
  target:
    type: Gateway
    name: https-gateway-external
    provider: Istio
  # Start in Allow while dogfooding the envoy-coraza filter upstream hasn't
  # re-baselined its conformance matrix (networking-incubator/coraza-kubernetes-operator#556).
  # Flip to Fail once detection is verified in production logs.
  failurePolicy: allow
  driver:
    type: wasm
    # Empty wasm config: the operator serves its bundled envoy-coraza module
    # (CRS v4.30.0 embedded) to Envoy over ECDS/HTTPS. No image pin needed —
    # the module version is tied to the operator image digest.
    wasm: {}
