---
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: istiod-enable-listenersets
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  background: false
  rules:
    - name: istiod-listenerset-env
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  app: istiod
                  istio: pilot
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                containers:
                  - (name): discovery
                    env:
                      - name: PILOT_IGNORE_RESOURCES
                        value: ""
                      - name: PILOT_ENABLE_ALPHA_GATEWAY_API
                        value: "true"
