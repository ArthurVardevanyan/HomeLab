---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-istiod-env
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        'app' in object.metadata.labels && object.metadata.labels['app'] == 'istiod' &&
        'istio' in object.metadata.labels && object.metadata.labels['istio'] == 'pilot'
      name: matches-label
    - expression: >-
        has(object.spec.template) &&
        has(object.spec.template.spec) &&
        has(object.spec.template.spec.containers)
      name: has-containers
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c, c.name == 'discovery' && !has(c.env))
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) + '/env',
              value: [
                {"name": 'PILOT_IGNORE_RESOURCES', "value": ''},
                {"name": 'PILOT_ENABLE_ALPHA_GATEWAY_API', "value": 'true'}]
            })
      patchType: JSONPatch
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c,
              c.name == 'discovery'
              && has(c.env)
              && c.env.exists(e, e.name == 'PILOT_IGNORE_RESOURCES'))
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) +
                '/env/' +
                string(c.env.map(e, e.name).indexOf('PILOT_IGNORE_RESOURCES')) +
                '/value',
              value: ''})
      patchType: JSONPatch
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c,
              c.name == 'discovery'
              && has(c.env)
              && !c.env.exists(e, e.name == 'PILOT_IGNORE_RESOURCES'))
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) + '/env/-',
              value: {"name": 'PILOT_IGNORE_RESOURCES', "value": ''}})
      patchType: JSONPatch
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c,
              c.name == 'discovery'
              && has(c.env)
              && c.env.exists(e, e.name == 'PILOT_ENABLE_ALPHA_GATEWAY_API'))
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) +
                '/env/' +
                string(c.env.map(e, e.name).indexOf('PILOT_ENABLE_ALPHA_GATEWAY_API')) +
                '/value',
              value: 'true'})
      patchType: JSONPatch
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c,
              c.name == 'discovery'
              && has(c.env)
              && !c.env.exists(e, e.name == 'PILOT_ENABLE_ALPHA_GATEWAY_API'))
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) + '/env/-',
              value: {"name": 'PILOT_ENABLE_ALPHA_GATEWAY_API', "value": 'true'}})
      patchType: JSONPatch
