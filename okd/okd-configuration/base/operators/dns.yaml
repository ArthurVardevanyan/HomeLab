apiVersion: operator.openshift.io/v1
kind: DNS
metadata:
  name: default
spec:
  cache:
    negativeTTL: 300s
    positiveTTL: 900s
  logLevel: Normal
  nodePlacement:
    tolerations:
      - key: node-role.kubernetes.io/infra
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/gpu
        operator: Exists
        effect: NoSchedule
  operatorLogLevel: Normal
  upstreamResolvers:
    policy: Random #Sequential
    protocolStrategy: ""
    transportConfig: {}
    upstreams:
      - port: 53
        type: SystemResolvConf
