---
apiVersion: config.openshift.io/v1
kind: Authentication
metadata:
  name: cluster
spec:
  serviceAccountIssuer: https://storage.googleapis.com/okd-homelab-wif-oidc
  oauthMetadata:
    name: ""
  type: "OIDC"
  oidcProviders:
    - name: zitadel
      claimMappings:
        groups:
          claim: roles
        # The uid claim mapping (and its claimValidationRules) that padded
        # ZITADEL's decimal `sub` into a UUID-shaped value for OLS is
        # retired: lightspeed-service now accepts opaque non-UUID user IDs
        # (openshift/lightspeed-service#3186), and the cluster runs that
        # build via the operator image override in
        # okd/openshift-lightspeed/overlays/okd. `user.uid` re-defaults to
        # the raw `sub`. See okd/openshift-lightspeed/README.md
        # (OIDC Auth Fix).
        username:
          claim: preferred_username
          prefixPolicy: NoPrefix
      issuer:
        audiences:
          - <path:secret/data/homelab/zitadel/okd#client_id>
          - <path:secret/data/homelab/zitadel/okd-mcp#client_id>
        issuerURL: "https://zitadel.arthurvardevanyan.com"
      oidcClients:
        - clientID: <path:secret/data/homelab/zitadel/okd#client_id>
          componentName: console
          componentNamespace: openshift-console
          clientSecret:
            name: zitadel-openid-client
          extraScopes:
            - email
            - profile
        - clientID: <path:secret/data/homelab/zitadel/okd-cli#client_id>
          componentName: cli
          componentNamespace: openshift-console
          extraScopes:
            - email
            - profile
