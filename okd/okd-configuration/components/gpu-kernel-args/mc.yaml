# NOTE: If Realtek NIC (enp42s0) link instability persists, consider adding
# pcie_aspm=off or pcie_aspm.policy=powersave (replace the existing pcie_aspm=force).
# ASPM can interfere with NIC auto-negotiation on Realtek controllers.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: gpu
  name: 99-gpu-kernel-args
spec:
  kernelArguments:
    - iommu=pt
    - pcie_aspm=force
    - pcie_aspm.policy=powersave
