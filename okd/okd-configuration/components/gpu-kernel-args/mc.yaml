---
# NOTE: The Realtek NIC (enp42s0) link instability is handled by the
# 98-gpu-nic-pm-fix MachineConfig which disables clkpm, l1_aspm, and EEE
# on the NIC via udev rules and a systemd one-shot service.
# These power-saving features are known to cause link drops on the
# Realtek RTL8125 controller, especially after firmware updates.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: gpu
  name: 99-gpu-kernel-args
spec:
  kernelArguments:
    - iommu=pt
    - pcie_aspm=force
    - pcie_aspm.policy=powersave
