---
# NOTE: The Realtek NIC (enp42s0) link instability is handled by the
# 98-gpu-nic-pm-fix MachineConfig, which disables clkpm/l1_aspm on the NIC
# (udev rule) and EEE (systemd unit running ethtool). Power management is a
# suspected cause of link drops on the Realtek RTL8125 controller. The global
# pcie_aspm=force setting is kept for the GPUs and not changed here.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: gpu
  name: 99-gpu-kernel-args
spec:
  kernelArguments:
    - iommu=pt
    - pcie_aspm=force
    - pcie_aspm.policy=powersave
