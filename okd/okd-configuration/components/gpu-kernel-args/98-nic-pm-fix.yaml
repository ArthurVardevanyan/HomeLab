---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 98-nic-pm-fix
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/udev/rules.d/98-nic-pm.rules
          mode: 0644
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,QUNUSU9OPT0iYWRkIiwgU1VCU1lTVEVNPT0icGNpIiwgQVRUUnt2ZW5kb3J9PT0iMHgxMGVjIiwgQVRUUntkZXZpY2V9PT0iMHg4MTI1IiwgQVRUUntsaW5rL2Nsa3BtfT0iMCIsIEFUVFJ7bGluay9sMV9hc3BtfT0iMCIsIEFUVFJ7cG93ZXIvY29udHJvbH09Im9uIgo=
    systemd:
      units:
        - name: disable-nic-eee.service
          enabled: true
          contents: |
            [Unit]
            Description=Disable EEE and clkpm on Realtek NICs (GPU + Worker)
            Wants=network-pre.target
            Before=network-pre.target
            After=sys-subsystem-net-devices-enp42s0.device sys-subsystem-net-devices-enp3s0.device sys-subsystem-net-devices-enp4s0.device
            Requires=sys-subsystem-net-devices-enp42s0.device sys-subsystem-net-devices-enp3s0.device sys-subsystem-net-devices-enp4s0.device

            [Service]
            Type=oneshot
            # Re-fire the udev "add" event for all Realtek NICs, so the clkpm
            # rule is applied even if the link/ sysfs attrs were missing at
            # first add. The udev matching is PCI-device-specific
            # (vendor=0x10ec, device=0x8125), so it only fires on Realtek
            # RTL8125 controllers regardless of node role or interface name.
            ExecStart=-/usr/sbin/udevadm trigger --action=add --subsystem-match=pci --attr-match=vendor=0x10ec --attr-match=device=0x8125
            ExecStart=-/usr/sbin/udevadm settle --timeout=10
            # Worker nodes (enp3s0 + enp4s0) + GPU node (enp42s0)
            # The "-" prefix on ExecStart means "ignore failure" — if a NIC
            # does not exist on a given node the command is harmless.
            ExecStart=-/usr/sbin/ethtool --set-eee enp3s0 eee off
            ExecStart=-/usr/sbin/ethtool --set-eee enp4s0 eee off
            ExecStart=-/usr/sbin/ethtool --set-eee enp42s0 eee off
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
