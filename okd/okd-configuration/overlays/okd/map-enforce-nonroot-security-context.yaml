---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-enforce-nonroot-security-context
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.metadata.namespace)
        && object.metadata.namespace.startsWith('openshift-node-joiner')
      name: namespace-matches
    - expression: >-
        has(object.spec.containers) && object.spec.containers.size() > 0
      name: has-containers
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.containers
            .map(c,
              !has(c.securityContext)
              ? [JSONPatch{
                  op: 'add',
                  path: '/spec/containers/' +
                    string(object.spec.containers.indexOf(c)) +
                    '/securityContext',
                  value: {"allowPrivilegeEscalation": false, "runAsNonRoot": true}},
                JSONPatch{
                  op: 'add',
                  path: '/spec/containers/' +
                    string(object.spec.containers.indexOf(c)) +
                    '/securityContext/capabilities',
                  value: {"drop": ['ALL']}}]
              : [JSONPatch{op: 'add',
                  path: '/spec/containers/' + string(object.spec.containers.indexOf(c)) + '/securityContext/runAsNonRoot',
                  value: true},
                JSONPatch{op: 'add',
                  path: '/spec/containers/' + string(object.spec.containers.indexOf(c)) + '/securityContext/allowPrivilegeEscalation',
                  value: false}]
              + (has(c.securityContext.capabilities)
                ? [JSONPatch{op: 'add',
                    path: '/spec/containers/' + string(object.spec.containers.indexOf(c)) + '/securityContext/capabilities/drop',
                    value: ['ALL']}]
                : [JSONPatch{op: 'add',
                    path: '/spec/containers/' + string(object.spec.containers.indexOf(c)) + '/securityContext/capabilities',
                    value: {"drop": ['ALL']}}])
            )
            .flatten()
      patchType: JSONPatch
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: map-enforce-nonroot-security-context-binding
spec:
  policyName: map-enforce-nonroot-security-context
