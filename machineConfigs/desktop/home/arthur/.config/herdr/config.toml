onboarding = false

[server]
headless_cols = 160
headless_rows = 50

[terminal]
default_shell = "/bin/zsh"
new_cwd = "current"

[theme]
name = "catppuccin-mocha"

[ui]
pane_borders = "auto"

[keys]
prefix = "ctrl+b"
new_tab = "prefix+c"
close_tab = "prefix+w"
switch_tab = "prefix+1..9"
next_tab = "prefix+n"
previous_tab = "prefix+p"
focus_pane_up = "prefix+k"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+slash"
split_vertical = "prefix+minus"
resize_pane_up = "prefix+up"
resize_pane_down = "prefix+down"
resize_pane_left = "prefix+left"
resize_pane_right = "prefix+right"
zoom = "prefix+enter"
