---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/instance: homeassistant
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: homeassistant-tls
spec:
  selector:
    app: homeassistant
  ports:
    - protocol: TCP
      port: 8123
      targetPort: http
      name: https
  type: ClusterIP
  clusterIP: None
