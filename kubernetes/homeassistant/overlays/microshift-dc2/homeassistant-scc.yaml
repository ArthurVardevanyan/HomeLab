---
# Custom SCC for HomeAssistant pod (hostNetwork + required capabilities)
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: homeassistant-scc
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: true
allowHostPID: false
allowHostPorts: true
allowPrivilegedContainer: true
allowedCapabilities:
  - CHOWN
  - DAC_OVERRIDE
  - FOWNER
  - SETUID
  - SETGID
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:homeassistant:homeassistant-sa
volumes:
  - configMap
  - emptyDir
  - persistentVolumeClaim
  - secret
runAsUser:
  type: RunAsAny
seccompProfiles:
  - runtime/default
readOnlyRootFilesystem: false
requiredDropCapabilities: []
priority: null
