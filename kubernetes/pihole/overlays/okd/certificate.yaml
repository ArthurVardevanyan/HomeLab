---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pihole-cert
  namespace: pihole
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: pihole-cert
  duration: 1080h
  renewBeforePercentage: 50
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  dnsNames:
    - pihole.okd.homelab.arthurvardevanyan.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
