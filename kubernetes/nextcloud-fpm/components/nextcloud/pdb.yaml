---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nextcloud-app
  namespace: nextcloud-fpm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 50%
  selector:
    matchLabels:
      app: nextcloud
      db: nextcloud-pg
