---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics
  namespace: kube-eagle
spec:
  rules:
    - host: metrics.dc2.vardevanyan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-eagle
                port:
                  name: http
