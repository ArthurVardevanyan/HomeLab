---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-nvidia-mps
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - daemonsets
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          [
            object.spec.template.spec.containers
              .filter(c,
                c.name == 'mps-control-daemon-ctr'
                && (!has(c.resources) || !has(c.resources.limits))
              )
              .map(c,
                JSONPatch{
                  op: 'add',
                  path: '/spec/template/spec/containers/' +
                    string(object.spec.template.spec.containers.indexOf(c)) +
                    '/resources',
                  value: {
                    "limits": {"cpu": '50m', "memory": '64Mi'},
                    "requests": {"cpu": '10m', "memory": '32Mi'}
                  }
                }
              ),
            object.spec.template.spec.initContainers
              .filter(c,
                c.name == 'mps-control-daemon-mounts'
                && (!has(c.resources) || !has(c.resources.limits))
              )
              .map(c,
                JSONPatch{
                  op: 'add',
                  path: '/spec/template/spec/initContainers/' +
                    string(object.spec.template.spec.initContainers.indexOf(c)) +
                  '/resources',
                  value: {
                    "limits": {"cpu": '50m', "memory": '64Mi'},
                    "requests": {"cpu": '10m', "memory": '32Mi'}
                  }
                }
              )
          ].flatten()
      patchType: JSONPatch
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: map-nvidia-mps-binding
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: nvidia-gpu-operator
  policyName: map-nvidia-mps
