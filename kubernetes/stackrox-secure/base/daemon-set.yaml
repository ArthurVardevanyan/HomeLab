---
# Source: stackrox-secured-cluster-services/templates/collector.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/instance: stackrox-secured-cluster-services
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stackrox
    app.kubernetes.io/part-of: stackrox-secured-cluster-services
    app.kubernetes.io/version: 5.0.0
    helm.sh/chart: stackrox-secured-cluster-services-500.0.0
    service: collector
    app: collector
    auto-upgrade.stackrox.io/component: sensor
  annotations:
    email: support@stackrox.com
    meta.helm.sh/release-name: stackrox-secured-cluster-services
    meta.helm.sh/release-namespace: stackrox
    owner: stackrox
    checkov.io/skip1: CKV_K8S_8=Not Supported
    checkov.io/skip2: CKV_K8S_9=Not Supported
    checkov.io/skip3: CKV_K8S_16=Security Tool
    checkov.io/skip4: CKV_K8S_20=Security Tool
    checkov.io/skip5: CKV_K8S_22=Security Tool
    checkov.io/skip6: CKV_K8S_27=Security Tool
    checkov.io/skip7: CKV_K8S_23=Security Tool
    checkov.io/skip8: CKV_K8S_28=Security Tool
    checkov.io/skip9: CKV_K8S_29=Security Tool
    checkov.io/skip10: CKV_K8S_30=Security Tool
    checkov.io/skip11: CKV_K8S_31=Security Tool
    checkov.io/skip12: CKV_K8S_37=Security Tool
    checkov.io/skip13: CKV_K8S_38=Security Tool
    checkov.io/skip14: CKV_K8S_40=OpenShift Injects Random UID
  name: collector
  namespace: stackrox
spec:
  selector:
    matchLabels:
      service: collector
  template:
    metadata:
      namespace: stackrox
      labels:
        service: collector
        app: collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/instance: stackrox-secured-cluster-services
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: stackrox
        app.kubernetes.io/part-of: stackrox-secured-cluster-services
        app.kubernetes.io/version: 5.0.0
        helm.sh/chart: stackrox-secured-cluster-services-500.0.0
        sidecar.istio.io/inject: "false"
      annotations:
        email: support@stackrox.com
        meta.helm.sh/release-name: stackrox-secured-cluster-services
        meta.helm.sh/release-namespace: stackrox
        openshift.io/required-scc: privileged
        owner: stackrox
    spec:
      tolerations:
        - operator: Exists
      serviceAccountName: collector
      automountServiceAccountToken: true
      containers:
        - name: collector
          image: quay.io/stackrox-io/collector:5.0.0@sha256:e259acc148441023ff79608e17290ddf8622d97fb195a97b257f9b7b6953cfb0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_CONFIG
              value: '{"tlsConfig":{"caCertPath":"/var/run/secrets/stackrox.io/certs/ca.pem","clientCertPath":"/var/run/secrets/stackrox.io/certs/cert.pem","clientKeyPath":"/var/run/secrets/stackrox.io/certs/key.pem"}}'
            - name: COLLECTION_METHOD
              value: CORE_BPF
            - name: GRPC_SERVER
              value: sensor.stackrox.svc:443
            - name: SNI_HOSTNAME
              value: sensor.stackrox.svc
          resources:
            limits:
              cpu: 50m
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 256Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - NET_RAW
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /host/proc
              name: proc-ro
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /host/etc
              name: etc-ro
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /host/usr/lib
              name: usr-lib-ro
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /host/sys
              name: sys-ro
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /host/dev
              name: dev-ro
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /run/secrets/stackrox.io/certs/
              name: certs
              readOnly: true
            - mountPath: /etc/stackrox
              name: collector-config
              readOnly: true
            - mountPath: /var/profiles
              name: collector-profiles
        - command:
            - stackrox/compliance
          env:
            - name: ROX_MEMLIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: "0"
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  divisor: "0"
                  resource: limits.cpu
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ROX_NODE_INDEX_HOST_PATH
              value: /hostindex
            - name: ROX_METRICS_PORT
              value: disabled
            - name: ROX_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: ROX_ADVERTISED_ENDPOINT
              value: sensor.stackrox.svc:443
            - name: ROX_SENSOR_ENDPOINT
              value: sensor.stackrox.svc:443
            - name: ROX_NODE_SCANNING_ENDPOINT
              value: 127.0.0.1:8444
          image: quay.io/stackrox-io/main:5.0.0@sha256:6b9c59d72f693f2a374e27766d22cef31c7e1a1ba3b69c240b96867b53b81824
          imagePullPolicy: IfNotPresent
          name: compliance
          resources:
            limits:
              cpu: "30m"
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 128Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - NET_RAW
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              type: container_runtime_t
          volumeMounts:
            - mountPath: /etc/ssl/
              name: etc-ssl
            - mountPath: /etc/pki/ca-trust/
              name: etc-pki-volume
            - mountPath: /host
              name: host-root-ro
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /run/secrets/stackrox.io/certs/
              name: certs
              readOnly: true
            - mountPath: /hostindex/usr/share
              name: usr-share-ro
              readOnly: true
            - mountPath: /hostindex/usr/lib
              name: usr-lib-ro
              readOnly: true
            - mountPath: /tmp
              name: index-volume
      volumes:
        - hostPath:
            path: /proc
          name: proc-ro
        - hostPath:
            path: /etc
          name: etc-ro
        - hostPath:
            path: /usr/lib
          name: usr-lib-ro
        - hostPath:
            path: /sys/
          name: sys-ro
        - hostPath:
            path: /dev
          name: dev-ro
        - name: certs
          secret:
            secretName: tls-cert-collector
        - hostPath:
            path: /
          name: host-root-ro
        - hostPath:
            path: /usr/share
          name: usr-share-ro
        - name: index-volume
          emptyDir: {}
        - name: etc-ssl
          emptyDir: {}
        - name: etc-pki-volume
          emptyDir: {}
        - name: collector-profiles
          emptyDir: {}
        - name: collector-config
          configMap:
            name: collector-config
            optional: true
        - name: fact-config
          configMap:
            name: fact-config
            optional: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
