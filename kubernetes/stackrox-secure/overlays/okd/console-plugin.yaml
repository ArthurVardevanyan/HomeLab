---
# ConsolePlugin integrates ACS vulnerability management view into the
# OpenShift web console. It is cluster-scoped and requires the console
# operator to reference it in its spec.plugins list (see README.md).
#
# Provenance:
#   Derived from upstream helm-charts repo:
#     stackrox/stackrox-secured-cluster-services
#     templates/console-plugin.yaml (chart stackrox-500.x.y)
#
# This template is only rendered when installMethod == operator,
# so we vendor it here for Helm/GitOps-only users.
#
# To update on StackRox version bumps:
#   1. Diff this file against the upstream template
#      in the community operator fork
#      (stackrox-charts/stackrox helm-charts templates/console-plugin.yaml).
#   2. Update displayName, basePath, proxy aliases if changed.
#   3. Verify the sensor-proxy Service, proxy-https port (9444),
#      and network policies are present in the base overlay.
#
# Only renders on OpenShift 4.19+ / Kubernetes 1.32+ (see upstream gate).
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: advanced-cluster-security
  labels:
    app.kubernetes.io/component: console-plugin
    app.kubernetes.io/instance: stackrox-secured-cluster-services
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: stackrox
    app.kubernetes.io/part-of: stackrox-secured-cluster-services
    app.kubernetes.io/version: "5.0"
spec:
  displayName: Red Hat Advanced Cluster Security for OpenShift
  backend:
    type: Service
    service:
      name: sensor-proxy
      namespace: stackrox
      port: 443
      basePath: /proxy/central/static/ocp-plugin
  proxy:
    - alias: api-service
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: sensor-proxy
          namespace: stackrox
          port: 443
