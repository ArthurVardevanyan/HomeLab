---
# Source: coraza-kubernetes-operator/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coraza-kubernetes-operator-default-deny
  namespace: coraza-system
  labels:
    helm.sh/chart: coraza-kubernetes-operator-0.5.0
    app.kubernetes.io/name: coraza-kubernetes-operator
    app.kubernetes.io/instance: coraza-kubernetes-operator
    control-plane: coraza-controller-manager
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coraza-kubernetes-operator
      app.kubernetes.io/instance: coraza-kubernetes-operator
      control-plane: coraza-controller-manager
  policyTypes:
    - Ingress
  # The cache server port (18080) is NOT listed below on purpose.
  # Per-Engine NetworkPolicies are created dynamically by the controller to
  # allow only the specific gateway workloads that need xDS access. Kubernetes
  # NetworkPolicies are additive, so those policies extend this one without
  # conflict.
  ingress:
    # Health probes (startup, liveness, readiness) — the kubelet connects
    # from the node IP so no source restriction is applied.
    - ports:
        - port: 8081
          protocol: TCP
    # Metrics endpoint (HTTPS with authentication).
    - ports:
        - port: 8443
          protocol: TCP
