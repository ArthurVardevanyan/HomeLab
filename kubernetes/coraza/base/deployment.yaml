---
# Source: coraza-kubernetes-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coraza-kubernetes-operator
  namespace: coraza-system
  labels:
    helm.sh/chart: coraza-kubernetes-operator-0.5.0
    app.kubernetes.io/name: coraza-kubernetes-operator
    app.kubernetes.io/instance: coraza-kubernetes-operator
    control-plane: coraza-controller-manager
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coraza-kubernetes-operator
      app.kubernetes.io/instance: coraza-kubernetes-operator
      control-plane: coraza-controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: coraza-kubernetes-operator
        app.kubernetes.io/instance: coraza-kubernetes-operator
        control-plane: coraza-controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      enableServiceLinks: false
      containers:
        - name: manager
          # Built from upstream main@9793e9899cc8a81ed741194d81356f50c3dbee5a
          # (dogfood: ECDS + bundled envoy-coraza with CRS v4.30.0 embedded);
          # see kubernetes/coraza/README.md for the rebuild procedure.
          image: "registry.arthurvardevanyan.com/homelab/coraza-kubernetes-operator:main-20261119-9793e98@sha256:c07bd261dae21fb1e4e29f3402ad5f933e04df8e083d354f445327426dcdf311"
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --envoy-cluster-name=outbound|80||coraza-kubernetes-operator.coraza-system.svc.cluster.local
            - --cache-gc-interval=5m
            - --istio-revision=openshift-gateway
            - --operator-name=coraza-kubernetes-operator
            - --xds-cert-path=/etc/coraza-tls
            - --xds-cert-name=tls.crt
            - --xds-key-name=tls.key
            - --xds-ca-path=/etc/coraza-tls/ca.crt
            - --xds-auth-failure-rate=10
            - --xds-auth-failure-burst=1024
            - --zap-devel=false
            - --zap-encoder=json
            - --zap-log-level=info
            - --zap-stacktrace-level=error
            - --zap-time-encoding=rfc3339nano
          ports:
            - name: xds
              containerPort: 18080
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - "ALL"
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: xds-serving-cert
              mountPath: /etc/coraza-tls
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 128Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
      volumes:
        - name: xds-serving-cert
          secret:
            secretName: coraza-kubernetes-operator-serving-cert
      serviceAccountName: coraza-kubernetes-operator
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      schedulerName: default-scheduler
      dnsPolicy: ClusterFirst
