---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-tekton-hpa
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        object.kind == 'HorizontalPodAutoscaler' &&
        object.metadata.name == 'tekton-pipelines-webhook'
      name: matches-hpa
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - autoscaling
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - horizontalpodautoscalers
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          [JSONPatch{op: 'add', path: '/spec/minReplicas', value: 2}]
      patchType: JSONPatch
