    checkov.io/skip1: CKV_K8S_155=Required
    checkov.io/skip2: CKV_K8S_158=Required
    # The meta-operator manages arbitrary Tekton CRD kinds (TektonConfig,
    # TektonAddon, TektonTrigger, ...) it can't enumerate in advance, so
    # `resources: ["*"]` is required within its own tekton.dev/operator.tekton.dev/
    # dashboard.tekton.dev API groups - matches the checkov.io/skip1-2 rationale
    # above. NOTE: this annotation is not yet honored by the currently-released
    # k8s-gitops-ci (named-ports/podspec-defaults/rbac-wildcards checks don't
    # populate Finding.Value/Annotations yet - see ArthurVardevanyan/k8s-gitops-ci
    # follow-up); kubernetes/tekton/test.sh carries the equivalent EXEMPTIONS
    # selector as the functional bridge until that ships, and can be dropped once
    # this annotation alone is honored.
    gitops-ci.k8s.io/exempt-rbac-wildcards: resources
  labels:
    operator.tekton.dev/release: v0.81.0
    version: v0.81.0
