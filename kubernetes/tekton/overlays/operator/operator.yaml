apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    operator.tekton.dev/release: "v0.81.0"
    version: "v0.81.0"
  name: openshift-pipelines-operator
  namespace: openshift-pipelines-operator
  annotations:
    checkov.io/skip1: CKV_K8S_40=OpenShift Injects Random UID
    checkov.io/skip2: CKV_K8S_23=https://github.com/tektoncd/operator/issues/1772
    checkov.io/skip3: CKV_K8S_8=Not Provided
    checkov.io/skip4: CKV_K8S_9=Not Provided
    checkov.io/skip6: CKV_K8S_38=Operator Needs API Access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-pipelines-operator
      name: openshift-pipelines-operator
  template:
    metadata:
      labels:
        app: openshift-pipelines-operator
        name: openshift-pipelines-operator
      annotations:
        openshift.io/required-scc: "restricted-v2"
    spec:
      containers:
        - args:
            - -controllers
            - tektonconfig,tektonpipeline,tektontrigger,tektonchain,tektonaddon,tektonresult,openshiftpipelinesascode,manualapprovalgate,tektonpruner,tektonscheduler,tektonmulticlusterproxyaae,syncerservice
            - -unique-process-name
            - tekton-operator-lifecycle
          env:
            - name: KUBERNETES_MIN_VERSION
              value: v1.0.0
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PLATFORM
              value: openshift
            - name: POD_NAME
              valueFrom:
                fieldRef:
