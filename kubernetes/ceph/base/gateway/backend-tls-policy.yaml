apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: ceph
  namespace: rook-ceph
  labels:
    app.kubernetes.io/instance: ceph
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: rook-ceph-mgr-dashboard
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ca-bundle
    # The backend serves the service-CA-operator issued cert, which is
    # scoped to the dedicated cert Service's DNS name, not the public route.
    hostname: rook-ceph-mgr-dashboard-cert.rook-ceph.svc
