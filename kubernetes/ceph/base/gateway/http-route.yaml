---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph
  namespace: rook-ceph
  annotations:
    externaldns.k8s.io: unifi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ceph
      namespace: rook-ceph
  hostnames: ["ceph.okd.homelab.arthurvardevanyan.com"]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: rook-ceph-mgr-dashboard
          namespace: rook-ceph
          port: 8443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
