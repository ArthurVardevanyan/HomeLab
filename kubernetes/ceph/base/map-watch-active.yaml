---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-ceph-watch-active
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        'app' in object.metadata.labels
        && object.metadata.labels['app'] == 'rook-ceph-mgr'
      name: label-matches
    - expression: >-
        has(object.spec.template)
        && has(object.spec.template.spec)
        && has(object.spec.template.spec.containers)
        && object.spec.template.spec.containers
          .filter(c, c.name == 'watch-active')
          .size() > 0
      name: needs-patching
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
                      .filter(c, c.name == 'watch-active')
                      .map(c,
                        !has(c.resources)
                        ? [JSONPatch{op: 'add',
                            path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources',
                            value: {"limits": {"cpu": '150m', "memory": '128Mi'}, "requests": {"cpu": '15m', "memory": '32Mi'}}}]
                        : ((has(c.resources.limits)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/limits/cpu', value: '150m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/limits/memory', value: '128Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/limits',
                          value: {"cpu": '150m', "memory": '128Mi'}}])
                    + (has(c.resources.requests)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests/cpu', value: '15m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests/memory', value: '32Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests',
                          value: {"cpu": '15m', "memory": '32Mi'}}]))
                      )
                      .flatten()
      patchType: JSONPatch
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: map-ceph-watch-active-binding
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: rook-ceph
  policyName: map-ceph-watch-active
