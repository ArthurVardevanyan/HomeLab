---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: rook-ceph-obj
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  metadataPool:
    failureDomain: host
    replicated:
      size: 3
  dataPool:
    failureDomain: host
    # For production it is recommended to use more chunks, such as 4+2 or 8+4
    erasureCoded:
      dataChunks: 2
      codingChunks: 1
  preservePoolsOnDelete: true
  gateway:
    # sslCertificateRef:
    port: 8080
    # securePort: 443
    instances: 2
    resources:
      limits:
        cpu: "3"
        memory: 8Gi
      requests:
        cpu: "75m"
        memory: 512Mi
    # Workaround for minio-go v7.x SigV4 incompatibility with Ceph v20.2.4+
    # RGW strict SigV4 enforcement rejects requests missing Content-Type in SignedHeaders.
    # Setting to "false" relaxes this to warn-only until minio-go v7.x fix is released.
    # See: https://github.com/minio/minio-go/pull/2301
    # See: https://github.com/ceph/ceph/pull/71364
    rgwConfig:
      rgw_sig_v4_strict: "false"
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ceph-rgw
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ceph-rgw
