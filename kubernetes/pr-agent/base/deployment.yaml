---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-agent
  namespace: pr-agent
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pr-agent
  template:
    metadata:
      labels:
        app: pr-agent
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: pr-agent
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/gpu: ""
      containers:
        - name: pr-agent
          # renovate: datasource=docker depName=pragent
          image: docker.io/pragent/pr-agent:0.44.0-github_app@sha256:be350ea796f912b1a58a551321c1267686522f40ce94adc9cc2fffb4fcbaddd1
          imagePullPolicy: IfNotPresent
          env:
            - name: GITHUB__DEPLOYMENT_TYPE
              value: "app"
            - name: GITHUB__APP_ID
              valueFrom:
                secretKeyRef:
                  name: pr-agent-secret
                  key: github_app
            - name: GITHUB__PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: pr-agent-secret
                  key: github_pk
            - name: GITHUB__WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-agent-secret
                  key: webhook_secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pr-agent-secret
                  key: openai_api_key
            - name: CONFIG__MODEL
              value: "openai/qwen3.6-35b-a3b"
            - name: LITELLM__CUSTOM_LLM_PROVIDER
              value: "openai"
            - name: OPENAI__API_BASE
              value: "http://litellm-svc.llm.svc.cluster.local.:4000/v1"
            - name: CONFIG__CUSTOM_MODEL_MAX_TOKENS
              value: "32768"
            - name: CONFIG__MAX_MODEL_TOKENS
              value: "32768"
            # Empty string here is not a no-op: PR Agent splits it on "," into
            # [''] and appends that to the model list, so every timeout is
            # immediately followed by a guaranteed second failure ("Invalid
            # model name passed in model="). An empty list means what it says.
            - name: CONFIG__FALLBACK_MODELS
              value: "[]"
            # PR Agent always publishes its own check runs with conclusion:
            # "neutral" (hardcoded in github_provider.py, not configurable) -
            # GitHub renders this as a grey/unfilled icon regardless of
            # whether issues were found, so the check status carries no
            # actionable signal. Publishing as a PR comment instead keeps
            # the (legible) findings visible in the conversation feed.
            - name: GITHUB__PUBLISH_AS_CHECK_RUN
              value: "false"
            - name: GITHUB_APP__HANDLE_PR_ACTIONS
              value: '["opened", "reopened", "ready_for_review"]'
            - name: GITHUB_APP__PR_COMMANDS
              value: '["/describe", "/review", "/improve"]'
            - name: GITHUB_APP__HANDLE_PUSH_TRIGGER
              value: "true"
            - name: GITHUB_APP__PUSH_COMMANDS
              value: '["/describe", "/review"]'
            # Default (true) allows 2 concurrent push-triggered tasks per PR;
            # a rapid second push doubles GPU load instead of queueing behind
            # the first. false caps it at 1.
            - name: GITHUB_APP__PUSH_TRIGGER_PENDING_TASKS_BACKLOG
              value: "false"
            - name: PERSISTENT_COMMENT
              value: "true"
            - name: CONFIG__IGNORE_BOT_PR
              value: "true"
            - name: CONFIG__OUTPUT_RUN_DETAILS
              value: "true"
            - name: CONFIG__ENABLE_PR_DESCRIPTION
              value: "true"
            - name: CONFIG__ENABLE_PR_DIAGRAM
              value: "true"
            - name: CONFIG__ENABLE_SEMANTIC_FILES_TYPES
              value: "true"
            - name: CONFIG__TEMPERATURE
              value: "0.2"
            - name: CONFIG__IGNORE_PR_SOURCE_BRANCHES
              value: '["^dependabot/", "^renovate/", "^auto/"]'
            # config.request_timeout is dead config for this deployment - it
            # only backs bitbucket_app.request_timeout / asana.request_timeout,
            # neither of which applies here. The LLM call timeout is actually
            # config.ai_timeout (litellm_ai_handler.py), which defaults to
            # 120s - too short for a 35B model shared across GPUs under load,
            # and the true cause of repeated APITimeoutErrors. Raised to 600s.
            - name: CONFIG__AI_TIMEOUT
              value: "600"
            - name: WORKER_TIMEOUT
              value: "120"
            - name: GUNICORN_WORKERS
              value: "3"
          # The Docker image's CMD runs gunicorn directly with no graceful
          # shutdown — gunicorn defaults to killing workers 3s after SIGTERM,
          # which silently drops any in-flight BackgroundTasks (the PR review
          # runs in the background after the HTTP response is already sent).
          # Override the command to insert --graceful-timeout 660 so workers
          # get 11 min after SIGTERM to finish in-flight reviews.
          command:
            - python
          args:
            - -m
            - gunicorn
            - -k
            - uvicorn.workers.UvicornWorker
            - -c
            - pr_agent/servers/gunicorn_config.py
            - --graceful-timeout
            - "660"
            - --forwarded-allow-ips
            - "*"
            - pr_agent.servers.github_app:app
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 30
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: 512Mi
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: 1Gi
              ephemeral-storage: "128Mi"
          volumeMounts:
            - name: azure-cache
              mountPath: /.azure-devops
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
      volumes:
        - name: azure-cache
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: var-tmp
          emptyDir:
            sizeLimit: 100Mi
