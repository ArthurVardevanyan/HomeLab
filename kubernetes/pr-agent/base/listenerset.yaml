---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: pr-agent
  namespace: pr-agent
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway-external
    namespace: openshift-ingress
  listeners:
    - name: https
      hostname: "pr-agent.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: pr-agent-cert
