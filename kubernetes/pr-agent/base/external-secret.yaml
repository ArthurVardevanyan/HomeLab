---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-agent-secret
  namespace: pr-agent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pr-agent-secret
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Dynaconf coerces a bare numeric env var to int; PyJWT >=2.10
        # requires the JWT "iss" claim to be a string.
        github_app: '"{{ .github_app }}"'
  data:
    - secretKey: github_app
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/tekton
        property: github_app
        metadataPolicy: None
    - secretKey: github_pk
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/tekton
        property: github_pk
        metadataPolicy: None
    - secretKey: webhook_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/tekton
        property: webhook
        metadataPolicy: None
    - secretKey: openai_api_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/litellm/pr-agent
        property: api_key
        metadataPolicy: None
