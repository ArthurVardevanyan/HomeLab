---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: perses
  namespace: observability-operator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      # The Perses instance managed by the Cluster Observability Operator's
      # monitoring UIPlugin serves /metrics over HTTPS only (service serving
      # cert signed by the cluster service CA).
      scheme: https
      tlsConfig:
        caFile: /etc/prometheus/configmaps/serving-certs-ca-bundle/service-ca.crt
        serverName: perses.observability-operator.svc
  namespaceSelector:
    matchNames:
      - observability-operator
  selector:
    matchLabels:
      app.kubernetes.io/instance: perses
      app.kubernetes.io/name: perses
