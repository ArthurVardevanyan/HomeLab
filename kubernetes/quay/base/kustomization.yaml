---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./limit-range.yaml
  - ./operator-group.yaml
  - ./subscription.yaml
  - ./network-policy.yaml
  - ./quay.yaml
  - ./installplan-approver.yaml
  - ./pdb.yaml
  - ./map-quay-mutate-tls.yaml
  - ./map-quay-mutate-tls-binding.yaml
  - ./map-quay-clair-indexer-storage.yaml
  - ./map-quay-clair-indexer-storage-binding.yaml
  - ./map-quay-mirror.yaml
  - ./egress-firewall.yaml
  - ./dragonfly/dragonfly.yaml
  - ./dragonfly/network-policy.yaml
  - ./object-bucket-claim.yaml
  - ./velero.yaml
  - ./hpa/quay.yaml
  - ./hpa/mirror.yaml
  - ./hpa/clair.yaml
  - ./gateway
  - ./vpa.yaml
  - ./quay-quay-app-service.yaml
  - ./quay-cert-sync-job.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - files:
      - config.yaml
      - clair-config.yaml
    name: quay-config-bundle
    namespace: quay
