apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: quay
  namespace: quay
  labels:
    app.kubernetes.io/instance: quay
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: quay-quay-app
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: openshift-service-ca.crt
        namespace: openshift-config-managed
    hostname: quay-quay-app.quay.svc
