---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: quay
  namespace: quay
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway
    namespace: openshift-ingress
  listeners:
    - name: https
      hostname: "registry.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: quay-gateway-cert
