---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-quay-clair-indexer-storage
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        object.kind == 'Deployment' &&
        object.metadata.name == 'quay-clair-app'
      name: matches-deployment
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.volumes
            .filter(v, v.name == 'indexer-layer-storage')
            .map(v, JSONPatch{
              op: 'replace',
              path: '/spec/template/spec/volumes/' +
                string(object.spec.template.spec.volumes.indexOf(v)),
              value: {
                "ephemeral": {
                  "volumeClaimTemplate": {
                    "metadata": {},
                    "spec": {
                      "accessModes": ["ReadWriteOnce"],
                      "resources": {"requests": {"storage": "50Gi"}},
                      "storageClassName": "rook-ceph-block-ci",
                      "volumeMode": "Filesystem"
                    }
                  }
                },
                "name": "indexer-layer-storage"
              }
            })
      patchType: JSONPatch
