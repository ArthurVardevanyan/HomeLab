---
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: mutate-tls-to-ssl
  namespace: quay
spec:
  background: false
  rules:
    - name: MutateTLSKeys
      skipBackgroundRequests: true
      match:
        resources:
          kinds:
            - Secret
          name: quay-config-bundle
      mutate:
        patchesJson6902: |-
          - path: /data/ssl.cert
            op: add
            value: '{{ request.object.data."tls.crt" }}'
          - path: /data/ssl.key
            op: add
            value: '{{ request.object.data."tls.key" }}'
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: Equals
            value: "system:serviceaccount:cert-manager:cert-manager"
---
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: override-clair-indexer-storage
  namespace: quay
spec:
  rules:
    - name: override-indexer-layer-storage
      skipBackgroundRequests: true
      match:
        resources:
          kinds:
            - Deployment
          names:
            - quay-clair-app
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                volumes:
                  - (name): "indexer-layer-storage"
                    ephemeral:
                      volumeClaimTemplate:
                        spec:
                          resources:
                            requests:
                              storage: 50Gi
                          storageClassName: rook-ceph-block-ci
