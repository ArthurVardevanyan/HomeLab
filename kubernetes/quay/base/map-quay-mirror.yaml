---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-quay-mirror
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        'quay-component' in object.metadata.labels
        && object.metadata.labels['quay-component'] == 'quay-mirror'
      name: label-matches
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.initContainers
                      .filter(c, c.name == 'quay-mirror-init')
                      .map(c,
                        !has(c.resources)
                        ? [JSONPatch{op: 'add',
                            path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources',
                            value: {"limits": {"cpu": '100m', "memory": '32Mi'}, "requests": {"cpu": '5m', "memory": '16Mi'}}}]
                        : ((has(c.resources.limits)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources/limits/cpu', value: '100m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources/limits/memory', value: '32Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources/limits',
                          value: {"cpu": '100m', "memory": '32Mi'}}])
                    + (has(c.resources.requests)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources/requests/cpu', value: '5m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources/requests/memory', value: '16Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/initContainers/' +
                              string(object.spec.template.spec.initContainers.indexOf(c)) +
                              '/resources/requests',
                          value: {"cpu": '5m', "memory": '16Mi'}}]))
                      )
                      .flatten()
      patchType: JSONPatch
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: map-quay-mirror-binding
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: quay
  policyName: map-quay-mirror
