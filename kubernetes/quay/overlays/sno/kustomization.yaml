---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/cnpg-clair
  - ../../components/cnpg-quay
patches:
  - patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/storageClass
        value: lvms-vg1-immediate
      - op: replace
        path: /spec/walStorage/storageClass
        value: lvms-vg1-immediate
    target:
      kind: Cluster
      name: quay
  - patch: |-
      - op: replace
        path: /spec/storage/storageClass
        value: lvms-vg1-immediate
      - op: replace
        path: /spec/walStorage/storageClass
        value: lvms-vg1-immediate
    target:
      kind: Cluster
      name: clair
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: quay-app
        namespace: quay
      $patch: delete
  - patch: |-
      apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      metadata:
        name: quay
        namespace: quay
      $patch: delete
