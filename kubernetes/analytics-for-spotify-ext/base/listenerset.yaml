---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: analytics-for-spotify-ext
  namespace: analytics-for-spotify-ext
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway-external
    namespace: openshift-ingress
  listeners:
    - name: spotify
      hostname: "analytics-for-spotify.arthurdevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            gateway-tenancy: external
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: analytics-for-spotify-cert
