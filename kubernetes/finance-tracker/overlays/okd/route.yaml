---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finance-tracker
  namespace: finance-tracker
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: https-gateway
      namespace: openshift-ingress

    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: finance-tracker
      namespace: finance-tracker
  hostnames: ["https-gateway"]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: finance-tracker
