---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          metallb.universe.tf/loadBalancerIPs: "10.101.9.250"
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/loadBalancerClass
        value: metallb.io/metallb-class
      - op: add
        path: /spec/externalTrafficPolicy
        value: Cluster
      - op: add
        path: /spec/internalTrafficPolicy
        value: Cluster
    target:
      kind: Service
      name: pxe-server
