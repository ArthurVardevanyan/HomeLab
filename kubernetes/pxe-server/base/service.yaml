---
apiVersion: v1
kind: Service
metadata:
  name: pxe-server
  namespace: pxe-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: tftp
      port: 69
      targetPort: tftp
      protocol: UDP
  selector:
    app: pxe-server
