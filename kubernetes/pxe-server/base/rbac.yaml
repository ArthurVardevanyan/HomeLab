---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pxe-server
  namespace: pxe-server

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pxe-server
  namespace: pxe-server
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pxe-server
  namespace: pxe-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pxe-server
subjects:
  - kind: ServiceAccount
    name: pxe-server
    namespace: pxe-server
