---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rekor
  namespace: rekor
  labels:
    app.kubernetes.io/instance: rekor
spec:
  namespaceSelector:
    matchNames:
      - rekor
  selector:
    matchLabels:
      app.kubernetes.io/instance: rekor
  endpoints:
    - port: http
      path: /metrics
      scheme: http
