---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: rekor
  namespace: rekor
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: rekor
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rekor
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: rekor
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: "1"
          memory: 512Mi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
