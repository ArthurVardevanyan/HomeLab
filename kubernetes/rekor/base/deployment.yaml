---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rekor
  namespace: rekor
  labels:
    app.kubernetes.io/name: rekor
    app.kubernetes.io/instance: rekor
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: rekor
  template:
    metadata:
      labels:
        app: rekor
      annotations:
        seccomp.security.alpha.kubernetes.io/defaultProfileName: "runtime/default"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        supplementalGroups:
          - 0
      hostname: rekor
      restartPolicy: Always
      schedulerName: default-scheduler
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      serviceAccountName: rekor
      enableServiceLinks: false
      containers:
        # renovate: datasource=docker depName=ghcr.io/sigstore/rekor/rekor-server
        - image: ghcr.io/sigstore/rekor/rekor-server:v1.5.5@sha256:83ce4593db1b2d4c71598f66023ef283ef4f6c73293017095ad4ad5dd4f982b0
          imagePullPolicy: IfNotPresent
          name: rekor
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          args:
            - serve
            - --rekor_server.address=0.0.0.0
            - --rekor_server.hostname=rekor.arthurvardevanyan.com
            - --port=8080
            - --trillian_log_server.address=trillian
            - --trillian_log_server.port=8090
            - --search_index.storage_provider=redis
            - --redis_server.address=valkey
            - --redis_server.password=$(REDIS_PASSWORD)
            - --rekor_server.signer=/var/run/rekor/signer.pem
            - --rekor_server.signer-passwd=$(SIGNER_PASSWD)
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rekor-secrets
                  key: redis.password
            - name: SIGNER_PASSWD
              valueFrom:
                secretKeyRef:
                  name: rekor-secrets
                  key: signer.password
          volumeMounts:
            - name: signer
              mountPath: /var/run/rekor
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: signer
          secret:
            secretName: rekor-secrets
            items:
              - key: signer.pem
                path: signer.pem
