---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rekor-secrets
  namespace: rekor
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: rekor-secrets
    creationPolicy: Owner
  data:
    - secretKey: signer.pem
      remoteRef:
        key: homelab/rekor
        property: signer.pem
    - secretKey: signer.password
      remoteRef:
        key: homelab/rekor
        property: signer.password
    - secretKey: redis.password
      remoteRef:
        key: homelab/rekor
        property: redis.password
