      to:
        dnsName: router-apps.app.okd.homelab.arthurvardevanyan.com
    - type: Allow
      to:
        dnsName: thanos-querier-openshift-monitoring.apps.okd.homelab.arthurvardevanyan.com
    - type: Allow
      to:
        dnsName: rekor.sigstore.dev
    # Google Cloud IPv4 ranges (storage.googleapis.com)
    - type: Allow
      to:
        cidrSelector: 8.8.4.0/24
      ports:
        - protocol: TCP
          port: 443
