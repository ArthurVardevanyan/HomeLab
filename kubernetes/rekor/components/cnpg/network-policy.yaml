---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-rekor-app
  namespace: rekor
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/instance: rekor
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: rekor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rekor
          podSelector:
            matchLabels:
              app: rekor
      ports:
        - protocol: TCP
          port: 5432
---
