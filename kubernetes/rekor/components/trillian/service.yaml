---
apiVersion: v1
kind: Service
metadata:
  name: trillian
  namespace: rekor
  labels:
    app.kubernetes.io/instance: rekor
spec:
  ports:
    - name: grpc
      port: 8090
      protocol: TCP
      targetPort: grpc
    - name: http
      port: 8091
      protocol: TCP
      targetPort: http
  selector:
    app: trillian
  type: ClusterIP
