---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-coder
  namespace: ollama
  labels:
    app: ollama-coder
  annotations:
    checkov.io/skip1: CKV_K8S_40=Upstream Image Runs as Root
    checkov.io/skip2: CKV_K8S_22=Models Cache Requires Writable Root FS
    checkov.io/skip3: CKV_K8S_43=Sha Changes Often
spec:
  # Default scaled to 0 to free the GPU; scale to 1 to load the models.
  replicas: 0
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-coder
  template:
    metadata:
      labels:
        app: ollama-coder
    spec:
      hostname: ollama-coder
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: ollama
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: false # true
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      # Intel Arc Pro B70 (xe KMD) GPU node (gpu-1), labeled by the NFD
      # NodeFeatureRule in the node-feature-discovery-operator app.
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_8086.present: "true"
      containers:
        # IPEX-LLM image ships an Ollama build for Intel XPU.
        # renovate: datasource=docker depName=docker.io/intelanalytics/ipex-llm-inference-cpp-xpu
        - image: docker.io/intelanalytics/ipex-llm-inference-cpp-xpu:2.2.0b20250101@sha256:f79afc7735ec02bba680cefcffa28a4946891079889adadd3249798184df1ae3
          imagePullPolicy: IfNotPresent
          name: ollama
          # Launch the bundled Intel XPU Ollama start script rather than the
          # stock ollama entrypoint.
          command:
            - /bin/bash
            - "-c"
            - |
              set -eu
              export OLLAMA_HOST=0.0.0.0:11434
              export OLLAMA_MODELS=/.ollama/models
              export OLLAMA_NUM_GPU=999
              export ONEAPI_DEVICE_SELECTOR=level_zero:0
              export ZES_ENABLE_SYSMAN=1
              export SYCL_CACHE_PERSISTENT=1
              mkdir -p "${OLLAMA_MODELS}"
              /llm/scripts/start-ollama.sh &
              sleep 8
              ollama pull qwen3-coder:30b || true
              wait
          securityContext:
            runAsNonRoot: false # true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "49152"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0"
          ports:
            - containerPort: 11434
              name: api
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: "256Mi"
            limits:
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: "1Gi"
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: ollama-config
              mountPath: /.ollama
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: ollama-config
          persistentVolumeClaim:
            claimName: ollama-storage
