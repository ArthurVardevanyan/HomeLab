---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-coder
  namespace: ollama
  labels:
    app: ollama-coder
  annotations:
    checkov.io/skip1: CKV_K8S_40=Upstream Image Runs as Root
    checkov.io/skip2: CKV_K8S_22=Model Cache Requires Writable Root FS
    checkov.io/skip3: CKV_K8S_43=Sha Changes Often
spec:
  # Default scaled to 0 to free the GPU; scale to 1 to load the model.
  replicas: 0
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-coder
  template:
    metadata:
      labels:
        app: ollama-coder
    spec:
      hostname: ollama-coder
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: ollama
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: false # true
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      # Intel Arc Pro B70 (xe KMD) GPU node (gpu-1). Built-in NFD label for an
      # Intel (8086) display-class PCI device.
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_8086.present: "true"
      initContainers:
        # Pre-download both GGUFs into the PVC so first requests are fast and
        # the router startup probe timing stays sane.
        #
        # HuggingFace serves these files via Xet-backed CDN. A single curl
        # stream is one TCP connection and badly underutilizes a fast link, so
        # we split each file into parallel byte-range chunks (the CDN advertises
        # `accept-ranges: bytes`) and reassemble. Idempotent: skips a file that
        # already exists at the correct size.
        - image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:3dd0b326c9899cf7a7491fcafba51f54e78af2a366953769a847dd380a732420
          imagePullPolicy: IfNotPresent
          name: model-downloader
          env:
            # Number of parallel connections and chunk size per range request.
            - name: PARALLEL
              value: "16"
            - name: CHUNK_BYTES
              value: "268435456" # 256 MiB
          command:
            - /bin/sh
            - "-c"
            - |
              set -eu
              MODELS=/.ollama/models
              mkdir -p "${MODELS}"

              dl() {
                name="$1"; src="$2"
                out="${MODELS}/${name}"

                # Resolve the redirect to the signed CDN URL and its size.
                cdn=$(curl -sIL "${src}" | awk 'BEGIN{IGNORECASE=1}/^location:/{u=$2}/^content-length:/{c=$2}END{print u}' | tr -d '\r')
                [ -z "${cdn}" ] && cdn="${src}"
                size=$(curl -sIL "${src}" | awk 'BEGIN{IGNORECASE=1}/^content-length:/{c=$2}END{print c}' | tr -d '\r')

                if [ -f "${out}" ]; then
                  have=$(wc -c < "${out}" | tr -d ' ')
                  if [ -n "${size}" ] && [ "${have}" = "${size}" ]; then
                    echo "Present (${have} bytes): ${name}"; return 0
                  fi
                  echo "Re-downloading ${name} (size mismatch: have ${have}, want ${size})"
                  rm -f "${out}"
                fi

                echo "Downloading ${name} (${size} bytes) with ${PARALLEL} parallel connections ..."
                work="${MODELS}/.dl-${name}"
                rm -rf "${work}"; mkdir -p "${work}"

                offset=0; idx=0; pids=""; running=0
                while [ "${offset}" -lt "${size}" ]; do
                  end=$((offset + CHUNK_BYTES - 1))
                  [ "${end}" -ge "${size}" ] && end=$((size - 1))
                  part=$(printf '%s/part.%08d' "${work}" "${idx}")
                  curl -fsS --retry 5 --retry-delay 5 -r "${offset}-${end}" -o "${part}" "${cdn}" &
                  pids="${pids} $!"
                  running=$((running + 1))
                  if [ "${running}" -ge "${PARALLEL}" ]; then
                    wait ${pids}; pids=""; running=0
                  fi
                  offset=$((end + 1)); idx=$((idx + 1))
                done
                [ -n "${pids}" ] && wait ${pids}

                echo "Reassembling ${idx} chunks ..."
                : > "${out}.part"
                i=0
                while [ "${i}" -lt "${idx}" ]; do
                  cat "$(printf '%s/part.%08d' "${work}" "${i}")" >> "${out}.part"
                  i=$((i + 1))
                done
                rm -rf "${work}"

                got=$(wc -c < "${out}.part" | tr -d ' ')
                if [ "${got}" != "${size}" ]; then
                  echo "ERROR: ${name} size mismatch after reassembly (got ${got}, want ${size})" >&2
                  rm -f "${out}.part"; return 1
                fi
                mv "${out}.part" "${out}"
                echo "Done (${got} bytes): ${name}"
              }

              dl "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf" \
                "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf?download=true"
              dl "Qwen3.6-27B-Q4_K_M.gguf" \
                "https://huggingface.co/unsloth/Qwen3.6-27B-GGUF/resolve/main/Qwen3.6-27B-Q4_K_M.gguf?download=true"
          securityContext:
            runAsNonRoot: false # true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: "256Mi"
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: "1Gi"
          volumeMounts:
            - name: ollama-config
              mountPath: /.ollama
      containers:
        # llama.cpp Vulkan server in ROUTER mode. Serves both Qwen3.6 models
        # from the preset; --models-max 1 keeps only one resident in VRAM
        # (evicts on swap), --sleep-idle-seconds unloads it after idle. Per B70
        # benchmarking this Vulkan backend is the fastest on Battlemage and
        # (unlike the IPEX ollama fork) tracks mainline for the newest models.
        #
        # Custom image = upstream server-vulkan + Mesa >= 26.1 (kisak PPA) for
        # the Battlemage cooperative-matrix path (~2x decode vs stock Mesa 26.0).
        # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan
        - image: registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan:not_latest
          imagePullPolicy: Always
          name: ollama
          args:
            - "--models-preset"
            - "/config/models.ini"
            # Only one model resident in VRAM at a time (both models cannot fit
            # in 32GB); requesting the other evicts the current one.
            - "--models-max"
            - "1"
            # Auto-unload the model (incl. KV cache) from VRAM after 8 hours idle.
            - "--sleep-idle-seconds"
            - "28800"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "11434"
            - "--metrics"
            - "--no-webui"
          env:
            # Model / HF cache lives on the PVC, not the root FS.
            - name: LLAMA_CACHE
              value: /.ollama/cache
            - name: HOME
              value: /.ollama
            - name: GGML_VK_VISIBLE_DEVICES
              value: "0"
            # Mesa shader cache to a writable path under the arbitrary UID.
            - name: MESA_SHADER_CACHE_DIR
              value: /.ollama/.mesa_cache
          securityContext:
            runAsNonRoot: false # true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 11434
              name: api
              protocol: TCP
          # startup/liveness use GET /models (router-level, stays HTTP 200 even
          # while a sub-model loads/swaps). readiness uses /health (returns 503
          # while a model loads) so the Service only routes when actually ready.
          startupProbe:
            httpGet:
              path: /models
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /models
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: "256Mi"
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: "1Gi"
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: ollama-config
              mountPath: /.ollama
            - name: router-preset
              mountPath: /config
              readOnly: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: ollama-config
          persistentVolumeClaim:
            claimName: ollama-storage
        - name: router-preset
          configMap:
            name: llama-router-preset
