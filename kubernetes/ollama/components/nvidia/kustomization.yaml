---
# Component: run the ollama-coder Deployment on NVIDIA GPUs instead of the
# default Intel (xe) base. Enable from an overlay's `components:` list.
#
# deployment.yaml holds the COMPLETE NVIDIA Deployment and uses `$patch: replace`
# on the pod template so the Intel base pod spec is fully overridden (no leftover
# Intel command / xe resource / xe nodeSelector).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: deployment.yaml
