---
apiVersion: che.eclipse.org/v1alpha1
kind: KubernetesImagePuller
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    gitops-ci.k8s.io/exempt-image-checksum: registry.arthurvardevanyan.com/homelab/toolbox:not_latest,registry.arthurvardevanyan.com/homelab/clair-action-db:latest,registry.arthurvardevanyan.com/homelab/udi:latest
  name: homelab
  namespace: kubernetes-imagepuller-operator
spec:
  configMapName: k8s-image-puller
  deploymentName: kubernetes-image-puller
  images: "toolbox=registry.arthurvardevanyan.com/homelab/toolbox:not_latest;clair=registry.arthurvardevanyan.com/homelab/clair-action-db:latest" # ;udi=registry.arthurvardevanyan.com/homelab/udi:latest"
  cachingCPULimit: 10m
  cachingCPURequest: 5m
  cachingMemoryLimit: 32Mi
  cachingMemoryRequest: 8Mi
  cachingIntervalHours: "6"
  tolerations: '[{"key":"node-role.kubernetes.io/gpu","operator":"Exists","effect":"NoSchedule"}]'
