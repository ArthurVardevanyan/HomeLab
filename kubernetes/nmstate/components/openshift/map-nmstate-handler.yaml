---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-nmstate-handler
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.spec.template) &&
        has(object.spec.template.spec) &&
        has(object.spec.template.spec.containers)
      name: has-containers
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - daemonsets
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
                      .filter(c, c.name == 'nmstate-handler')
                      .map(c,
                        !has(c.resources)
                        ? [JSONPatch{op: 'add',
                            path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources',
                            value: {"requests": {"cpu": '10m', "memory": '48Mi'}}}]
                        : ((has(c.resources.requests)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests/cpu', value: '10m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests/memory', value: '48Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests',
                          value: {"cpu": '10m', "memory": '48Mi'}}]))
                      )
                      .flatten()
      patchType: JSONPatch
