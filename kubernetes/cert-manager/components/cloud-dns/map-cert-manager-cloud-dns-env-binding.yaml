metadata:
  name: map-cert-manager-cloud-dns-env-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cert-manager
  policyName: map-cert-manager-cloud-dns-env
