---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-cert-manager-cloud-dns-env
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        'app' in object.metadata.labels &&
        object.metadata.labels['app'] == 'cert-manager'
      name: matches-label
    - expression: >-
        has(object.spec.template) &&
        has(object.spec.template.spec) &&
        has(object.spec.template.spec.containers)
      name: has-containers
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          (
            object.spec.template.spec.containers
              .filter(c, c.name == 'cert-manager-controller' && !has(c.env))
              .map(c, JSONPatch{
                op: 'add',
                path: '/spec/template/spec/containers/' +
                  string(object.spec.template.spec.containers.indexOf(c)) +
                  '/env',
                value: [{"name": 'GOOGLE_APPLICATION_CREDENTIALS', "value": '/var/run/secrets/google/credentials_config.json'}]
              })
            )
      patchType: JSONPatch
    - jsonPatch:
        expression: >-
          (
            object.spec.template.spec.containers
              .filter(c,
                c.name == 'cert-manager-controller'
                && has(c.env)
                && !c.env.exists(e, has(e.name) && e.name == 'GOOGLE_APPLICATION_CREDENTIALS')
              )
              .map(c, JSONPatch{
                op: 'add',
                path: '/spec/template/spec/containers/' +
                  string(object.spec.template.spec.containers.indexOf(c)) +
                  '/env/' + string(c.env.size()),
                value: {"name": 'GOOGLE_APPLICATION_CREDENTIALS', "value": '/var/run/secrets/google/credentials_config.json'}
              })
            )
      patchType: JSONPatch
