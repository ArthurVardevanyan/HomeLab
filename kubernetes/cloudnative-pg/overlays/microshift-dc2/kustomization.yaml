---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: deny-all
        namespace: cnpg-system
    target:
      kind: NetworkPolicy
      name: deny-all
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-dns-traffic
        namespace: cnpg-system
    target:
      kind: NetworkPolicy
      name: allow-dns-traffic
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-api-server
        namespace: cnpg-system
    target:
      kind: NetworkPolicy
      name: allow-api-server
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-openshift-monitoring
        namespace: cnpg-system
    target:
      kind: NetworkPolicy
      name: allow-openshift-monitoring
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-api-server-ingress
        namespace: cnpg-system
    target:
      kind: NetworkPolicy
      name: allow-api-server-ingress
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-managed-namespaces-egress
        namespace: cnpg-system
    target:
      kind: NetworkPolicy
      name: allow-managed-namespaces-egress
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: cnpg-default-alerts
        namespace: openshift-monitoring
    target:
      kind: PrometheusRule
      name: cnpg-default-alerts
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: cloudnativepg-alerts
        namespace: openshift-monitoring
    target:
      kind: PrometheusRule
      name: cloudnativepg-alerts
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: cnpg-controller-manager
        namespace: cnpg-system
    target:
      kind: PodMonitor
      name: cnpg-controller-manager
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/affinity
    target:
      kind: Deployment
      name: cnpg-controller-manager
