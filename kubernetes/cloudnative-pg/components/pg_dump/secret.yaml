---
apiVersion: v1
kind: Secret
metadata:
  name: pgdump-config
  namespace: cnpg-system
  labels:
    name: pgdump-config
    app.kubernetes.io/instance: cloudnative-pg
stringData:
  config.json: |
    {
      "version": "10",
      "aliases": {
        "truenas": {
          "url": "https://s3.unas.arthurvardevanyan.com",
          "accessKey": "<path:secret/data/homelab/minio#access_key>",
          "secretKey": "<path:secret/data/homelab/minio#access_key>",
          "api": "s3v4",
          "path": "auto"
        }
      }
    }
  pgdump.sh: |-
    #!/bin/sh

    LOCATION=/mnt/db-dump/pg_dump
    mkdir ${LOCATION}

    dump_db() {
      _NAME="$1"
      _URI="$2"
      _FILE="$3"
      echo "Dumping ${_NAME}"
      _START=$(date +%s)
      pg_dump -d "${_URI}" > "${LOCATION}/${_FILE}.sql" || rm -f "${LOCATION}/${_FILE}.sql"
      pg_dump -Fc -d "${_URI}" -f "${LOCATION}/${_FILE}.db" || rm -f "${LOCATION}/${_FILE}.db"
      echo "${_NAME} dump completed in $(($(date +%s) - _START))s"
    }

    # dump_db  "AWX"             "<path:secret/data/homelab/awx/postgres#db_uri>"      "awx"
    # dump_db "Clair"            "<path:secret/data/homelab/postgres#clair_uri>"       "clair"
    dump_db    "Finance Tracker" "<path:secret/data/finance-tracker/database/#uri>"    "finance-tracker"
    dump_db   "Gitea"            "<path:secret/data/homelab/gitea/postgres/#uri>"      "gitea"
    dump_db   "Grafana"          "<path:secret/data/homelab/grafana/postgres/#uri>"    "grafana"
    # dump_db "Homeassistant"    "<path:secret/data/homelab/homeassistant/#uri>"       "homeassistant"
    dump_db   "Immich"           "<path:secret/data/homelab/immich/#db_url>"           "immich"
    # dump_db   "NetBox"           "<path:secret/data/homelab/netbox#db_uri>"            "netbox"
    dump_db   "Nextcloud FPM"    "<path:secret/data/homelab/nextcloud/fpm/#db_uri>"    "nextcloud-fpm"
    dump_db   "Quay"             "<path:secret/data/homelab/postgres#quay_uri>"        "quay"
    dump_db   "Spotify"          "<path:secret/data/spotify/database/#uri>"            "spotify"
    dump_db   "Spotify External" "<path:secret/data/spotify/database_external/#uri>"   "spotify-external"
    dump_db   "Stackrox"         "<path:secret/data/homelab/stackrox/postgres#uri>"    "stackrox"
    dump_db   "Zitadel"          "<path:secret/data/homelab/zitadel/db#uri>"           "zitadel"
    dump_db  "Open WebUI"         "<path:secret/data/homelab/llm/open-webui#db_uri>"   "open-webui"
    dump_db   "LiteLLM"           "<path:secret/data/homelab/llm/litellm#db_uri>"      "litellm"

    find ${LOCATION} -maxdepth 1 -type f -empty -delete

    mkdir  /tmp/.mc
    cp /mnt/pg_dump/config.json /tmp/.mc/config.json

    # Generate rclone config from mc-style config.json
    _RC_DIR=$(mktemp -d)
    _RC_CONF="${_RC_DIR}/rclone.conf"

    # Parse config.json for s3-compatible storage
    if [ -f /tmp/.mc/config.json ]; then
      _ENDPOINT=$(jq -r '.aliases.truenas.url' /tmp/.mc/config.json)
      _ACCESS=$(jq -r '.aliases.truenas.accessKey' /tmp/.mc/config.json)
      _SECRET=$(jq -r '.aliases.truenas.secretKey' /tmp/.mc/config.json)
      {
        echo "[truenas]"
        echo "type = s3"
        echo "provider = Other"
        echo "access_key_id = ${_ACCESS}"
        echo "secret_access_key = ${_SECRET}"
        echo "endpoint = ${_ENDPOINT}"
      } > "${_RC_CONF}"
    fi

    _FAILED=0
    for _FILE in "${LOCATION}"/*; do
      [ -f "${_FILE}" ] || continue
      [ -s "${_FILE}" ] || { echo "SKIP empty: ${_FILE}"; _FAILED=1; continue; }
      if rclone copy --config "${_RC_CONF}" "${_FILE}" truenas:db-dump/; then
        echo "Uploaded: $(basename "${_FILE}")"
      else
        echo "FAIL: $(basename "${_FILE}")"
        _FAILED=1
      fi
    done

    exit ${_FAILED}
type: Opaque
