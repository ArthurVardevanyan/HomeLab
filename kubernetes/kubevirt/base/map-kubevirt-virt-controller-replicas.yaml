---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-kubevirt-virt-controller-replicas
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['kubevirt.io'] == 'virt-controller'
      name: matches-label
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          [JSONPatch{op: 'add', path: '/spec/replicas', value: 3}]
      patchType: JSONPatch
