---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-kubevirt-hyperconverged
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.spec.template) &&
        has(object.spec.template.spec) &&
        has(object.spec.template.spec.containers)
      name: has-containers
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - daemonsets
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          (
            object.spec.template.spec.containers
              .filter(c,
                (c.name == 'virt-controller' || c.name == 'virt-handler')
                && (!has(c.resources) || !has(c.resources.limits))
              )
              .map(c,
                c.name == 'virt-controller'
                ? JSONPatch{
                    op: 'add',
                    path: '/spec/template/spec/containers/' +
                      string(object.spec.template.spec.containers.indexOf(c)) +
                      '/resources',
                    value: {
                      "limits": {"cpu": '100m', "ephemeral-storage": '256Mi', "memory": '1Gi'},
                      "requests": {"cpu": '25m', "ephemeral-storage": '128Mi', "memory": '320Mi'}
                    }
                  }
                : JSONPatch{
                    op: 'add',
                    path: '/spec/template/spec/containers/' +
                      string(object.spec.template.spec.containers.indexOf(c)) +
                      '/resources',
                    value: {
                      "limits": {"cpu": '350m', "ephemeral-storage": '256Mi', "memory": '1Gi'},
                      "requests": {"cpu": '25m', "ephemeral-storage": '128Mi', "memory": '384Mi'}
                    }
                  }
              )
          )
      patchType: JSONPatch
