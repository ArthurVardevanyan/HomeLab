---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: netbox
  namespace: netbox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedule: "0 15 2 * * *"
  backupOwnerReference: self
  cluster:
    name: netbox
  method: volumeSnapshot
