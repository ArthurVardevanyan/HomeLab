---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: heimdall-cert
  namespace: heimdall
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: heimdall-cert
  duration: 1080h # 45d
  renewBeforePercentage: 50
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "heimdall.arthurdevanyan.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
