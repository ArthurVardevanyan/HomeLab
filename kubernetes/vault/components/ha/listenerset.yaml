---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: vault
  namespace: vault
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway
  listeners:
    - name: https
      hostname: "vault.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: vault-cert
