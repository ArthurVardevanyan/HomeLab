---
apiVersion: v1
kind: LimitRange
metadata:
  name: opentelemetry-operator-lr
  namespace: opentelemetry-operator
  labels:
    app.kubernetes.io/instance: opentelemetry-operator
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 256Mi
      defaultRequest:
        cpu: 5m
        memory: 32Mi
        ephemeral-storage: 128Mi
