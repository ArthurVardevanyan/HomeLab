---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: https-gateway
      namespace: openshift-ingress

    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: pgadmin
      namespace: pgadmin
  hostnames: ["https-gateway"]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: pgadmin
