---
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  egress:
    # Control Plane (kube-apiserver)
    - type: Allow
      to:
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/control-plane: ""
      ports:
        - protocol: TCP
          port: 6443
    # Zitadel (OIDC issuer - resolves to private IP, must stay explicit)
    - type: Allow
      to:
        dnsName: zitadel.arthurvardevanyan.com
      ports:
        - protocol: TCP
          port: 443
    # OKD Wildcard DNS & Route VIPs (hairpin self-hosted app lookups / pasted URLs)
    - type: Allow
      to:
        cidrSelector: 10.101.10.5/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    - type: Allow
      to:
        cidrSelector: 10.101.10.7/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Public internet (broad allow) - 31 deaggregated blocks excluding RFC1918
    - type: Allow
      to:
        cidrSelector: 0.0.0.0/5
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
