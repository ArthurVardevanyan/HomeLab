---
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  egress:
    # Control Plane (kube-apiserver)
    - type: Allow
      to:
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/control-plane: ""
      ports:
        - protocol: TCP
          port: 6443
    # HuggingFace (llama.cpp -hf model download: API + LFS metadata)
    - type: Allow
      to:
        dnsName: huggingface.co
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        dnsName: cdn-lfs.huggingface.co
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        dnsName: cdn-lfs-us-1.hf.co
      ports:
        - protocol: TCP
          port: 443
    # HuggingFace Xet / AWS CDN (the -hf resolve redirects here for blobs)
    - type: Allow
      to:
        dnsName: us.aws.cdn.hf.co
      ports:
        - protocol: TCP
          port: 443
    # AWS CloudFront / S3 ranges backing the HF Xet CDN
    - type: Allow
      to:
        cidrSelector: 13.32.0.0/15
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        cidrSelector: 13.224.0.0/14
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        cidrSelector: 52.84.0.0/15
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        cidrSelector: 18.64.0.0/14
      ports:
        - protocol: TCP
          port: 443
    # Cloudflare ranges (huggingface.co fronting)
    - type: Allow
      to:
        cidrSelector: 104.16.0.0/13
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        cidrSelector: 172.64.0.0/13
      ports:
        - protocol: TCP
          port: 443
    # Deny all other egress
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
