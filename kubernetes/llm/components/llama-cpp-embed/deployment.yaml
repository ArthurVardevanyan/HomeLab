---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-embed
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    checkov.io/skip1: CKV_K8S_40=Upstream Image Runs as Root
    checkov.io/skip2: CKV_K8S_22=Model Cache Requires Writable Root FS
    checkov.io/skip3: CKV_K8S_23=Upstream Image Requires Root
  labels:
    app.kubernetes.io/name: llm-embed
    app.kubernetes.io/instance: llm-embed
spec:
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-embed
        app.kubernetes.io/instance: llm-embed
    spec:
      hostname: llm-embed
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: llm-embed
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/gpu: ""
      containers:
        # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp versioning=regex:^server-vulkan-b(?<major>\d+)$
        - image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10666@sha256:74b3e5244810dafac2a6f2e173548676eec2333b16cec2203cfedf6ed0ebdabe
          name: llm-embed
          args:
            - "--model"
            - "/data/models-shared/models/Qwen3-Embedding-4B-Q8_0.gguf"
            - "--embedding"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "11435"
            - "--ctx-size"
            - "24576"
            - "--batch-size"
            - "512"
            - "--ubatch-size"
            - "512"
            - "--threads"
            - "8"
            - "--no-webui"
          env:
            - name: LLAMA_CACHE
              value: /data/cache
            - name: HOME
              value: /data
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 11435
              name: api
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: 16Gi
              ephemeral-storage: "128Mi"
            limits:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: llm-models
              mountPath: /data/models-shared
              readOnly: false
            - name: llm-embed-cache
              mountPath: /data/cache
      volumes:
        - name: llm-models
          persistentVolumeClaim:
            claimName: llm-models
        - name: llm-embed-cache
          emptyDir:
            sizeLimit: 1Gi
