---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-swap
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    externaldns.k8s.io: unifi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: https-gateway
      namespace: openshift-ingress
  hostnames: ["llama.arthurvardevanyan.com"]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: llama-swap-svc
          namespace: llm
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
