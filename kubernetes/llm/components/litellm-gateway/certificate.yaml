---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-cert
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/instance: litellm
spec:
  secretName: litellm-cert
  duration: 1080h # 45d
  renewBeforePercentage: 50
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "litellm.arthurvardevanyan.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
