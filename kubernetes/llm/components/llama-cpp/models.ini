version = 1

[*]
n-gpu-layers = 999
flash-attn = on
# q8_0 f16
cache-type-k = f16
cache-type-v = f16
ubatch-size = 2048
ctx-size = 262144
jinja = 1
# Dead value: the router's CLI arg (--parallel in deployment.yaml)
# outranks this preset key and is the one actually in effect. Kept in
# sync here only for readability when scanning this file in isolation.
parallel = 2
reasoning-format = none

[qwen3.6-35b-a3b]
model = /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
alias = qwen3.6-35b-a3b
load-on-startup = 0
reasoning-format = auto
mmproj = /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf

[qwen3.6-27b]
model = /data/models/Qwen3.6-27B-Q4_K_M.gguf
alias = qwen3.6-27b
# 131072 (65K/slot) KV cache to fit 32 GB VRAM with f16 KV (35B-A3B
# keeps the global ctx-size=262144/2=128K per slot). Without this, the
# dense 27B model + f16 KV + compute graph exceeds the 32 GB card and
# fails with vk::Device::allocateMemory: ErrorOutOfDeviceMemory.
ctx-size = 131072
load-on-startup = 0
mmproj = /data/models/Qwen3.6-27B-mmproj-F16.gguf

[qwen3.6-coder-30b-a3b]
model = /data/models/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf
alias = qwen3.6-coder-30b-a3b
load-on-startup = 0
