---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-router-preset
  namespace: llm
data:
  # llama-server router preset. Global [*] section holds shared Intel Arc B70
  # tuning; each model section points at a local GGUF pre-downloaded by the
  # init container into /data/models. Keys are long CLI arg names without
  # leading dashes. load-on-startup=0 so neither preloads (required for
  # --sleep-idle-seconds to fully release VRAM).
  models.ini: |
    version = 1

    [*]
    n-gpu-layers = 999
    flash-attn = on
    cache-type-k = f16
    cache-type-v = f16
    ubatch-size = 2048
    ctx-size = 131072
    jinja = 1
    parallel = 1
    reasoning-format = none

    [qwen3.6-35b-a3b]
    model = /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    alias = qwen3.6-35b-a3b
    load-on-startup = 0
    reasoning-format = auto

    [qwen3.6-27b]
    model = /data/models/Qwen3.6-27B-Q4_K_M.gguf
    alias = qwen3.6-27b
    load-on-startup = 0

    [qwen3.6-coder-30b-a3b]
    model = /data/models/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf
    alias = qwen3.6-coder-30b-a3b
    load-on-startup = 0
    cache-type-k = q8_0
    cache-type-v = q8_0
