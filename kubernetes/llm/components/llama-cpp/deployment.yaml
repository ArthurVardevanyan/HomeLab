---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-server
  namespace: llm
  labels:
    app: llm-server
  annotations:
    checkov.io/skip1: CKV_K8S_40=Upstream Image Runs as Root
    checkov.io/skip2: CKV_K8S_22=Model Cache Requires Writable Root FS
    checkov.io/skip3: CKV_K8S_23=Upstream Image Requires Root
spec:
  # Scale to 0 to free the GPU when not needed.
  # replicas: 0
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-server
  template:
    metadata:
      labels:
        app: llm-server
    spec:
      hostname: llm-server
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: llm-server
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      # Intel Arc Pro B70 (xe KMD) GPU node (gpu-1), identified by the
      # intel-xe-gpu NodeFeatureRule that matches xe KMD + Intel display-class
      # PCI hardware.
      nodeSelector:
        feature.node.kubernetes.io/custom-intel.xe.gpu: "true"
      initContainers:
        # Pre-download both GGUFs into the PVC so first requests are fast and
        # the router startup probe timing stays sane.
        #
        # Warm-boot fast path: if a model file already exists on the PVC, skip
        # it with zero network I/O (existence-only check). A completed download
        # is guaranteed complete because dl_fetch only promotes a size-validated
        # .part to the final name via atomic mv -- a partial/interrupted transfer
        # never leaves a file at the final path. Only missing files fall through
        # to the remote CDN path below. FORCE_REVALIDATE=true bypasses the fast
        # path and forces a remote size re-validation for every model.
        #
        # HuggingFace serves these files via Xet-backed CDN. A single curl
        # stream is one TCP connection and badly underutilizes a fast link, so
        # we split each file into parallel byte-range chunks (the CDN advertises
        # `accept-ranges: bytes`) and reassemble.
        # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan versioning=loose
        - image: registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan:b10380@sha256:129e2b9340e09ffc75e7f3eb2a0fff57cc55e17a95cce5c5ffeffa707001c176
          imagePullPolicy: IfNotPresent
          name: model-downloader
          env:
            # Number of parallel connections and chunk size per range request.
            - name: PARALLEL
              value: "32"
            - name: CHUNK_BYTES
              value: "134217728" # 128 MiB
            # When true, skip the local existence fast path and force a remote
            # size re-validation against the CDN for every model (occasional
            # on-demand integrity re-check). Default false: an existing model
            # boots without any network round-trip.
            - name: FORCE_REVALIDATE
              value: "false"
          command:
            - /bin/sh
            - "-c"
            - |
              set -eu
              MODELS=/data/models
              CHECKS="${MODELS}/.checks"
              mkdir -p "${MODELS}"

              # Local fast path: skip a model whose file already exists on the
              # PVC. Pure `test -s` stat, no network. A file present at the final
              # path is guaranteed complete (see dl_fetch's atomic mv), so any
              # such file is safe to reuse. FORCE_REVALIDATE=true bypasses this
              # for an occasional full integrity re-check.
              dl_local_check() {
                name="$1"
                [ "${FORCE_REVALIDATE}" = "true" ] && return 1
                out="${MODELS}/${name}"
                if [ -s "${out}" ]; then
                  echo "Present: ${name}"
                  echo "SKIP" > "${CHECKS}/${name}.status"
                  return 0
                fi
                return 1
              }

              # Resolve CDN redirect + content-length, write outcome to a small
              # status file (${CHECKS}/<name>.status) so the real download phase
              # below can reuse the resolved CDN URL without re-running the header
              # request.  Called only for models the local fast path did not skip.
              # Called in parallel via the `&` in Phase 1 below.
              dl_check() {
                name="$1"; src="$2"

                # Single request: resolve the redirect chain once and read both
                # the final CDN location and content-length from the same header
                # dump, instead of two independent curl -sIL calls (halves
                # signed-URL round-trips against the Xet CDN).  Bounded timeouts
                # so a connection blackholed by the namespace egress firewall
                # (CDN edge IP outside the allow-listed CIDRs) fails fast
                # instead of hanging forever.
                headers=$(curl -sIL --connect-timeout 10 --max-time 30 "${src}")
                cdn=$(printf '%s' "${headers}" | awk 'BEGIN{IGNORECASE=1}/^location:/{u=$2}END{print u}' | tr -d '\r')
                [ -z "${cdn}" ] && cdn="${src}"
                size=$(printf '%s' "${headers}" | awk 'BEGIN{IGNORECASE=1}/^content-length:/{c=$2}END{print c}' | tr -d '\r')

                # DOWNLOAD<TAB>size<TAB>cdn
                printf 'DOWNLOAD\t%s\t%s\n' "${size}" "${cdn}" > "${CHECKS}/${name}.status"
              }

              # Download a single model using chunked byte-range parallelism,
              # reassembling at the end.  Size and CDN are pre-resolved by
              # dl_check; this function is idempotent for the named model.
              dl_fetch() {
                name="$1"; size="$2"; cdn="$3"
                out="${MODELS}/${name}"

                echo "Downloading ${name} (${size} bytes) with ${PARALLEL} parallel connections ..."
                work="${MODELS}/.dl-${name}"
                rm -rf "${work}"; mkdir -p "${work}"

                # Rolling-window parallelism via a FIFO-backed counting
                # semaphore.  Unlike a batched `wait` (which stalls the *whole*
                # batch of PARALLEL chunks on its single slowest one), each
                # chunk releases its slot the instant it finishes so the next
                # chunk starts immediately -- keeping all PARALLEL connections
                # busy for the full transfer instead of only within batches.
                sem="${work}/.sem"
                mkfifo "${sem}"; exec 9<>"${sem}"; rm -f "${sem}"
                i=0
                while [ "${i}" -lt "${PARALLEL}" ]; do printf 'x\n' >&9; i=$((i + 1)); done

                offset=0; idx=0
                while [ "${offset}" -lt "${size}" ]; do
                  if [ -f "${work}/.failed" ]; then
                    echo "ERROR: aborting remaining chunks for ${name} after a prior chunk failure" >&2
                    break
                  fi
                  end=$((offset + CHUNK_BYTES - 1))
                  [ "${end}" -ge "${size}" ] && end=$((size - 1))
                  part=$(printf '%s/part.%08d' "${work}" "${idx}")
                  read -r _ <&9
                  (
                    # Bounded per-chunk timeout: same egress-firewall rationale
                    # as the header request above.  A chunk that can't complete
                    # in 3 minutes (well under the expected transfer time for
                    # a 256MiB chunk on this network) is retried by curl itself
                    # up to 5 times; if it still fails, mark the whole download
                    # as failed but ALWAYS release the semaphore token (the `if`
                    # here means set -e does not abort the subshell on a
                    # non-zero curl exit), otherwise a permanently lost token
                    # deadlocks the main loop's `read -r _ <&9` forever.
                    if ! curl -fsS --connect-timeout 10 --max-time 180 --retry 5 --retry-delay 5 \
                      -r "${offset}-${end}" -o "${part}" "${cdn}"; then
                      touch "${work}/.failed"
                    fi
                    printf 'x\n' >&9
                  ) &
                  offset=$((end + 1)); idx=$((idx + 1))
                done
                wait
                exec 9>&-

                if [ -f "${work}/.failed" ]; then
                  echo "ERROR: one or more chunks failed to download for ${name}" >&2
                  rm -rf "${work}"
                  return 1
                fi

                echo "Reassembling ${idx} chunks ..."
                : > "${out}.part"
                i=0
                while [ "${i}" -lt "${idx}" ]; do
                  cat "$(printf '%s/part.%08d' "${work}" "${i}")" >> "${out}.part"
                  i=$((i + 1))
                done
                rm -rf "${work}"

                got=$(wc -c < "${out}.part" | tr -d ' ')
                if [ "${got}" != "${size}" ]; then
                  echo "ERROR: ${name} size mismatch after reassembly (got ${got}, want ${size})" >&2
                  rm -f "${out}.part"; return 1
                fi
                mv "${out}.part" "${out}"
                echo "Done (${got} bytes): ${name}"
              }

              # Phase 0 -- local existence fast path (no network). Skip any model whose
              # file is already on the PVC so a fully-populated PVC boots without
              # hitting the CDN.
              rm -rf "${CHECKS}"; mkdir -p "${CHECKS}"
              dl_local_check "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf" || true
              dl_local_check "Qwen3.6-35B-A3B-mmproj-F16.gguf" || true
              dl_local_check "Qwen3.6-27B-Q4_K_M.gguf" || true
              dl_local_check "Qwen3.6-27B-mmproj-F16.gguf" || true
              dl_local_check "Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf" || true

              # Phase 1 -- resolve remaining redirects concurrently (only for
              # models not already marked SKIP by Phase 0).
              [ -f "${CHECKS}/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf.status" ] || \
                dl_check "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf" \
                "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf?download=true" &
              [ -f "${CHECKS}/Qwen3.6-35B-A3B-mmproj-F16.gguf.status" ] || \
                dl_check "Qwen3.6-35B-A3B-mmproj-F16.gguf" \
                "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/mmproj-F16.gguf?download=true" &
              [ -f "${CHECKS}/Qwen3.6-27B-Q4_K_M.gguf.status" ] || \
                dl_check "Qwen3.6-27B-Q4_K_M.gguf" \
                "https://huggingface.co/unsloth/Qwen3.6-27B-GGUF/resolve/main/Qwen3.6-27B-Q4_K_M.gguf?download=true" &
              [ -f "${CHECKS}/Qwen3.6-27B-mmproj-F16.gguf.status" ] || \
                dl_check "Qwen3.6-27B-mmproj-F16.gguf" \
                "https://huggingface.co/unsloth/Qwen3.6-27B-GGUF/resolve/main/mmproj-F16.gguf?download=true" &
              [ -f "${CHECKS}/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf.status" ] || \
                dl_check "Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf" \
                "https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf?download=true" &
              wait

              # Phase 2 -- sequential download for any flagged models.
              for name in \
                "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf" \
                "Qwen3.6-35B-A3B-mmproj-F16.gguf" \
                "Qwen3.6-27B-Q4_K_M.gguf" \
                "Qwen3.6-27B-mmproj-F16.gguf" \
                "Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf"; do
                status=$(cat "${CHECKS}/${name}.status")
                case "${status}" in
                  SKIP) echo "Skipping ${name} (up to date)"; continue ;;
                  DOWNLOAD*) size=$(printf '%s' "${status}" | cut -f2); cdn=$(printf '%s' "${status}" | cut -f3); dl_fetch "${name}" "${size}" "${cdn}" ;;
                  *) echo "ERROR: unknown status for ${name}: ${status}" >&2; exit 1 ;;
                esac
              done

              rm -rf "${CHECKS}"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: 12Gi
              ephemeral-storage: "256Mi"
            limits:
              cpu: "2"
              memory: 48Gi
              ephemeral-storage: "1Gi"
          volumeMounts:
            - name: llm-config
              mountPath: /data
      containers:
        # llama.cpp Vulkan server in ROUTER mode. Serves both Qwen3.6 models
        # from the preset; --models-max 1 keeps only one resident in VRAM
        # (evicts on swap), stays resident 24/7 otherwise. Per B70
        # benchmarking this Vulkan backend is the fastest on Battlemage and
        # (unlike the IPEX fork) tracks mainline for the newest models.
        #
        # Custom image = upstream server-vulkan + Mesa >= 26.1 (kisak PPA) for
        # the Battlemage cooperative-matrix path (~2x decode vs stock Mesa 26.0).
        # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan versioning=loose
        # Tag = upstream llama.cpp build number (e.g. b10331); pipeline derives from
        # the FROM tag in the containerfile. Deployment tag+digest follows containerfile
        # bump → PaC build → next Renovate run (up to ~1 week lag).
        # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan versioning=loose
        - image: registry.arthurvardevanyan.com/homelab/llama-cpp-vulkan:b10380@sha256:129e2b9340e09ffc75e7f3eb2a0fff57cc55e17a95cce5c5ffeffa707001c176
          imagePullPolicy: IfNotPresent
          name: llm
          args:
            - "--models-preset"
            - "/config/models.ini"
            # Model instances inherit the router's CLI args, and CLI args
            # outrank the [*] preset value -- so the router's inherited -np
            # default (auto -> 4) was overriding the preset. Set it explicitly
            # here. --ctx-size (256K, in models.ini) is a total KV-cache budget
            # split evenly across slots, so 2 slots -> ~128K context each,
            # matching opencode's client-side context cap (opencode.json) --
            # letting two concurrent requests (e.g. opencode's build + explore
            # agents) run without fully serializing, at no extra VRAM cost
            # since the total KV-cache reservation is unchanged.
            - "--parallel"
            - "2"
            # --kv-unified defaults to on only when --parallel is auto; since
            # we set it explicitly it already defaults off, but pin it
            # explicitly so a future llama.cpp default change can't silently
            # switch us to a shared/dynamic KV pool. Static per-slot capacity
            # (128K/slot, see above) fits our workload -- opencode caps both
            # agents at the same 128K, so there's no asymmetric-usage case
            # that would benefit from one slot borrowing another's headroom.
            - "--no-kv-unified"
            # Only one model resident in VRAM at a time (both models cannot fit
            # in 32GB); requesting the other evicts the current one.
            - "--models-max"
            - "1"
            # Model stays resident in VRAM 24/7. Real telemetry on gpu-1 shows
            # idle card power (6.8 W with model resident) is indistinguishable
            # from idle with no model (7.2 W), so unloading buys zero wattage
            # while adding reload latency and CVE surface.
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "11434"
            - "--metrics"
            - "--no-webui"
          env:
            # Model / HF cache lives on the PVC, not the root FS.
            - name: LLAMA_CACHE
              value: /data/cache
            - name: HOME
              value: /data
            - name: GGML_VK_VISIBLE_DEVICES
              value: "0"
            # Mesa shader cache to a writable path under the arbitrary UID.
            - name: MESA_SHADER_CACHE_DIR
              value: /data/.mesa_cache
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 11434
              name: api
              protocol: TCP
          # startup/liveness use GET /models (router-level, stays HTTP 200 even
          # while a sub-model loads/swaps). readiness uses /health (returns 503
          # while a model loads) so the Service only routes when actually ready.
          startupProbe:
            httpGet:
              path: /models
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /models
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: "500m"
              memory: 12Gi
              ephemeral-storage: "256Mi"
            limits:
              cpu: "2"
              memory: 48Gi
              ephemeral-storage: "1Gi"
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: llm-config
              mountPath: /data
            - name: router-preset
              mountPath: /config
              readOnly: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: llm-config
          persistentVolumeClaim:
            claimName: llm-models
        - name: router-preset
          configMap:
            name: llama-router-preset
