---
# llama.cpp router-mode Prometheus metrics scraping.
#
# In router mode every GET /metrics requires a ?model=<id> query param
# (tools/server/server-models.cpp: router_validate_model).
# autoload=false stops the scrape itself from triggering a model load / VRAM
# swap -- with --models-max 1 only one of these three targets scrapes 2xx at a
# time; the other two 400 ("model is not loaded") and show as down in
# Prometheus. That is expected, not a bug (see README).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-server
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: llm-server
spec:
  selector:
    matchLabels:
      app: llm-server
  endpoints:
    - port: api
      path: /metrics
      interval: 30s
      params:
        model:
          - qwen3.6-35b-a3b
        autoload:
          - "false"
      relabelings:
        - action: replace
          targetLabel: model
          replacement: qwen3.6-35b-a3b
    - port: api
      path: /metrics
      interval: 30s
      params:
        model:
          - qwen3.6-27b
        autoload:
          - "false"
      relabelings:
        - action: replace
          targetLabel: model
          replacement: qwen3.6-27b
    - port: api
      path: /metrics
      interval: 30s
      params:
        model:
          - qwen3.6-coder-30b-a3b
        autoload:
          - "false"
      relabelings:
        - action: replace
          targetLabel: model
          replacement: qwen3.6-coder-30b-a3b
