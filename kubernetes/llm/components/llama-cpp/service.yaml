---
kind: Service
apiVersion: v1
metadata:
  name: llm-server-svc
  namespace: llm
  labels:
    app: llm-server
spec:
  ipFamilies:
    - IPv4
  ports:
    - name: api
      protocol: TCP
      port: 11434
      targetPort: api
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: llm-server
