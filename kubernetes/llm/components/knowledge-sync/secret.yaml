---
# Open WebUI sk- API key for the Knowledge API. Create the key in the Open
# WebUI UI (admin) and store it in Vault at:
#   secret/data/homelab/llm/knowledge-sync  property: api_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-sync
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: knowledge-sync
  data:
    - secretKey: OPENWEBUI_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/knowledge-sync
        property: api_key
        metadataPolicy: None
