---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-sync-config
  namespace: llm
  labels:
    app.kubernetes.io/name: knowledge-sync
    app.kubernetes.io/instance: knowledge-sync
data:
  # Reference source: the personal static site (sitemap crawl). The site is
  # also GitHub-repo-backed, so it could alternatively index the repo source
  # for cleaner text — extend sync.sh with another branch if needed.
  SITEMAP_URL: "https://www.arthurvardevanyan.com/sitemap.xml"
  COLLECTION_NAME: "personal-site"
  # bash + curl + jq crawler. Runs on the repo toolbox image (curl/jq/bash
  # already present). Flow per run:
  #   1. get-or-create the Knowledge collection
  #   2. crawl sitemap -> <loc> URLs
  #   3. per URL: strip HTML -> text -> POST /api/v1/files/ (multipart)
  #      -> POST /api/v1/knowledge/{id}/file/add
  sync.sh: |-
    #!/usr/bin/env bash
    set -o errexit -o nounset -o pipefail

    : "${OPENWEBUI_URL:?}" "${OPENWEBUI_API_KEY:?}" "${SITEMAP_URL:?}" "${COLLECTION_NAME:?}"

    AUTH=(-H "Authorization: Bearer ${OPENWEBUI_API_KEY}")
    JSON=(-H "Content-Type: application/json")
    API="${OPENWEBUI_URL%/}/api/v1"

    echo "== knowledge-sync: ${COLLECTION_NAME} <- ${SITEMAP_URL} =="

    # 1. get-or-create collection -------------------------------------------
    collections="$(curl -fsSL "${AUTH[@]}" "${API}/knowledge/")"
    kb_id="$(echo "${collections}" |
      jq -r --arg n "${COLLECTION_NAME}" \
        'map(select(.name == $n)) | (.[0].id // empty)')"

    if [[ -z "${kb_id}" ]]; then
      kb_id="$(curl -fsSL "${AUTH[@]}" "${JSON[@]}" \
        -X POST "${API}/knowledge/create" \
        -d "$(jq -n --arg n "${COLLECTION_NAME}" \
          '{name:$n, description:("Auto-synced: "+$n)}')" |
        jq -r '.id')"
      echo "created collection id=${kb_id}"
    else
      echo "found collection id=${kb_id}"
    fi
    # 2. crawl sitemap ------------------------------------------------------
    urls="$(curl -fsSL "${SITEMAP_URL}" |
      grep -oE '<loc>[^<]+</loc>' | sed -E 's,</?loc>,,g')"
    count="$(echo "${urls}" | grep -c . || true)"
    echo "sitemap urls: ${count}"

    # 3. per-URL fetch -> text -> upload -> attach --------------------------
    work="$(mktemp -d)"
    trap 'rm -rf "${work}"' EXIT

    echo "${urls}" | while read -r url; do
      [[ -n "${url}" ]] || continue
      name="$(echo "${url}" | sed -E 's,^https?://,,; s,[/?&=],_,g').txt"
      file="${work}/${name}"

      # crude HTML -> text: drop script/style, strip tags, squeeze blanks.
      if ! curl -fsSL "${url}" |
        sed -E 's,<(script|style)[^>]*>.*</\1>,,gI' |
        sed -E 's,<[^>]+>, ,g' |
        sed -E 's,&nbsp;, ,g' |
        tr -s '[:space:]' ' ' > "${file}"; then
        echo "  ! fetch failed: ${url}"
        continue
      fi
      [[ -s "${file}" ]] || { echo "  - empty: ${url}"; continue; }

      file_id="$(curl -fsSL "${AUTH[@]}" \
        -X POST "${API}/files/" \
        -F "file=@${file};type=text/plain" | jq -r '.id')"
      if [[ -z "${file_id}" ]] || [[ "${file_id}" == "null" ]]; then
        echo "  ! upload failed: ${url}"
        continue
      fi

      curl -fsSL "${AUTH[@]}" "${JSON[@]}" \
        -X POST "${API}/knowledge/${kb_id}/file/add" \
        -d "$(jq -n --arg fid "${file_id}" '{file_id:$fid}')" \
        >/dev/null || echo "  ! attach failed (may already exist): ${url}"

      echo "  + ${url} -> file_id=${file_id}"
    done

    echo "done"
