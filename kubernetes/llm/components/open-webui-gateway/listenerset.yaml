---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: open-webui
  namespace: llm-open-webui
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway
  listeners:
    - name: https
      hostname: "ai.arthurdevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: open-webui-cert
