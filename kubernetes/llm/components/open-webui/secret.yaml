---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-config
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: open-webui-config
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        TOOL_SERVER_CONNECTIONS: |-
          [
            {
              "url": "http://mcp-kubernetes.llm.svc.cluster.local.:8080",
              "path": "mcp",
              "type": "mcp",
              "auth_type": "none",
              "info": {"name": "Kubernetes (read-only)", "description": "Inspect the OKD cluster: get/list/watch only."}
            },
            {
              "url": "http://mcp-github.llm.svc.cluster.local.:8080",
              "path": "mcp",
              "type": "mcp",
              "auth_type": "bearer",
              "key": "{{ .GITHUB_PAT }}",
              "info": {"name": "GitHub (read-only)", "description": "Query repos, issues, and pull requests."}
            },
            {
              "url": "http://oikb.llm.svc.cluster.local:8080local.:
              "path": "",
              "type": "openapi",
              "auth_type": "bearer",
              "key": "{{ .OIKB_API_KEY }}",
              "info": {"name": "Knowledge Sync (oikb)", "description": "Trigger Open WebUI Knowledge Base syncs, check status, and query history."}
            }
          ]
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/open-webui
        property: webui_secret_key
        metadataPolicy: None
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/open-webui/zitadel
        property: client_id
        metadataPolicy: None
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/open-webui/zitadel
        property: client_secret
        metadataPolicy: None
    - secretKey: GITHUB_PAT
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/mcp-github
        property: token
        metadataPolicy: None
    - secretKey: OIKB_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: daemon_key
        metadataPolicy: None
