---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
spec:
  replicas: 1
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/instance: open-webui
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: open-webui
      enableServiceLinks: false
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/gpu: ""
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
          # image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
          # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/open-webui
          image: registry.arthurvardevanyan.com/homelab/open-webui:v0.11.3-hotfix@sha256:cb8eff1da59a2dbfcf9e22f006fe5bab59ee531911fb0f5df1df0a6081693705
          imagePullPolicy: IfNotPresent
          args:
            - bash
            - -c
            - /app/backend/start.sh
          env:
            - name: OPENAI_API_BASE_URL
              value: http://litellm-svc.llm.svc.cluster.local.:4000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-config
                  key: LITELLM_MASTER_KEY
            - name: DATA_DIR
              value: /app/backend/data
            - name: STATIC_DIR
              value: /app/backend/open_webui/static
            - name: TMPDIR
              value: /tmp
            # Disable huggingface_hub Xet protocol to use classic LFS HTTP
            # (already allow-listed in EgressFirewall; Xet CAS domains are not)
            - name: HF_HUB_DISABLE_XET
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_URL
              value: https://ai.arthurvardevanyan.com
            - name: CORS_ALLOW_ORIGIN
              value: "https://ai.arthurvardevanyan.com"
            - name: ENABLE_OAUTH
              value: "true"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              value: https://zitadel.arthurvardevanyan.com/.well-known/openid-configuration
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDERS
              value: openid
            - name: WEBSOCKET_MANAGER
              value: "redis"
            - name: WEBSOCKET_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: open-webui-dragonfly-redis-url
                  key: redis_url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: open-webui-app
                  key: fqdn-uri
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.llm.svc.cluster.local.:8080/search
            # Web GUI Admin Settings Won't Stick, all configs should be in GIT
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            # Memory system: enables the built-in long-term memory feature.
            # Background review auto-extracts facts/preferences from recent
            # conversations every N turns, storing them in the `memory` table.
            # Memories are injected into future prompts (up to MEMORIES_*_CHAR_LIMIT).
            - name: ENABLE_MEMORIES
              value: "true"
            - name: ENABLE_MEMORY_BACKGROUND_REVIEW
              value: "true"
            - name: MEMORIES_REVIEW_INTERVAL_TURNS
              value: "15"
            - name: MEMORIES_CONTEXT_CHAR_LIMIT
              value: "8000"
            - name: MEMORIES_USER_CHAR_LIMIT
              value: "8000"
            # Global model defaults: apply to all models as a baseline.
            # function_calling=native enables the 8 memory tools
            # (add_memory, update_memory, search_memories, etc.) across
            # all 4 models: qwen3.6-35b-a3b, qwen3.6-35b-a3b-dense,
            # qwen3.6-35b-a3b-spread, qwen3.8-27b.
            - name: DEFAULT_MODEL_PARAMS
              value: '{"function_calling":"native"}'
            # orjson provides a faster JSON encoder/decoder than the stdlib
            # json module. Open WebUI falls back to stdlib for rejected
            # payloads, so risk is minimal. Worth enabling on Redis-backed
            # deployments (WebSocket manager + LiteLLM cache).
            - name: ENABLE_ORJSON
              value: "true"
            # Global default capabilities applied to all models. Per-model
            # overrides always take precedence. web_search uses the SearXNG
            # backend already configured; file_context uses the pgvector RAG;
            # vision enables image analysis; code_interpreter gives the
            # Python sandbox (no-op unless Open Terminal is connected).
            - name: DEFAULT_MODEL_METADATA
              value: '{"capabilities":{"web_search":true,"file_context":true,"vision":true,"code_interpreter":true}}'
            # The AnyIO default of 40 causes app-wide freezes under load.
            # 2000+ is recommended for production servers; idle high
            # ceiling costs nothing (it's a concurrency limit, not a pool).
            # Your node has 6 cores / 82GB RAM, well above the "weak
            # hardware" exception threshold.
            - name: THREAD_POOL_SIZE
              value: "2000"
            # Open WebUI ships its own context compaction (auto history-summarization).
            # Enabled here at 128K to match the OpenCode client's context cap, so long agent
            # sessions get summarized rather than dropped. Threshold is a soft trigger for
            # the summarization sub-request, not a hard cap. Authoritative because
            # ENABLE_PERSISTENT_CONFIG=false.
            #
            # CAVEAT - threshold equal to the client cap: at 128K both OpenCode and
            # Open WebUI are at their ceilings simultaneously. If history is already too
            # large to summarise at that moment, the "too large to compact" error can still
            # recur. Escape hatches if needed:
            #   - Raise toward ~200K (below llama's 256K) so compaction only fires after
            #     OpenCode has its own headroom, or
            #   - Disable entirely (ENABLE_CONTEXT_COMPACTION=false) so OpenCode manages
            #     context alone like the direct llama.cpp path.
            - name: ENABLE_CONTEXT_COMPACTION
              value: "true"
            - name: CONTEXT_COMPACTION_TOKEN_THRESHOLD
              value: "256000"
            - name: ENABLE_API_KEYS
              value: "true"
            - name: ENABLE_USER_WEBHOOKS
              value: "true"
            - name: USER_PERMISSIONS_FEATURES_API_KEYS
              value: "true"
            - name: ENABLE_FORWARD_USER_INFO_HEADERS
              value: "true"
            - name: FORWARD_SESSION_INFO_HEADER_CHAT_ID
              value: X-Litellm-Session-Id
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_EMBEDDING_MODEL
              value: nomic-embed-text-v1.5
            - name: RAG_OPENAI_API_BASE_URL
              value: http://llm-embed-svc.llm.svc.cluster.local.:11435/v1
            - name: RAG_OPENAI_API_KEY
              value: sk-noauth
            - name: VECTOR_DB
              value: pgvector
            - name: PGVECTOR_CREATE_EXTENSION
              value: "true"
            - name: PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH
              value: "768"
            - name: ENABLE_RAG_HYBRID_SEARCH
              value: "true"
            - name: RAG_TOP_K
              value: "4"
            - name: CHUNK_SIZE
              value: "1000"
            - name: CHUNK_OVERLAP
              value: "100"
            - name: ENABLE_SUBAGENTS
              value: "true"
            - name: SUBAGENTS_MAX_CONCURRENT
              value: "4"
            - name: SUBAGENTS_MAX_ITERATIONS
              value: "15"
            - name: SUBAGENTS_MAX_OUTPUT
              value: "8000"
            # ---- Observability (OTEL) ----
            - name: ENABLE_OTEL
              value: "true"
            - name: ENABLE_OTEL_METRICS
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://open-webui-collector.llm.svc.cluster.local.:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
            - name: ENABLE_AUDIT_STDOUT
              value: "true"
            - name: AUDIT_LOG_LEVEL
              value: REQUEST_RESPONSE
            - name: ENABLE_CODE_INTERPRETER
              value: "true"
            - name: CODE_INTERPRETER_ENGINE
              value: pyodide
            - name: USER_PERMISSIONS_FEATURES_CODE_INTERPRETER
              value: "true"
            - name: ENABLE_MEMORY_SYSTEM_CONTEXT
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: roles
            - name: OAUTH_ALLOWED_ROLES
              value: user,admin
            - name: OAUTH_ADMIN_ROLES
              value: admin
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "true"
            - name: TOOL_SERVER_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: TOOL_SERVER_CONNECTIONS
              value: open-webui
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
              readOnly: false
            - name: static
              mountPath: /app/backend/open_webui/static
              readOnly: false
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: static
          emptyDir:
            sizeLimit: 64Mi
        - name: temp
          emptyDir:
            sizeLimit: 128Mi
