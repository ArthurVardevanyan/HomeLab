---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
spec:
  replicas: 2
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/instance: open-webui
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: open-webui
      enableServiceLinks: false
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      # Soft preference for the GPU node; never blocks scheduling elsewhere.
      # Hard spread constraints below still take precedence for HA.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/gpu
                    operator: Exists
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
          imagePullPolicy: IfNotPresent
          args:
            - bash
            - -c
            - /app/backend/start.sh
          env:
            # Point to LiteLLM which routes to llama-swap managing llama-server instances
            - name: OPENAI_API_BASE_URL
              value: http://litellm-svc.llm.svc.cluster.local:4000/v1
            # Writable paths for uploads and static assets (root FS is read-only)
            # /app/backend/data → PVC (uploads, chroma, cache, sqlite, audit)
            - name: DATA_DIR
              value: /app/backend/data
            # /app/backend/open_webui/static → emptyDir (favicon, splash, loader.js —
            # recopied from the frontend build on every boot; can't share the data PVC
            # because data and open_webui/static are non-nested siblings under /app/backend)
            - name: STATIC_DIR
              value: /app/backend/open_webui/static
            # /tmp → emptyDir (required by RAG stack at import time: torch→dill→tempfile)
            - name: TMPDIR
              value: /tmp
            # Disable huggingface_hub Xet protocol to use classic LFS HTTP
            # (already allow-listed in EgressFirewall; Xet CAS domains are not)
            - name: HF_HUB_DISABLE_XET
              value: "true"
            # Secret key for session/cookie signing — managed by ExternalSecret
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: WEBUI_SECRET_KEY
            # Public-facing URL (used for OAuth redirect URIs)
            - name: WEBUI_URL
              value: https://ai.arthurvardevanyan.com
            # Enable OAuth2/OIDC login
            - name: ENABLE_OAUTH
              value: "true"
            # OIDC client credentials — managed by ExternalSecret
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: OAUTH_CLIENT_SECRET
            # Zitadel OIDC discovery endpoint (authlib fetches this directly as JSON config)
            - name: OPENID_PROVIDER_URL
              value: https://zitadel.arthurvardevanyan.com/.well-known/openid-configuration
            # Allow any logged-in user to sign up (no pre-provisioned accounts)
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            # Merge OIDC identity with existing user by email
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            # Use OpenID user info (name, email) on first login
            - name: OAUTH_PROVIDERS
              value: openid
            # WebSocket manager for multi-replica state sharing
            - name: WEBSOCKET_MANAGER
              value: "redis"
            - name: WEBSOCKET_REDIS_URL
              value: redis://open-webui-dragonfly.llm.svc.cluster.local.:6379
            # SQLite database — CNPG manages connection details via the
            # postgres user secret; we construct DATABASE_URL from the
            # cluster-internal host, port, and credentials.
            - name: DATABASE_URL
              value: postgresql://postgres:<password>@open-webui-rw.llm.svc.cluster.local:5432/postgres
            # SearXNG instance for web search
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.llm.svc.cluster.local.:8080/search
            # Document RAG. Embeddings are served by the dedicated CPU-only
            # llama.cpp --embedding server (llm-embed) on llm-embed-svc:11435;
            # vectors are stored in pgvector in the open-webui CNPG cluster.
            # Keep config authoritative from env (not persisted to the DB) so
            # Git stays the single source of truth.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            # Open WebUI ships its own context compaction (auto history-summarization).
            # Enabled here at 128K to match the OpenCode client's context cap, so long agent
            # sessions get summarized rather than dropped. Threshold is a soft trigger for
            # the summarization sub-request, not a hard cap. Authoritative because
            # ENABLE_PERSISTENT_CONFIG=false.
            #
            # CAVEAT - threshold equal to the client cap: at 128K both OpenCode and
            # Open WebUI are at their ceilings simultaneously. If history is already too
            # large to summarise at that moment, the "too large to compact" error can still
            # recur. Escape hatches if needed:
            #   - Raise toward ~200K (below llama's 256K) so compaction only fires after
            #     OpenCode has its own headroom, or
            #   - Disable entirely (ENABLE_CONTEXT_COMPACTION=false) so OpenCode manages
            #     context alone like the direct llama.cpp path.
            - name: ENABLE_CONTEXT_COMPACTION
              value: "true"
            - name: CONTEXT_COMPACTION_TOKEN_THRESHOLD
              value: "192000"
            # API keys for external clients (e.g. the OpenCode provider pointing at
            # /api). Must be set via env because ENABLE_PERSISTENT_CONFIG=false reverts
            # admin-UI toggles back to env defaults on restart - without these, the
            # "Enable API keys" feature flips off on every restart and existing keys
            # start returning 403 (appears as the key "resetting"). The personal sk- keys
            # themselves live in the api_key table (CNPG) and persist; this keeps the
            # feature ON and allows non-admin users to create/use them.
            - name: ENABLE_API_KEYS
              value: "true"
            - name: USER_PERMISSIONS_FEATURES_API_KEYS
              value: "true"
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_EMBEDDING_MODEL
              value: nomic-embed-text-v1.5
            - name: RAG_OPENAI_API_BASE_URL
              value: http://llm-embed-svc.llm.svc.cluster.local:11435/v1
            # llama.cpp ignores the key; a non-empty value is required.
            - name: RAG_OPENAI_API_KEY
              value: sk-noauth
            - name: VECTOR_DB
              value: pgvector
            # Reuse DATABASE_URL (PGVECTOR_DB_URL defaults to it); superuser
            # access lets Open WebUI run CREATE EXTENSION vector.
            - name: PGVECTOR_CREATE_EXTENSION
              value: "true"
            # nomic-embed-text-v1.5 produces 768-dim vectors.
            - name: PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH
              value: "768"
            - name: ENABLE_RAG_HYBRID_SEARCH
              value: "true"
            - name: RAG_TOP_K
              value: "4"
            - name: CHUNK_SIZE
              value: "1000"
            - name: CHUNK_OVERLAP
              value: "100"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
              readOnly: false
            - name: static
              mountPath: /app/backend/open_webui/static
              readOnly: false
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: static
          emptyDir:
            sizeLimit: 64Mi
        - name: temp
          emptyDir:
            sizeLimit: 128Mi
