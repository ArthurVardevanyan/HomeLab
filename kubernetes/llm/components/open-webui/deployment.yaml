---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
spec:
  replicas: 1
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/instance: open-webui
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: open-webui
      enableServiceLinks: false
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/gpu: ""
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
          imagePullPolicy: IfNotPresent
          args:
            - bash
            - -c
            - /app/backend/start.sh
          env:
            - name: OPENAI_API_BASE_URL
              value: http://litellm-svc.llm.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-config
                  key: LITELLM_MASTER_KEY
            - name: DATA_DIR
              value: /app/backend/data
            - name: STATIC_DIR
              value: /app/backend/open_webui/static
            - name: TMPDIR
              value: /tmp
            # Disable huggingface_hub Xet protocol to use classic LFS HTTP
            # (already allow-listed in EgressFirewall; Xet CAS domains are not)
            - name: HF_HUB_DISABLE_XET
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_URL
              value: https://ai.arthurvardevanyan.com
            - name: ENABLE_OAUTH
              value: "true"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              value: https://zitadel.arthurvardevanyan.com/.well-known/openid-configuration
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDERS
              value: openid
            - name: WEBSOCKET_MANAGER
              value: "redis"
            - name: WEBSOCKET_REDIS_URL
              value: redis://open-webui-dragonfly.llm.svc.cluster.local.:6379
            - name: DATABASE_URL
              value: postgresql://postgres:<password>@open-webui-rw.llm.svc.cluster.local:5432/postgres
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.llm.svc.cluster.local.:8080/search
            # Web GUI Admin Settings Won't Stick, all configs should be in GIT
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            # Open WebUI ships its own context compaction (auto history-summarization).
            # Enabled here at 128K to match the OpenCode client's context cap, so long agent
            # sessions get summarized rather than dropped. Threshold is a soft trigger for
            # the summarization sub-request, not a hard cap. Authoritative because
            # ENABLE_PERSISTENT_CONFIG=false.
            #
            # CAVEAT - threshold equal to the client cap: at 128K both OpenCode and
            # Open WebUI are at their ceilings simultaneously. If history is already too
            # large to summarise at that moment, the "too large to compact" error can still
            # recur. Escape hatches if needed:
            #   - Raise toward ~200K (below llama's 256K) so compaction only fires after
            #     OpenCode has its own headroom, or
            #   - Disable entirely (ENABLE_CONTEXT_COMPACTION=false) so OpenCode manages
            #     context alone like the direct llama.cpp path.
            - name: ENABLE_CONTEXT_COMPACTION
              value: "true"
            - name: CONTEXT_COMPACTION_TOKEN_THRESHOLD
              value: "256000"
            - name: ENABLE_API_KEYS
              value: "true"
            - name: USER_PERMISSIONS_FEATURES_API_KEYS
              value: "true"
            - name: ENABLE_FORWARD_USER_INFO_HEADERS
              value: "true"
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_EMBEDDING_MODEL
              value: nomic-embed-text-v1.5
            - name: RAG_OPENAI_API_BASE_URL
              value: http://llm-embed-svc.llm.svc.cluster.local:11435/v1
            - name: RAG_OPENAI_API_KEY
              value: sk-noauth
            - name: VECTOR_DB
              value: pgvector
            - name: PGVECTOR_CREATE_EXTENSION
              value: "true"
            - name: PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH
              value: "768"
            - name: ENABLE_RAG_HYBRID_SEARCH
              value: "true"
            - name: RAG_TOP_K
              value: "4"
            - name: CHUNK_SIZE
              value: "1000"
            - name: CHUNK_OVERLAP
              value: "100"
            # ---- Sub-agents (main, LiteLLM stack) ----
            - name: ENABLE_SUBAGENTS
              value: "true"
            - name: SUBAGENTS_MAX_CONCURRENT
              value: "4"
            - name: SUBAGENTS_MAX_ITERATIONS
              value: "15"
            - name: SUBAGENTS_MAX_OUTPUT
              value: "8000"
            # ---- Observability (Phase 0) ----
            # Open WebUI v0.11.0 has NO scrapeable /metrics endpoint; it only
            # PUSHES OTLP. Point it at the in-namespace OTEL collector, which
            # re-exports a Prometheus /metrics endpoint on :9464 for the
            # hand-rolled Prometheus (static_configs) to scrape.
            - name: ENABLE_OTEL
              value: "true"
            - name: ENABLE_OTEL_METRICS
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://open-webui-collector.llm.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: open-webui
            # Audit trail → stdout (collected by the cluster log stack /
            # Loki / VictoriaLogs). ENABLE_AUDIT_LOGS_FILE defaults on but
            # AUDIT_LOG_LEVEL defaults to NONE, so nothing is emitted until
            # the level is raised here.
            - name: ENABLE_AUDIT_STDOUT
              value: "true"
            - name: AUDIT_LOG_LEVEL
              value: REQUEST_RESPONSE
            # ---- Code interpreter (Phase 2) ----
            # Pyodide runs Python in-browser (WASM): no backend, no cluster
            # access, sandboxed. Covers pandas/numpy/matplotlib/regex/json —
            # i.e. data analysis, math, transforms — the interactive-analysis
            # upgrade. Cluster access comes from the MCP tool servers, NOT here.
            - name: ENABLE_CODE_INTERPRETER
              value: "true"
            - name: CODE_INTERPRETER_ENGINE
              value: pyodide
            - name: USER_PERMISSIONS_FEATURES_CODE_INTERPRETER
              value: "true"
            # ---- Long-term memory (Phase 2) ----
            # Persistent cross-session user memory (stored in CNPG). Background
            # review lets the model distil durable facts from conversations.
            - name: ENABLE_MEMORY_SYSTEM_CONTEXT
              value: "true"
            - name: ENABLE_MEMORY_BACKGROUND_REVIEW
              value: "true"
            - name: USER_PERMISSIONS_FEATURES_MEMORIES
              value: "true"
            # ---- Governance / RBAC (Phase 2) ----
            # Stop open self-signup: new OIDC users land in "pending" until an
            # admin (or a mapped Zitadel role) promotes them. Roles are mapped
            # from the Zitadel "roles" claim — configure the claim in the
            # Zitadel app for this to take effect.
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: roles
            - name: OAUTH_ALLOWED_ROLES
              value: user,admin
            - name: OAUTH_ADMIN_ROLES
              value: admin
            # ---- Evaluation (Phase 2) ----
            # Side-by-side model arena for interactive quality comparison.
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "true"
            # ---- Tool servers (Phase 1) ----
            # Registers the read-only MCP tool servers (Kubernetes + GitHub).
            # Sourced from the open-webui-config secret because the GitHub
            # connection embeds the read-only PAT as a bearer key (templated by
            # ESO from Vault). Open WebUI's native agentic loop calls these MCP
            # servers directly — no separate orchestration service. Admin-managed
            # only (USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS left false).
            - name: TOOL_SERVER_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: open-webui-config
                  key: TOOL_SERVER_CONNECTIONS
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
              readOnly: false
            - name: static
              mountPath: /app/backend/open_webui/static
              readOnly: false
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: static
          emptyDir:
            sizeLimit: 64Mi
        - name: temp
          emptyDir:
            sizeLimit: 128Mi
