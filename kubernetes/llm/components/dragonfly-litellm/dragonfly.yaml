---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: litellm-dragonfly
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  skipFSGroup: true
  serviceAccountName: litellm-dragonfly
  authentication:
    passwordFromSecret:
      name: litellm-dragonfly-redis-url
      key: password
  # renovate: datasource=docker depName=docker.dragonflydb.io/dragonflydb/dragonfly
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node-role.kubernetes.io/gpu: ""
  resources:
    limits:
      cpu: 150m
      memory: 1Gi
    requests:
      cpu: 15m
      memory: 64Mi
