---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: litellm-dragonfly
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  skipFSGroup: true
  serviceAccountName: litellm-dragonfly
  authentication:
    passwordFromSecret:
      name: litellm-dragonfly-redis-url
      key: password
  # renovate: datasource=docker depName=docker.dragonflydb.io/dragonflydb/dragonfly
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node-role.kubernetes.io/gpu: ""
  resources:
    limits:
      cpu: 150m
      memory: 1Gi
    requests:
      cpu: 15m
      memory: 64Mi
