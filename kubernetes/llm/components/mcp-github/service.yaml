---
apiVersion: v1
kind: Service
metadata:
  name: mcp-github
  namespace: llm
  labels:
    app.kubernetes.io/name: mcp-github
    app.kubernetes.io/instance: mcp-github
spec:
  ipFamilies:
    - IPv4
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: mcp-github
