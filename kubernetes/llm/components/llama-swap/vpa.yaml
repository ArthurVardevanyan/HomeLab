---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llama-swap
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: llama-swap
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-swap
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: llama-swap
        minAllowed:
          # Raised from 100m to match the deployment's static cpu request
          # (1 core) — otherwise VPA would recommend the request straight
          # back down toward its prior ~584m observed target, undoing the
          # CPU-priority fix in deployment.yaml.
          cpu: "1"
          memory: 512Mi
          ephemeral-storage: 32Mi
        maxAllowed:
          cpu: "2"
          memory: 64Gi
          ephemeral-storage: 1Gi
        controlledResources:
          - cpu
          - memory
          - ephemeral-storage
        controlledValues: RequestsOnly
      - containerName: metrics-exporter
        minAllowed:
          # Matches the deployment's static request/limit (50m/64Mi,
          # 100m/128Mi) — a lightweight sidecar with no meaningful load
          # variance, so bound VPA tightly rather than letting it drift.
          cpu: "10m"
          memory: 32Mi
        maxAllowed:
          cpu: "250m"
          memory: 256Mi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
