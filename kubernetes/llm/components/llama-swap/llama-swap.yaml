---
healthCheckTimeout: 900

store:
  path: /var/lib/llama-swap/llama-swap.db

upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - ^/slots$
    - ^/metrics$

hooks:
  on_startup:
    preload:
      # Preload 35B MoE on GPU 0 + 27B dense on GPU 1
      # embed-spread is also preloaded — 0.6B Q8_0 uses ~2 GB across both GPUs,
      # fitting alongside any dual chat config without pressure.
      # flash-next is disabled (commented out) - see its comment block below.
      - embed-spread
      - 35b-gpu0
      - 27b-gpu1

macros:
  # vllm-wrapper with level-2 sleep (PVC-backed, weights discarded on sleep).
  #
  # Each of the 4 vLLM models (35b-gpu0, 35b-gpu1, 27b-gpu0, 27b-gpu1) gets
  # its OWN fixed vLLM port (8000-8003). They must NOT share a port per GPU:
  # vllm-wrapper's checkHealthy only checks for HTTP 200 on the port, not
  # which model answered. Two models sharing a port (previously 8000 for
  # both GPU-0 models, 8001 for both GPU-1 models) meant that if model A's
  # daemon was still alive (e.g. stop raced, or a previous unload silently
  # failed) when model B was requested on the same GPU, B's wrapper would
  # find A's daemon already answering 200 on that port and adopt it as if it
  # were B (see serveCmd Path D, "awake and healthy, no wake needed") —
  # llama-swap would report B loaded while the GPU actually still ran A.
  # Observed directly: requesting 35b-gpu1 returned 27b-gpu1's /v1/models
  # response because both used port 8001 and 27b-gpu1's daemon had not
  # exited. One port per model makes this class of collision impossible
  # regardless of stop/wrapper timing.
  # vllm-wrapper listens on the llama-swap assigned ${PORT} and proxies to
  # the fixed vLLM port.
  #
  # Sleep mode is currently DISABLED for every vLLM model (35B and 27B): no
  # model passes --enable-sleep-mode, none has a cmdStop, and all set
  # sleepLevel: 0, so a matrix eviction simply stops the process. The 27B
  # macros omit --sleep-level; the 35B macros keep a legacy --sleep-level 2
  # that is inert without --enable-sleep-mode. To re-enable 27B sleep:
  # restore --sleep-level 2 in its macro, add --enable-sleep-mode to its
  # cmd, and restore its cmdStop + unloadTimeout: 120 (see git history).
  cmd_base_vllm_35b_gpu0: "/app/vllm-wrapper serve --sleep-level 2 --wait-timeout 600s --vllm-url http://127.0.0.1:8000 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_vllm_35b_gpu1: "/app/vllm-wrapper serve --sleep-level 2 --wait-timeout 600s --vllm-url http://127.0.0.1:8001 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_vllm_27b_gpu0: "/app/vllm-wrapper serve --wait-timeout 600s --vllm-url http://127.0.0.1:8002 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_vllm_27b_gpu1: "/app/vllm-wrapper serve --wait-timeout 600s --vllm-url http://127.0.0.1:8003 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_llama: "/app/llama-device-wrapper.sh --port ${PORT} --host 127.0.0.1 --cont-batching -ngl 99 --flash-attn on --cache-type-k f16 --cache-type-v f16 --ubatch-size 2048 --jinja --poll 0 -t 12 --threads-http 4 --cache-reuse 256 --load-mode none --metrics"

models:
  # ==========================================
  # 1. Qwen 3.6 35B-A3B (MoE) — with vision tower, 131K ctx
  #    Source: rcs1000/Qwen3.6-35B-A3B-MTP-Preserved-GPTQ-Int4 @4b2e1978
  #    Fallback: llmfan46/Qwen3.6-35B-A3B-MoE-GPTQ-Int4 (cookbook-verified)
  # ==========================================
  # NOTE: 35B does NOT use --enable-sleep-mode (pending retest — see
  # "Sleep mode compatibility" in README.md). An earlier diagnostic run
  # attributed a boot failure (error 40, Level Zero handle exhaustion) to
  # 35B's MoE expert-tensor count under the sleep-mode allocator, but that
  # run also had PYTORCH_ALLOC_CONF's expandable_segments disabled globally
  # plus a per-model max_split_size_mb:20 cap (both since reverted — see
  # containerfile and git history), which independently fragments every
  # allocation regardless of sleep mode. The MoE-specific mechanism was
  # never isolated from that confound. Sleep mode will be re-tried on 35B
  # once the allocator revert is confirmed stable.
  35b-gpu0:
    cmd: '${cmd_base_vllm_35b_gpu0} /data/models/Qwen3.6-35B-A3B-GPTQ-Int4 --host 127.0.0.1 --port 8000 --quantization gptq --dtype float16 --max-model-len 262144 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 6 --max-num-batched-tokens 8192 --served-model-name 35b-gpu0 --kv-cache-memory 4501777792' # --gpu-memory-utilization 0.93
    env:
      # ONEAPI_DEVICE_SELECTOR has no effect on vLLM/torch XPU device
      # enumeration (verified: torch.xpu.device_count() is unchanged across
      # every selector value). vLLM's XPUPlatform claims ZE_AFFINITY_MASK as
      # its own device_control_env_var and re-translates logical<->physical
      # device IDs through it, so ZE_AFFINITY_MASK is the only var that
      # actually needs to be set here.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=0"
      # Draft-only INT4 lm_head (image patch_draft_lmhead_int4.py): ~+24% decode
      # on this model, acceptance unchanged. See README "INT4 draft head A/B".
      - "B70_DRAFT_LMHEAD_INT4=1"
    ttl: 0
    sleepLevel: 0

  35b-gpu1:
    # Hidden - not in any matrix set, requesting it evicts the entire set.
    # Only needed if a client explicitly targets this model ID.
    # CPU KV offloading: 4 GiB pinned host RAM per instance. --kv-offloading-size
    # selects the size of the CPU-side KV-cache pool; --kv-cache-memory-bytes
    # (renamed from --kv-cache-memory in v0.32.0) caps the GPU KV pool.
    # Under the current matrix only one of these hidden models is resident
    # at a time → ~4 GiB pinned (8 GiB upper bound on the ~76 GiB gpu-1 node).
    unlisted: true
    cmd: '${cmd_base_vllm_35b_gpu1} /data/models/Qwen3.6-35B-A3B-GPTQ-Int4 --host 127.0.0.1 --port 8001 --quantization gptq --dtype float16 --max-model-len 262144 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 6 --max-num-batched-tokens 8192 --served-model-name 35b-gpu1 --kv-cache-memory-bytes 4501777792 --mamba-cache-mode align --no-disable-hybrid-kv-cache-manager --kv-offloading-backend native --kv-offloading-size 4' # --gpu-memory-utilization 0.93
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=1"
      # Draft-only INT4 lm_head, same as 35b-gpu0 above.
      - "B70_DRAFT_LMHEAD_INT4=1"
    ttl: 0
    sleepLevel: 0

  # ==========================================
  # 2. Qwen 3.8 27B (dense) — with vision, 131K ctx
  #    Source: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16 @9d189a60
  #
  #    vLLM XPU startup memory check is a known false-positive on UMA systems:
  #    - #50135: "ValueError: Free memory on device xpu:0 (0.22/30.3 GiB) on
  #      startup is less than desired GPU memory utilization"
  #    - #48140: "Startup free-memory check uses MemFree instead of
  #      MemAvailable — spurious ValueError on UMA devices (GB10 / GB200 /
  #      Jetson)"
  #
  #    Root cause: vLLM's pre-flight check reads /proc/meminfo MemFree (or
  #    the XPU equivalent) which does not account for reclaimable kernel memory
  #    or the PyTorch caching allocator's existing allocations. On UMA systems
  #    where device memory is a subset of the total host memory, MemFree is
  #    much lower than MemAvailable, causing the check to fail even when enough
  #    VRAM is physically available.
  #
  #    Workaround: preload models in a specific order so that by the time the
  #    27B model's vLLM instance starts, the embedding model's memory has been
  #    accounted for by the allocator, and the vLLM memory check uses a higher
  #    effective available threshold. Also pin each 27B instance to a dedicated
  #    GPU with ZE_AFFINITY_MASK to avoid cross-GPU fragmentation during the
  #    initial allocation.
  # ==========================================
  27b-gpu0:
    # Hidden - not in any matrix set, requesting it evicts the entire set.
    # Only needed if a client explicitly targets this model ID.
    # CPU KV offloading: 8 GiB pinned host RAM per instance. --kv-cache-memory-bytes
    # (renamed from --kv-cache-memory in v0.32.0) caps the GPU KV pool to skip
    # profiling. --mamba-cache-mode align snapshots GDN recurrent state at block
    # boundaries — vLLM enables this automatically when prefix caching is on
    # (verified in startup logs: "Mamba cache mode is set to 'align' ... by default").
    # --no-disable-hybrid-kv-cache-manager
    # is a startup-fail guard: v0.32.0's OffloadingConnector subclasses
    # SupportsHMA so HMA stays on, but a future vLLM that drops HMA support
    # will hard-error instead of silently degrading GDN models. Under the
    # current matrix only one of these hidden models is resident at a time
    # → ~8 GiB pinned (16 GiB upper bound on the ~76 GiB gpu-1 node).
    unlisted: true
    # --cudagraph-capture-sizes 1 2 4 8 12 16: trims vLLM's auto-computed
    # cudagraph capture-size list (see 35b-gpu0 above for the full rationale).
    # --max-num-seqs 4 + size 16 mirror 27b-gpu1 (see its comment below).
    cmd: '${cmd_base_vllm_27b_gpu0} /data/models/Qwen3.8-27B-GPTQ-Int4 --host 127.0.0.1 --port 8002 --quantization gptq --dtype float16 --max-model-len 172032 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 4 --max-num-batched-tokens 8192 --served-model-name 27b-gpu0 --kv-cache-memory-bytes 6942327011 --mamba-cache-mode align --no-disable-hybrid-kv-cache-manager --kv-offloading-backend native --kv-offloading-size 8 --cudagraph-capture-sizes 1 2 4 8 12 16' # --gpu-memory-utilization 0.93
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      # Sleep mode is disabled for 27B for now (see the macros comment). When
      # re-enabled, --enable-sleep-mode requires PYTORCH_ALLOC_CONF's
      # expandable_segments to be OFF for the sleep-mode pool's malloc
      # callback (pytorch#147851); the image-wide default is True
      # (containerfile) and patch_fix_xpu_sleep.py toggles it only inside the
      # pool context. Do NOT set PYTORCH_ALLOC_CONF per model: setting it
      # image-wide broke 35B (fragmented every weight allocation into ~20
      # MiB chunks, causing a Level Zero CAT error / device-lost crash).
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=0"
      # Draft-only INT4 lm_head + MTP layer, same as 27b-gpu1 below (see its
      # comment for the compile-cache reason behind VLLM_CACHE_ROOT; the two
      # 27B models can share that directory because both have the flag on).
      - "B70_DRAFT_LMHEAD_INT4=1"
      - "B70_DRAFT_MTP_INT4=1"
      - "VLLM_CACHE_ROOT=/var/lib/vllm-cache/mtp-int4"
    ttl: 0
    sleepLevel: 0

  27b-gpu1:
    # --cudagraph-capture-sizes 1 2 4 8 12 16: see 27b-gpu0 above for the full
    # rationale (identical --max-num-seqs 4 / MTP config on this model).
    # --max-num-seqs 4 + cudagraph size 16 (2026-10-21, with the INT4 draft head):
    # 4 concurrent requests aggregate 241 tok/s vs 162 at --max-num-seqs 3 (the
    # 4th request used to queue ~7 s); 1-3 streams unchanged. No extra GPU
    # memory at the pinned KV pool size. 27b-gpu0 (hidden) mirrors this but was not
    # benchmarked.
    cmd: '${cmd_base_vllm_27b_gpu1} /data/models/Qwen3.8-27B-GPTQ-Int4 --host 127.0.0.1 --port 8003 --quantization gptq --dtype float16 --max-model-len 172032 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 4 --max-num-batched-tokens 8192 --served-model-name 27b-gpu1 --kv-cache-memory 6942327011 --cudagraph-capture-sizes 1 2 4 8 12 16' # --gpu-memory-utilization 0.93
    env:
      # See 27b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal and sleep mode.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=1"
      # Draft-only INT4 lm_head + MTP layer (image patches): +35% decode, MTP
      # acceptance within 0.01 of baseline. B70_DRAFT_MTP_INT4 empties the
      # draft's BF16 weights at load time, and vLLM's torch.compile cache key
      # does NOT include B70_* env: a draft graph compiled without it fails
      # with "assert_size_stride ... wrong number of dimensions". Hence the
      # dedicated VLLM_CACHE_ROOT. Remove both together, never one alone.
      - "B70_DRAFT_LMHEAD_INT4=1"
      - "B70_DRAFT_MTP_INT4=1"
      - "VLLM_CACHE_ROOT=/var/lib/vllm-cache/mtp-int4"
    ttl: 0
    sleepLevel: 0

  # ==========================================
  # 3. Qwen3 Embedding 0.6B (spread across both GPUs)
  #    Root cause of the earlier failure (fixed via llama-device-wrapper.sh
  #    + the hermetic /app/rt runtime — see containerfile): this image's
  #    default LD_LIBRARY_PATH puts /opt/venv/lib (vLLM's SYCL 9 stack)
  #    first, so plain /app/llama-server bound vLLM's Intel OpenMP runtime
  #    instead of the oneAPI 2025.3 runtime it was built against (all of
  #    libiomp5/libimf/libsvml/libintlc/libirng differ by md5 between the
  #    two). That ABI mismatch segfaulted on CPU (-ngl 0, immediately after
  #    "llama threadpool init") and hung on GPU (-ngl 99, host-side stall
  #    mid-layer-0 attention — VRAM allocated, GPU idle, one CPU thread
  #    pinned). It was NOT a CPU-dispatch/Zen 2/haswell issue (haswell is
  #    the correct ggml CPU variant for this node's Ryzen 5 3600), and NOT
  #    a Battlemage-specific bug — llama-swap's upstream mostlygeek/
  #    llama-swap image runs this exact command/env with no changes needed.
  # ==========================================
  embed-spread:
    cmd: /app/llama-device-wrapper.sh --port ${PORT} --host 127.0.0.1 --cont-batching -m /data/models/Qwen3-Embedding-0.6B-Q8_0.gguf --split-mode layer --tensor-split 1,1 -ngl 99 -t 8 --threads 8 --ctx-size 81920 --cache-type-k q8_0 --cache-type-v q8_0 --embedding --ubatch-size 256 --jinja --poll 0 --kv-unified --parallel 20 --metrics
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0,1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "GGML_SYCL_ENABLE_GRAPH=1"
    ttl: 0
    concurrencyLimit: 20

  # ==========================================
  # 4. Qwen 3.8 Flash-Next (qwen4_exp) — llama.cpp GGUF path
  #    Source: unsloth/Qwen3.8-Flash-Next-GGUF, UD-IQ4_XS (3 shards, ~94 GB:
  #    4-bit core ~60 GB, 4-bit PLE table ~25.6 GB read on demand from host).
  #    Shards live flat in /data/models/ (model-downloader cronjob). DISABLED
  #    (model, matrix var/set and the LiteLLM route are commented out; to
  #    re-enable, uncomment all of them). When enabled it is on demand only:
  #    requesting flash-next evicts 35b-gpu0/27b-gpu1 (keeps embed-spread) and
  #    takes ~5 min to load; requesting 35B/27B evicts it.
  #    It is disabled because it is much slower than 35B/27B here
  #    (~190 tok/s prefill, ~10.6 tok/s decode vs ~40-70 tok/s decode) and a
  #    4-bit quant is the smallest that keeps its quality lead (Unsloth top-1
  #    agreement: IQ4_XS 89.6%, Q2_K_XL 82.7%). Use it for hard agentic jobs.
  #    vLLM XPU is not an option (qwen4_exp raises NotImplementedError on
  #    XPU). See notes/qwen3.8-flash-next.md.
  #
  #    Layers: the whole model does NOT fit in 2x32 GB VRAM with the KV pool.
  #    --fit on places layers/experts to fit the free VRAM on each GPU, with
  #    --fit-target 3072 MiB of headroom per device for the MTP head and the
  #    compute buffers. Manual placement (-ngl all --n-cpu-moe N
  #    --tensor-split ...) was tried: -ngl splits by layer count, not size, so
  #    SYCL1 over-committed (slow), and a rebalanced split hung the GPU
  #    (xe: kernel-submitted job timeout, repeated GT0 resets) during
  #    load_tensors. -t/-tb 6 match the pod CPU limit (6) and the 6 physical
  #    cores. (Add -lv 4 to log buffer sizes when debugging placement.)
  #
  #    PCIe: SYCL0 (renderD128, 06:00.0) is behind the B550 chipset at Gen3 x4
  #    (~3.9 GB/s); SYCL1 (renderD129, 2d:00.0) is on the CPU at Gen4 x16.
  #    Experts kept on the CPU are copied to a GPU for every prompt ubatch
  #    (--op-offload), so prefill is bound by PCIe, not by the GPUs.
  #    --device SYCL1,SYCL0 puts the fast card first, and a large
  #    --ubatch-size (2048; --batch-size must be >= it) amortizes the copies.
  #    Measured: ~48 tok/s prefill at ubatch 512, ~190 tok/s at 2048 (decode
  #    ~10.6 tok/s, MTP acceptance 63-76%). Larger ubatch grows the compute
  #    buffer (~4 GB per card, plus ~9 GB for the MTP head), which --fit
  #    absorbs by moving more experts to the CPU.
  #
  #    MTP: the self-contained Q8_0 head (~4.1 GB VRAM, own embedding/output
  #    tensors) drafts up to 2 tokens per step. The -shared- head does not
  #    load in this build (token_embd.weight not found). Verify with "draft
  #    acceptance" in the log or llamacpp:spec_decode_* metrics.
  #    GGML_SYCL_ENABLE_GRAPH is not set: SYCL graphs are disabled whenever
  #    more than one device is used.
  #
  #    KV: --kv-unified shares one pool (--ctx-size, = model train ctx 262144)
  #    across both slots, with no per-slot cap: one session can use the full
  #    262144 tokens, or two sessions share the pool. --cache-reuse is
  #    omitted: the context does not support it.
  #
  #    Memory: --load-mode mmap (NOT mmap+mlock: mlock pins the whole ~94 GB
  #    file, which cannot fit the node) with --lazy-mode on, so the PLE rows
  #    are read on demand from the page cache instead of kept resident.
  # ==========================================
  # flash-next:
  #   cmd: /app/llama-device-wrapper.sh --port ${PORT} --host 127.0.0.1 --cont-batching -m /data/models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf --device SYCL1,SYCL0 --fit on --fit-target 3072 -t 6 -tb 6 --threads-http 4 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --ctx-size 262144 --kv-unified --parallel 2 --batch-size 2048 --ubatch-size 2048 --load-mode mmap --lazy-mode on --jinja --poll 0 --metrics -md /data/models/mtp-Qwen3.8-Flash-Next-Q8_0.gguf -ngld all --spec-type draft-mtp --spec-draft-n-max 2
  #   env:
  #     - "ONEAPI_DEVICE_SELECTOR=level_zero:0,1"
  #     - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
  #   ttl: 0

matrix:
  vars:
    # GPU 0 models
    M35-0: 35b-gpu0
    M27-0: 27b-gpu0
    # GPU 1 models
    M35-1: 35b-gpu1
    # M35-1: 35b-gpu1
    M27-1: 27b-gpu1
    # Spread models
    S35-e: embed-spread
    # Both-GPU llama.cpp chat model (see flash-next above)
    # MFLASH: flash-next
  #
  #  # Eviction cost: higher = harder to evict
  #  evict_costs:
  #    M35-0: 20
  #    M35-1: 10
  #    M27-0: 15
  #    M27-1: 15
  #    S35-e: 1

  sets:
    # --- Dual (one 35B per GPU, chat-only) ---
    # dual_35b: M35-0 & M35-1

    # # --- Dual (one 27B per GPU, chat-only) ---
    # dual_27b: M27-0 & M27-1

    # # --- Dual (35B + 27B mixed, chat-only) ---
    # dual_35b0-27b1: M35-0 & M27-1
    # dual_27b0-35b1: M27-0 & M35-1

    # # --- Dual with embed spread (one 35B per GPU + embed on both) ---
    # dual_35b-spread: M35-0 & M35-1 & S35-e

    # # --- Dual with embed spread (one 27B per GPU + embed on both) ---
    # dual_27b-spread: M27-0 & M27-1 & S35-e

    # --- Dual with embed spread (35B + 27B mixed + embed on both) ---
    dual_35b0-27b1-spread: M35-0 & M27-1 & S35-e
    # dual_27b0-35b1-spread: M27-0 & M35-1 & S35-e

    # --- Flash-Next on both GPUs + embed on both ---
    # Requesting flash-next evicts 35b-gpu0/27b-gpu1 (keeps embed-spread);
    # requesting either of those evicts flash-next.
    # flash_next: MFLASH & S35-e

    # # --- Embed spread standalone ---
    # embed_spread: S35-e
