---
healthCheckTimeout: 300

store:
  path: /var/lib/llama-swap/llama-swap.db

# Controls /upstream/<model>/<path> passthrough. The llama_swap_affinity
# LiteLLM routing plugin (see litellm.yaml) polls /upstream/<model>/slots to
# read per-instance llama.cpp slot occupancy for load-aware routing between
# the two GPU copies of a model. Restating the built-in default pattern here
# is required: specifying ignorePaths replaces it rather than merging with
# it. Both entries prevent a request from ever triggering a swap; the plugin
# only polls models it already knows are resident, but this is
# defense-in-depth against a plugin bug doing otherwise.
upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$' # llama-swap built-in default
    - ^/slots$ # a /slots poll must never trigger a model load/swap

hooks:
  on_startup:
    # preload takes model IDs (not matrix set names) - 35B non-dense on GPU 0
    # (primary slot, higher eviction cost) + 27B dense on GPU 1 gives useful
    # work on both GPUs from boot rather than data-parallel redundancy.
    preload:
      - 35b-gpu0
      - 27b-gpu1

macros:
  cmd_base: "/app/llama-server --port ${PORT} --host 127.0.0.1 --cont-batching --reasoning-format auto --reasoning-preserve -ngl 99 --flash-attn on --cache-type-k f16 --cache-type-v f16 --ubatch-size 2048 --jinja --poll 0 -t 12 --threads-http 4 --cache-reuse 256 --load-mode none --metrics --spec-type ngram-mod"

models:
  # ==========================================
  # 1. Qwen 3.6 35B (A3B)
  # ==========================================
  35b-gpu0:
    cmd: ${cmd_base} --parallel 2 --ctx-size 294912 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  35b-gpu1:
    cmd: ${cmd_base} --parallel 2 --ctx-size 294912 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  # ==========================================
  # 2. Qwen 3.8 27B
  # ==========================================
  27b-gpu0:
    cmd: ${cmd_base} --parallel 1 --ctx-size 196608 -m /data/models/Qwen3.8-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.8-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  27b-gpu1:
    cmd: ${cmd_base} --parallel 1 --ctx-size 196608 -m /data/models/Qwen3.8-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.8-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  35b-gpu0-dense:
    cmd: ${cmd_base} --parallel 1 --ctx-size 262144 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  35b-gpu1-dense:
    cmd: ${cmd_base} --parallel 1 --ctx-size 262144 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  # ==========================================
  # 4. Qwen 3.6 35B (A3B) — Spread (both GPUs, 1M ctx, parallel 4)
  # ==========================================
  35b-spread:
    cmd: ${cmd_base} --split-mode layer --parallel 5 --ctx-size 1310720 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0,1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 0

  # ==========================================
  # 5. Qwen3 Embedding 4B (GPU 0 and GPU 1, embeddings only)
  # ==========================================
  qwen3-embed-gpu0:
    cmd: /app/llama-server --port ${PORT} --host 127.0.0.1 --cont-batching -m /data/models/Qwen3-Embedding-4B-Q8_0.gguf -t 8 --threads 8 --ctx-size 131072 --cache-type-k f16 --cache-type-v f16 --embedding --ubatch-size 2048 --jinja --poll 0 --parallel 28
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 300

  qwen3-embed-gpu1:
    cmd: /app/llama-server --port ${PORT} --host 127.0.0.1 --cont-batching -m /data/models/Qwen3-Embedding-4B-Q8_0.gguf -t 8 --threads 8 --ctx-size 131072 --cache-type-k f16 --cache-type-v f16 --embedding --ubatch-size 2048 --jinja --poll 0 --parallel 28
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
    ttl: 300

# The matrix dictates all valid VRAM combinations.
# Each set represents one valid model-per-GPU configuration. The solver
# picks one set, guaranteeing exactly one model per GPU and preventing
# spillover to system RAM.
matrix:
  vars:
    # GPU 0 models
    M35-0: 35b-gpu0
    M35-0-d: 35b-gpu0-dense
    M27-0: 27b-gpu0
    # GPU 1 models
    M35-1: 35b-gpu1
    M35-1-d: 35b-gpu1-dense
    M27-1: 27b-gpu1
    ME-0: qwen3-embed-gpu0
    ME-1: qwen3-embed-gpu1
    # Spread models
    S35: 35b-spread

  # Eviction cost: higher = harder to evict. Spread > 35B > 27B.
  # GPU 0 35B costs more than GPU 1 so eviction is deterministic.
  evict_costs:
    S35: 25
    M35-0: 20
    M35-0-d: 20
    M35-1: 10
    M35-1-d: 10
    M27-0: 15
    M27-1: 15
    ME-1: 5

  sets:
    # --- Dual (one 35B variant per GPU, all combos) ---
    dual_35b: M35-0 & M35-1
    dual_35b-d: M35-0-d & M35-1-d
    dual_35b-0d-1: M35-0-d & M35-1
    dual_35b-0-1d: M35-0 & M35-1-d

    # --- Dual (one 27B per GPU) ---
    dual_27b: M27-0 & M27-1

    # --- Dual (35B + 27B mixed, one per GPU) ---
    dual_35b0-27b1: M35-0 & M27-1
    dual_35b0d-27b1: M35-0-d & M27-1
    dual_27b0-35b1: M27-0 & M35-1
    dual_27b0-35b1d: M27-0 & M35-1-d

    # --- Spread (one instance spanning both GPUs) ---
    spread_35b: S35

    # --- Embedding companion models (GPU 0 chat + GPU 1 embed) ---
    embed_35b0-1: M35-0 & ME-1
    embed_35b0d-1: M35-0-d & ME-1
    embed_27b0-1: M27-0 & ME-1

    # --- Embedding companion models (GPU 1 chat + GPU 0 embed) ---
    embed_35b1-0: M35-1 & ME-0
    embed_35b1-d-0: M35-1-d & ME-0
    embed_27b1-0: M27-1 & ME-0
