---
healthCheckTimeout: 120

store:
  path: /var/lib/llama-swap/llama-swap.db

# Controls /upstream/<model>/<path> passthrough. The llama_swap_affinity
# LiteLLM routing plugin (see litellm.yaml) polls /upstream/<model>/slots to
# read per-instance llama.cpp slot occupancy for load-aware routing between
# the two GPU copies of a model. Restating the built-in default pattern here
# is required: specifying ignorePaths replaces it rather than merging with
# it. Both entries prevent a request from ever triggering a swap; the plugin
# only polls models it already knows are resident, but this is
# defense-in-depth against a plugin bug doing otherwise.
upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$' # llama-swap built-in default
    - ^/slots$ # a /slots poll must never trigger a model load/swap

hooks:
  on_startup:
    # preload takes model IDs (not matrix set names) - "dual_35b" here was a
    # silent no-op, forcing a ~23s cold start on the first 35b request.
    preload:
      - 35b-gpu0
      - 35b-gpu1

macros:
  # The unified base command for all single-card instances
  #
  # Tuning additions (2026-08-14), informed by measured decode throughput
  # (p50 ~20.6 t/s from /api/metrics/stats, n=778) far below the ~76 t/s
  # single-stream ceiling — the GPU is idle most of each decode step, i.e.
  # dispatch-bound, not bandwidth-bound, on this box's 6-core/12-thread
  # Ryzen 5 3600:
  #   --spec-type ngram-simple  - model-free speculative decoding: verifies
  #     N drafted tokens per forward pass instead of N separate dispatch
  #     rounds. No draft model / extra VRAM. Ideal for this workload's heavy
  #     prompt/context reuse (25.17M cache tokens vs 5.17M input tokens).
  #   --poll 0                  - stop the ggml threadpool spin-waiting;
  #     with -ngl 99 it has almost no real work and was competing with the
  #     Vulkan submit thread for the same physical cores.
  #   -t 2 --threads-http 2     - was -1 (auto -> 6 threads) x 2 processes
  #     on a 6-core CPU inside a 5-CPU pod quota that also runs LiteLLM,
  #     Open WebUI, Dragonfly, and CNPG. Bound explicitly to stop threadpool
  #     oversubscription/thrash.
  #   --cache-reuse 256         - allow KV reuse via shifting when a prompt
  #     changes mid-prefix (Open WebUI context compaction, RAG re-injection,
  #     tool-result insertion all do this).
  #   --load-mode none          - plain buffered reads, no mmap. After this
  #     change, cgroup memory.stat shows active_file ~2 MB (was ~20.6 GiB)
  #     and inactive_file ~23 GiB (page-cache-backed by buffered reads).
  #     Working set dropped from ~32 GiB (oc adm top: 32,177 Mi) to ~4.7 GiB
  #     (4,698 Mi) — well under the 16 GiB VPA floor. Confirmed via
  #     `/proc/<pid>/maps` that the GGUF is not mmapped (0 matching entries).
  #     Note: --load-mode dio was tried first but provably does not work on
  #     this hardware + storage stack (gguf + rook-ceph-block-ci/RBD/ext4):
  #     llama.cpp logged "read_raw_unsafe: Falling back to buffered IO due to
  #     Bad address" (EFAULT from O_DIRECT on the unaligned path) and fell
  #     back to plain buffered reads — which is what `none` requests
  #     directly, without the failed attempt. Trade-off: `none` uses kernel
  #     readahead on load but does not inflate the working set during decode.
  #     Observed cold load time: 82.3s (page-cache-warm second load: 7.3s).
  cmd_base: "/app/llama-server --port ${PORT} --host 127.0.0.1 --parallel 2 --cont-batching --split-mode none --reasoning-format auto -ngl 99 --flash-attn on --cache-type-k f16 --cache-type-v f16 --ubatch-size 2048 --jinja --ctx-size 262144 --no-kv-unified --spec-type ngram-simple --poll 0 -t 2 --threads-http 2 --cache-reuse 256 --load-mode none --metrics"

models:
  # ==========================================
  # 1. Qwen 3.6 35B (A3B)
  # ==========================================
  35b-gpu0:
    cmd: ${cmd_base} -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "GGML_VK_VISIBLE_DEVICES=0"
    ttl: 0

  35b-gpu1:
    cmd: ${cmd_base} -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "GGML_VK_VISIBLE_DEVICES=1"
    ttl: 0

  # ==========================================
  # 2. Qwen 3.6 27B
  # ==========================================
  27b-gpu0:
    cmd: ${cmd_base} --ctx-size 196608 -m /data/models/Qwen3.6-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "GGML_VK_VISIBLE_DEVICES=0"
    ttl: 0

  27b-gpu1:
    cmd: ${cmd_base} --ctx-size 196608 -m /data/models/Qwen3.6-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "GGML_VK_VISIBLE_DEVICES=1"
    ttl: 0

  # ==========================================
  # 3. Qwen 3 Coder 30B (A3B)
  # ==========================================
  coder30b-gpu0:
    cmd: ${cmd_base} -m /data/models/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf
    env:
      - "GGML_VK_VISIBLE_DEVICES=0"
    ttl: 0

  coder30b-gpu1:
    cmd: ${cmd_base} -m /data/models/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf
    env:
      - "GGML_VK_VISIBLE_DEVICES=1"
    ttl: 0

# The matrix dictates all valid VRAM combinations.
# By explicitly pairing exactly one GPU 0 model with exactly one GPU 1 model,
# you guarantee safe multi-tenant routing without thrashing.
matrix:
  vars:
    M35-0: 35b-gpu0
    M35-1: 35b-gpu1
    M27-0: 27b-gpu0
    M27-1: 27b-gpu1
    C30-0: coder30b-gpu0
    C30-1: coder30b-gpu1

  # Relative cost of losing a running model when the solver must evict to
  # make room for a new request (default: 1 for anything unlisted). The 35B
  # instances are the primary public model (highest traffic + longest
  # preload), so protect them preferentially over 27B/coder when a swap is
  # unavoidable. Paired with the LiteLLM GPU-preference stagger and the
  # llama-swap-affinity routing plugin (see litellm.yaml), evictions of 35b
  # should be rare in practice.
  #
  # Asymmetric on purpose: from dual_35b (both copies loaded), a 27B/coder
  # request must evict exactly one 35B copy. gpu1's copy is deliberately
  # cheaper (10 vs 20) so that eviction is deterministic - it sacrifices the
  # 35b-gpu1 overflow copy and keeps 35b-gpu0 (the GPU-preference-ordering
  # primary in litellm.yaml, and the one most likely to hold live prompt
  # cache) resident. A symmetric cost here would leave that choice to
  # set-definition order instead, which is far more fragile to reason about.
  evict_costs:
    M35-0: 20
    M35-1: 10

  sets:
    # --- Data Parallel (Same model duplicated on both cards) ---
    dual_35b: M35-0 & M35-1
    dual_27b: M27-0 & M27-1
    dual_coder: C30-0 & C30-1

    # --- Mixed Workloads (Different models running side-by-side) ---
    mix_1: M35-0 & M27-1
    mix_2: M27-0 & M35-1
    mix_3: M35-0 & C30-1
    mix_4: C30-0 & M35-1
    mix_5: M27-0 & C30-1
    mix_6: C30-0 & M27-1
