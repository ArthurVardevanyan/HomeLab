---
healthCheckTimeout: 900

store:
  path: /var/lib/llama-swap/llama-swap.db

upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - ^/slots$
    - ^/metrics$

hooks:
  on_startup:
    preload:
      # Preload 35B MoE on GPU 0 + 27B dense on GPU 1
      # embed-spread is also preloaded — 0.6B Q8_0 uses ~2 GB across both GPUs,
      # fitting alongside any dual chat config without pressure.
      - embed-spread
      - 35b-gpu0
      - 27b-gpu1

macros:
  # vllm-wrapper with level-2 sleep (PVC-backed, weights discarded on sleep).
  #
  # Each of the 4 vLLM models (35b-gpu0, 35b-gpu1, 27b-gpu0, 27b-gpu1) gets
  # its OWN fixed vLLM port (8000-8003). They must NOT share a port per GPU:
  # vllm-wrapper's checkHealthy only checks for HTTP 200 on the port, not
  # which model answered. Two models sharing a port (previously 8000 for
  # both GPU-0 models, 8001 for both GPU-1 models) meant that if model A's
  # daemon was still alive (e.g. stop raced, or a previous unload silently
  # failed) when model B was requested on the same GPU, B's wrapper would
  # find A's daemon already answering 200 on that port and adopt it as if it
  # were B (see serveCmd Path D, "awake and healthy, no wake needed") —
  # llama-swap would report B loaded while the GPU actually still ran A.
  # Observed directly: requesting 35b-gpu1 returned 27b-gpu1's /v1/models
  # response because both used port 8001 and 27b-gpu1's daemon had not
  # exited. One port per model makes this class of collision impossible
  # regardless of stop/wrapper timing.
  # vllm-wrapper listens on the llama-swap assigned ${PORT} and proxies to
  # the fixed vLLM port.
  cmd_base_vllm_35b_gpu0: "/app/vllm-wrapper serve --sleep-level 2 --wait-timeout 600s --vllm-url http://127.0.0.1:8000 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_vllm_35b_gpu1: "/app/vllm-wrapper serve --sleep-level 2 --wait-timeout 600s --vllm-url http://127.0.0.1:8001 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_vllm_27b_gpu0: "/app/vllm-wrapper serve --sleep-level 2 --wait-timeout 600s --vllm-url http://127.0.0.1:8002 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_vllm_27b_gpu1: "/app/vllm-wrapper serve --sleep-level 2 --wait-timeout 600s --vllm-url http://127.0.0.1:8003 --listen :${PORT} -- /app/vllm-device-wrapper.sh"
  cmd_base_llama: "/app/llama-device-wrapper.sh --port ${PORT} --host 127.0.0.1 --cont-batching -ngl 99 --flash-attn on --cache-type-k f16 --cache-type-v f16 --ubatch-size 2048 --jinja --poll 0 -t 12 --threads-http 4 --cache-reuse 256 --load-mode none --metrics"

models:
  # ==========================================
  # 1. Qwen 3.6 35B-A3B (MoE) — with vision tower, 131K ctx
  #    Source: rcs1000/Qwen3.6-35B-A3B-MTP-Preserved-GPTQ-Int4 @4b2e1978
  #    Fallback: llmfan46/Qwen3.6-35B-A3B-MoE-GPTQ-Int4 (cookbook-verified)
  # ==========================================
  # NOTE: 35B does NOT use --enable-sleep-mode (pending retest — see
  # "Sleep mode compatibility" in README.md). An earlier diagnostic run
  # attributed a boot failure (error 40, Level Zero handle exhaustion) to
  # 35B's MoE expert-tensor count under the sleep-mode allocator, but that
  # run also had PYTORCH_ALLOC_CONF's expandable_segments disabled globally
  # plus a per-model max_split_size_mb:20 cap (both since reverted — see
  # containerfile and git history), which independently fragments every
  # allocation regardless of sleep mode. The MoE-specific mechanism was
  # never isolated from that confound. Sleep mode will be re-tried on 35B
  # once the allocator revert is confirmed stable.
  35b-gpu0:
    cmd: '${cmd_base_vllm_35b_gpu0} /data/models/Qwen3.6-35B-A3B-GPTQ-Int4 --host 127.0.0.1 --port 8000 --quantization gptq --dtype float16 --max-model-len 262144 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 6 --max-num-batched-tokens 8192 --served-model-name 35b-gpu0 --kv-cache-memory 4239633792' # --gpu-memory-utilization 0.93
    env:
      # ONEAPI_DEVICE_SELECTOR has no effect on vLLM/torch XPU device
      # enumeration (verified: torch.xpu.device_count() is unchanged across
      # every selector value). vLLM's XPUPlatform claims ZE_AFFINITY_MASK as
      # its own device_control_env_var and re-translates logical<->physical
      # device IDs through it, so ZE_AFFINITY_MASK is the only var that
      # actually needs to be set here.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=0"
    ttl: 0
    sleepLevel: 0

  35b-gpu1:
    cmd: '${cmd_base_vllm_35b_gpu1} /data/models/Qwen3.6-35B-A3B-GPTQ-Int4 --host 127.0.0.1 --port 8001 --quantization gptq --dtype float16 --max-model-len 262144 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 6 --max-num-batched-tokens 8192 --served-model-name 35b-gpu1 --kv-cache-memory 4239633792' # --gpu-memory-utilization 0.93
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=1"
    ttl: 0
    sleepLevel: 0

  # ==========================================
  # 2. Qwen 3.8 27B (dense) — with vision, 131K ctx
  #    Source: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16 @9d189a60
  #
  #    vLLM XPU startup memory check is a known false-positive on UMA systems:
  #    - #50135: "ValueError: Free memory on device xpu:0 (0.22/30.3 GiB) on
  #      startup is less than desired GPU memory utilization"
  #    - #48140: "Startup free-memory check uses MemFree instead of
  #      MemAvailable — spurious ValueError on UMA devices (GB10 / GB200 /
  #      Jetson)"
  #
  #    Root cause: vLLM's pre-flight check reads /proc/meminfo MemFree (or
  #    the XPU equivalent) which does not account for reclaimable kernel memory
  #    or the PyTorch caching allocator's existing allocations. On UMA systems
  #    where device memory is a subset of the total host memory, MemFree is
  #    much lower than MemAvailable, causing the check to fail even when enough
  #    VRAM is physically available.
  #
  #    Workaround: preload models in a specific order so that by the time the
  #    27B model's vLLM instance starts, the embedding model's memory has been
  #    accounted for by the allocator, and the vLLM memory check uses a higher
  #    effective available threshold. Also pin each 27B instance to a dedicated
  #    GPU with ZE_AFFINITY_MASK to avoid cross-GPU fragmentation during the
  #    initial allocation.
  # ==========================================
  27b-gpu0:
    # --cudagraph-capture-sizes 1 2 4 8 12 (DIAGNOSTIC/optimization, this
    # session): trims vLLM's auto-computed cudagraph capture-size list for
    # this model's actual traffic shape. With --max-num-seqs 3 and MTP
    # (num_speculative_tokens=3 -> decode_query_len=4),
    # VllmConfig._set_cudagraph_sizes() computes
    # max_cudagraph_capture_size = min(3*4*2, 512) = 24, producing default
    # sizes [1, 2, 4, 8, 12, 16, 24] — where 4, 8, 12 are the uniform-decode
    # sizes for exactly 1/2/3 concurrent decode requests (load-bearing, do
    # NOT remove) and 16/24 come only from the generic step-8 grid, not
    # tied to any reachable decode-request count at max-num-seqs 3. Trimmed
    # to [1, 2, 4, 8, 12] to drop the two graphs (16, 24) that were sized
    # for a higher max-num-seqs than this model actually runs, reducing the
    # sleep-mode residual VRAM held by capture_model() (which runs outside
    # the sleep-mode pool context, see gpu_worker.py:788 vs. the
    # tag="weights" pool scope at gpu_worker.py:490 — so its graph memory
    # is never reclaimed by sleep()'s empty_cache(), only by full process
    # exit). Verify post-sleep VRAM before/after and confirm no throughput
    # regression (16/24-sized batches were only reachable via mixed
    # decode+prefill chunking, not pure decode, so impact should be
    # minimal to none).
    cmd: '${cmd_base_vllm_27b_gpu0} /data/models/Qwen3.8-27B-GPTQ-Int4 --host 127.0.0.1 --port 8002 --quantization gptq --dtype float16 --max-model-len 175104 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 3 --max-num-batched-tokens 8192 --served-model-name 27b-gpu0 --kv-cache-memory 7047184611 --enable-sleep-mode --cudagraph-capture-sizes 1 2 4 8 12' # --gpu-memory-utilization 0.93
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      # --enable-sleep-mode requires PYTORCH_ALLOC_CONF's expandable_segments
      # to be OFF for the sleep-mode pool's malloc callback to receive
      # allocations (pytorch#147851) — but the image-wide default is
      # expandable_segments:True (containerfile), so patch_fix_xpu_sleep.py
      # toggles it to False only inside the pool context and restores True
      # on exit (see that patch for the mechanism). No per-model
      # PYTORCH_ALLOC_CONF override is needed or wanted here: setting it
      # image-wide broke 35B (fragmented every weight allocation into ~20
      # MiB chunks, causing a Level Zero CAT error / device-lost crash at
      # inference time) before this was corrected.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=0"
    ttl: 0
    cmdStop: /app/vllm-wrapper sleep --vllm-url http://127.0.0.1:8002 --sleep-level 2 --stop-pid ${PID}
    unloadTimeout: 60

  27b-gpu1:
    # --cudagraph-capture-sizes 1 2 4 8 12: see 27b-gpu0 above for the full
    # rationale (identical --max-num-seqs 3 / MTP config on this model).
    cmd: '${cmd_base_vllm_27b_gpu1} /data/models/Qwen3.8-27B-GPTQ-Int4 --host 127.0.0.1 --port 8003 --quantization gptq --dtype float16 --max-model-len 175104 --gpu-memory-utilization 0.86 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 3}'' --max-num-seqs 3 --max-num-batched-tokens 8192 --served-model-name 27b-gpu1 --kv-cache-memory 7047184611 --enable-sleep-mode --cudagraph-capture-sizes 1 2 4 8 12' # --gpu-memory-utilization 0.93
    env:
      # See 27b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal and
      # PYTORCH_ALLOC_CONF / --enable-sleep-mode.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=1"
    ttl: 0
    cmdStop: /app/vllm-wrapper sleep --vllm-url http://127.0.0.1:8003 --sleep-level 2 --stop-pid ${PID}
    unloadTimeout: 60

  # ==========================================
  # 3. Qwen3 Embedding 0.6B (spread across both GPUs)
  #    Root cause of the earlier failure (fixed via llama-device-wrapper.sh
  #    + the hermetic /app/rt runtime — see containerfile): this image's
  #    default LD_LIBRARY_PATH puts /opt/venv/lib (vLLM's SYCL 9 stack)
  #    first, so plain /app/llama-server bound vLLM's Intel OpenMP runtime
  #    instead of the oneAPI 2025.3 runtime it was built against (all of
  #    libiomp5/libimf/libsvml/libintlc/libirng differ by md5 between the
  #    two). That ABI mismatch segfaulted on CPU (-ngl 0, immediately after
  #    "llama threadpool init") and hung on GPU (-ngl 99, host-side stall
  #    mid-layer-0 attention — VRAM allocated, GPU idle, one CPU thread
  #    pinned). It was NOT a CPU-dispatch/Zen 2/haswell issue (haswell is
  #    the correct ggml CPU variant for this node's Ryzen 5 3600), and NOT
  #    a Battlemage-specific bug — llama-swap's upstream mostlygeek/
  #    llama-swap image runs this exact command/env with no changes needed.
  # ==========================================
  embed-spread:
    cmd: /app/llama-device-wrapper.sh --port ${PORT} --host 127.0.0.1 --cont-batching -m /data/models/Qwen3-Embedding-0.6B-Q8_0.gguf --split-mode layer --tensor-split 1,1 -ngl 99 -t 8 --threads 8 --ctx-size 81920 --cache-type-k q8_0 --cache-type-v q8_0 --embedding --ubatch-size 256 --jinja --poll 0 --parallel 20 --metrics
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0,1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "GGML_SYCL_ENABLE_GRAPH=1"
    ttl: 0
    concurrencyLimit: 20

matrix:
  vars:
    # GPU 0 models
    M35-0: 35b-gpu0
    M27-0: 27b-gpu0
    # GPU 1 models
    M35-1: 35b-gpu1
    M27-1: 27b-gpu1
    # Spread models
    S35-e: embed-spread

  # Eviction cost: higher = harder to evict
  evict_costs:
    M35-0: 20
    M35-1: 10
    M27-0: 15
    M27-1: 15
    S35-e: 1

  sets:
    # --- Dual (one 35B per GPU, chat-only) ---
    dual_35b: M35-0 & M35-1

    # --- Dual (one 27B per GPU, chat-only) ---
    dual_27b: M27-0 & M27-1

    # --- Dual (35B + 27B mixed, chat-only) ---
    dual_35b0-27b1: M35-0 & M27-1
    dual_27b0-35b1: M27-0 & M35-1

    # --- Dual with embed spread (one 35B per GPU + embed on both) ---
    dual_35b-spread: M35-0 & M35-1 & S35-e

    # --- Dual with embed spread (one 27B per GPU + embed on both) ---
    dual_27b-spread: M27-0 & M27-1 & S35-e

    # --- Dual with embed spread (35B + 27B mixed + embed on both) ---
    dual_35b0-27b1-spread: M35-0 & M27-1 & S35-e
    dual_27b0-35b1-spread: M27-0 & M35-1 & S35-e

    # --- Embed spread standalone ---
    embed_spread: S35-e
