---
healthCheckTimeout: 120

store:
  path: /var/lib/llama-swap/llama-swap.db

# Controls /upstream/<model>/<path> passthrough. The llama_swap_affinity
# LiteLLM routing plugin (see litellm.yaml) polls /upstream/<model>/slots to
# read per-instance llama.cpp slot occupancy for load-aware routing between
# the two GPU copies of a model. Restating the built-in default pattern here
# is required: specifying ignorePaths replaces it rather than merging with
# it. Both entries prevent a request from ever triggering a swap; the plugin
# only polls models it already knows are resident, but this is
# defense-in-depth against a plugin bug doing otherwise.
upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$' # llama-swap built-in default
    - ^/slots$ # a /slots poll must never trigger a model load/swap

hooks:
  on_startup:
    # preload takes model IDs (not matrix set names) - "dual_35b" here was a
    # silent no-op, forcing a ~23s cold start on the first 35b request.
    preload:
      - 35b-gpu0
      - 35b-gpu1

macros:
  cmd_base: "/app/llama-server --port ${PORT} --host 127.0.0.1 --parallel 2 --cont-batching --split-mode none --reasoning-format auto -ngl 99 --flash-attn on --cache-type-k f16 --cache-type-v f16 --ubatch-size 2048 --jinja --ctx-size 327680 --no-kv-unified --spec-type ngram-simple --poll 0 -t 2 --threads-http 8 --cache-reuse 256 --load-mode none --metrics"

models:
  # ==========================================
  # 1. Qwen 3.6 35B (A3B)
  # ==========================================
  35b-gpu0:
    cmd: ${cmd_base} -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
    ttl: 0

  35b-gpu1:
    cmd: ${cmd_base} -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
    ttl: 0

  # ==========================================
  # 2. Qwen 3.6 27B
  # ==========================================
  27b-gpu0:
    cmd: ${cmd_base} --parallel 1 --ctx-size 128000 -m /data/models/Qwen3.8-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.8-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
    ttl: 0

  27b-gpu1:
    cmd: ${cmd_base} --parallel 1 --ctx-size 128000 -m /data/models/Qwen3.8-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.8-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
    ttl: 0

  # ==========================================
  # 3. Qwen 3 Coder 30B (A3B)
  # ==========================================
  coder30b-gpu0:
    cmd: ${cmd_base} -m /data/models/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
    ttl: 0

  coder30b-gpu1:
    cmd: ${cmd_base} -m /data/models/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
    ttl: 0

  35b-gpu0-dense:
    cmd: ${cmd_base} --parallel 1 --ctx-size 327680 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0"
    ttl: 0

  35b-gpu1-dense:
    cmd: ${cmd_base} --parallel 1 --ctx-size 327680 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:1"
    ttl: 0

  # ==========================================
  # 4. Qwen 3.6 35B (A3B) — Spread (both GPUs, 1M ctx, parallel 4)
  # ==========================================
  35b-spread:
    cmd: ${cmd_base} --split-mode layer --tensor-split 1,1 --parallel 4 --ctx-size 1048576 -m /data/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf --mmproj /data/models/Qwen3.6-35B-A3B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:*"
    ttl: 0

  # ==========================================
  # 5. Qwen 3.8 27B — Spread (both GPUs, 640K ctx, parallel 3)
  # ==========================================
  27b-spread:
    cmd: ${cmd_base} --split-mode layer --tensor-split 1,1 --parallel 3 --ctx-size 655360 -m /data/models/Qwen3.8-27B-Q4_K_M.gguf --mmproj /data/models/Qwen3.8-27B-mmproj-F16.gguf --image-min-tokens 1024
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:*"
    ttl: 0

  # ==========================================
  # 6. Qwen 3 Coder 30B (A3B) — Spread (both GPUs, 768K ctx, parallel 3)
  # ==========================================
  coder30b-spread:
    cmd: ${cmd_base} --split-mode layer --tensor-split 1,1 --parallel 3 --ctx-size 786432 -m /data/models/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:*"
    ttl: 0

# The matrix dictates all valid VRAM combinations.
# Each set represents one valid model-per-GPU configuration. The solver
# picks one set, guaranteeing exactly one model per GPU and preventing
# spillover to system RAM.
matrix:
  vars:
    # GPU 0 models
    M35-0: 35b-gpu0
    M35-0-d: 35b-gpu0-dense
    M27-0: 27b-gpu0
    C30-0: coder30b-gpu0
    # GPU 1 models
    M35-1: 35b-gpu1
    M35-1-d: 35b-gpu1-dense
    M27-1: 27b-gpu1
    C30-1: coder30b-gpu1
    # Spread models
    S35: 35b-spread
    S27: 27b-spread
    SC30: coder30b-spread

  # Eviction cost: higher = harder to evict. Spread > 35B > 27B/coder.
  # GPU 0 35B costs more than GPU 1 so eviction is deterministic.
  evict_costs:
    S35: 25
    S27: 25
    SC30: 25
    M35-0: 20
    M35-0-d: 20
    M35-1: 10
    M35-1-d: 10
    M27-0: 15
    M27-1: 15
    C30-0: 15
    C30-1: 15

  sets:
    # --- Dual (one 35B variant per GPU, all combos) ---
    dual_35b: M35-0 & M35-1
    dual_35b-d: M35-0-d & M35-1-d
    dual_35b-0d-1: M35-0-d & M35-1
    dual_35b-0-1d: M35-0 & M35-1-d

    # --- Dual (one 27B per GPU) ---
    dual_27b: M27-0 & M27-1

    # --- Dual (one coder per GPU) ---
    dual_coder: C30-0 & C30-1

    # --- Single (one 35B on either GPU) ---
    single_35b-0: M35-0
    single_35b-1: M35-1
    single_35b-d-0: M35-0-d
    single_35b-d-1: M35-1-d

    # --- Single (one 27B on either GPU) ---
    single_27b-0: M27-0
    single_27b-1: M27-1

    # --- Single (one coder on either GPU) ---
    single_coder-0: C30-0
    single_coder-1: C30-1

    # --- Spread (one instance spanning both GPUs) ---
    spread_35b: S35
    spread_27b: S27
    spread_coder: SC30
