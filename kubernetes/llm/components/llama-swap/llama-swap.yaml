---
healthCheckTimeout: 900

store:
  path: /var/lib/llama-swap/llama-swap.db

upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - ^/slots$

hooks:
  on_startup:
    # Preload 35B MoE on GPU 0 + 27B dense on GPU 1
    # embed-spread is also preloaded — 0.6B Q8_0 uses ~2 GB across both GPUs,
    # fitting alongside any dual chat config without pressure.
    # preload:
    #   - 27b-gpu0
    #   - 35b-gpu1
    #   - embed-spread

macros:
  cmd_base_vllm: "/app/vllm-device-wrapper.sh"
  cmd_base_llama: "/app/llama-server --port ${PORT} --host 127.0.0.1 --cont-batching -ngl 99 --flash-attn on --cache-type-k f16 --cache-type-v f16 --ubatch-size 2048 --jinja --poll 0 -t 12 --threads-http 4 --cache-reuse 256 --load-mode none --metrics"

models:
  # ==========================================
  # 1. Qwen 3.6 35B-A3B (MoE) — with vision tower, 131K ctx
  #    Source: rcs1000/Qwen3.6-35B-A3B-MTP-Preserved-GPTQ-Int4 @4b2e1978
  #    Fallback: llmfan46/Qwen3.6-35B-A3B-MoE-GPTQ-Int4 (cookbook-verified)
  # ==========================================
  35b-gpu0:
    cmd: '${cmd_base_vllm} /data/models/Qwen3.6-35B-A3B-GPTQ-Int4 --host 127.0.0.1 --port ${PORT} --quantization gptq --dtype float16 --max-model-len 131072 --gpu-memory-utilization 0.95 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 4}'' --max-num-seqs 4 --max-num-batched-tokens 8192 --served-model-name 35b-gpu0'
    env:
      # ONEAPI_DEVICE_SELECTOR has no effect on vLLM/torch XPU device
      # enumeration (verified: torch.xpu.device_count() is unchanged across
      # every selector value). vLLM's XPUPlatform claims ZE_AFFINITY_MASK as
      # its own device_control_env_var and re-translates logical<->physical
      # device IDs through it, so ZE_AFFINITY_MASK is the only var that
      # actually needs to be set here.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=0"
    ttl: 0

  35b-gpu1:
    cmd: '${cmd_base_vllm} /data/models/Qwen3.6-35B-A3B-GPTQ-Int4 --host 127.0.0.1 --port ${PORT} --quantization gptq --dtype float16 --max-model-len 131072 --gpu-memory-utilization 0.95 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 4}'' --max-num-seqs 4 --max-num-batched-tokens 8192 --served-model-name 35b-gpu1'
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=1"
    ttl: 0

  # ==========================================
  # 2. Qwen 3.8 27B (dense) — with vision, 131K ctx
  #    Source: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16 @9d189a60
  # ==========================================
  27b-gpu0:
    cmd: '${cmd_base_vllm} /data/models/Qwen3.8-27B-GPTQ-Int4 --host 127.0.0.1 --port ${PORT} --quantization gptq --dtype float16 --max-model-len 131072 --gpu-memory-utilization 0.95 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 4}'' --max-num-seqs 4 --max-num-batched-tokens 8192 --served-model-name 27b-gpu0'
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=0"
    ttl: 0

  27b-gpu1:
    cmd: '${cmd_base_vllm} /data/models/Qwen3.8-27B-GPTQ-Int4 --host 127.0.0.1 --port ${PORT} --quantization gptq --dtype float16 --max-model-len 131072 --gpu-memory-utilization 0.95 --kv-cache-dtype fp8 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --speculative-config ''{"method": "mtp", "num_speculative_tokens": 4}'' --max-num-seqs 4 --max-num-batched-tokens 8192 --served-model-name 27b-gpu1'
    env:
      # See 35b-gpu0 above re: ONEAPI_DEVICE_SELECTOR removal.
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "ZE_AFFINITY_MASK=1"
    ttl: 0

  # ==========================================
  # 3. Qwen3 Embedding 0.6B (spread across both GPUs)
  #    DISABLED (see matrix below): the shipped /app/llama-server segfaults
  #    loading ANY gguf model, on CPU or GPU, with or without SYCL loaded
  #    (reproduced with -ngl 0, a different model, and the SYCL backend .so
  #    excluded entirely). Crash always occurs immediately after "llama
  #    threadpool init", before any device/backend line prints. Leading
  #    suspect: CPU-dispatch mismatch — the node is an AMD Ryzen 5 3600
  #    (Zen 2) but the process maps libggml-cpu-haswell.so. This is a
  #    llama.cpp build issue requiring an image rebuild, tracked separately
  #    from the vLLM GPU-1 fixes in this change.
  # ==========================================
  embed-spread:
    cmd: /app/llama-server --port ${PORT} --host 127.0.0.1 --cont-batching -m /data/models/Qwen3-Embedding-0.6B-Q8_0.gguf -t 8 --threads 8 --ctx-size 122880 --cache-type-k q8_0 --cache-type-v q8_0 --embedding --ubatch-size 256 --jinja --poll 0 --parallel 30
    env:
      - "ONEAPI_DEVICE_SELECTOR=level_zero:0,1"
      - "SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1"
      - "GGML_SYCL_ENABLE_GRAPH=1"
    ttl: 0
    concurrencyLimit: 30

matrix:
  vars:
    # GPU 0 models
    M35-0: 35b-gpu0
    M27-0: 27b-gpu0
    # GPU 1 models
    M35-1: 35b-gpu1
    M27-1: 27b-gpu1
    # Spread models
    # embed-spread is disabled — see model comment above. Commenting the var
    # out (rather than removing it) keeps the sets below self-documenting.
    S35-e: embed-spread

  # Eviction cost: higher = harder to evict
  evict_costs:
    M35-0: 20
    M35-1: 10
    M27-0: 15
    M27-1: 15
    S35-e: 1

  sets:
    # --- Dual (one 35B per GPU, chat-only) ---
    dual_35b: M35-0 & M35-1

    # --- Dual (one 27B per GPU, chat-only) ---
    dual_27b: M27-0 & M27-1

    # --- Dual (35B + 27B mixed, chat-only) ---
    dual_35b0-27b1: M35-0 & M27-1
    dual_27b0-35b1: M27-0 & M35-1

    # --- Dual with embed spread (one 35B per GPU + embed on both) ---
    # Disabled along with S35-e above — see model comment on embed-spread.
    dual_35b-spread: M35-0 & M35-1 & S35-e

    # --- Dual with embed spread (one 27B per GPU + embed on both) ---
    dual_27b-spread: M27-0 & M27-1 & S35-e

    # --- Dual with embed spread (35B + 27B mixed + embed on both) ---
    dual_35b0-27b1-spread: M35-0 & M27-1 & S35-e
    dual_27b0-35b1-spread: M27-0 & M35-1 & S35-e

    # --- Embed spread standalone ---
    embed_spread: S35-e
