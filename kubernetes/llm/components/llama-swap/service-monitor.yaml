---
# llama-swap Prometheus metrics scraping.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-swap
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: llama-swap
spec:
  selector:
    matchLabels:
      app: llama-swap
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
