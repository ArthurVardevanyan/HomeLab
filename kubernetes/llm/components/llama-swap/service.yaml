---
apiVersion: v1
kind: Service
metadata:
  name: llama-swap-svc
  namespace: llm
  labels:
    app: llama-swap
spec:
  ipFamilies:
    - IPv4
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: llama-swap
