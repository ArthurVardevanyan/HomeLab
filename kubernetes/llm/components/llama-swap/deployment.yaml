---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  namespace: llm
  labels:
    app: llama-swap
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    checkov.io/skip1: CKV_K8S_40=Upstream Image Runs as Root
    checkov.io/skip2: CKV_K8S_22=Model Cache Requires Writable Root FS
    checkov.io/skip3: CKV_K8S_23=Upstream Image Requires Root
spec:
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      hostname: llama-swap
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      serviceAccountName: llama-swap
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        feature.node.kubernetes.io/custom-intel.xe.gpu: "true"
      containers:
        # Custom image = upstream llama-swap SYCL (b10450)
        # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/llama-swap versioning=loose
        - image: registry.arthurvardevanyan.com/homelab/llama-swap:v251-b10711@sha256:4c9b9e7a086fe77164a5069c277e760143bce09fb0eb63014a6e1e9d31cb2694
          imagePullPolicy: IfNotPresent
          name: llama-swap
          command: ["/app/llama-swap"]
          args: ["--config", "/etc/llama-swap/llama-swap.yaml", "--watch-config"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: LLAMA_CACHE
              value: /cache
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              ephemeral-storage: "256Mi"
              gpu.intel.com/xe: "4"
            limits:
              cpu: "6"
              memory: 48Gi
              ephemeral-storage: "1Gi"
              gpu.intel.com/xe: "4"
          volumeMounts:
            - name: config
              mountPath: /etc/llama-swap
              readOnly: true
            - name: model-storage
              mountPath: /data
            - name: cache-storage
              mountPath: /cache
            - name: store
              mountPath: /var/lib/llama-swap
        # metrics-exporter sidecar: scrapes llama.cpp /metrics from each
        # dynamically-assigned child process and exposes aggregated metrics
        # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab/llama-swap-metrics-exporter versioning=loose
        - image: registry.arthurvardevanyan.com/homelab/llama-swap-metrics-exporter:2026.08.21.143431@sha256:554bc278017929d4dd4ccf2f7a1f4cd02184c6abe597f9815fb3cb286cbfd8fb
          imagePullPolicy: IfNotPresent
          name: metrics-exporter
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: metrics-cache
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: llama-swap-config
        - name: model-storage
          persistentVolumeClaim:
            claimName: llm-models
        - name: cache-storage
          emptyDir: {}
        - name: store
          persistentVolumeClaim:
            claimName: llm-llama-swap-store
        - name: metrics-cache
          emptyDir: {}
