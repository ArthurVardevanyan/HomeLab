---
model_list:
  # --- Public Model Alias 1: Qwen 35B (30 t/s avg decode, ~593W system w/ HVAC) ---
  # gpu0 listed first (intentional): least-busy ties (equal in-flight count)
  # resolve to the first-listed deployment, so sequential 35B traffic packs
  # onto gpu0, preserving its prompt cache. gpu1 only takes 35B overflow when
  # gpu0 already has a request in flight, and otherwise stays free for
  # 27b-gpu1 / coder30b-gpu1 to load alongside it at zero eviction cost.
  - model_name: qwen3.6-35b-a3b
    litellm_params:
      model: openai/35b-gpu0
      api_base: http://llama-swap-svc.llm.svc.cluster.local:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.00000186
      output_cost_per_token: 0.00000124
  - model_name: qwen3.6-35b-a3b
    litellm_params:
      model: openai/35b-gpu1
      api_base: http://llama-swap-svc.llm.svc.cluster.local:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.00000186
      output_cost_per_token: 0.00000124

  # --- Public Model Alias 2: Qwen 27B (~14 t/s avg decode, ~593W system w/ HVAC) ---
  # gpu1 listed first: least-busy ties (equal in-flight count) resolve to the
  # first-listed deployment, so this keeps 27B off GPU0 (the 35B primary) and
  # lets llama-swap's matrix solver pack it alongside 35b-gpu0 at cost=0
  # instead of evicting it. See the routing_strategy note below.
  - model_name: qwen3.6-27b
    litellm_params:
      model: openai/27b-gpu1
      api_base: http://llama-swap-svc.llm.svc.cluster.local:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.00000398
      output_cost_per_token: 0.00000265
  - model_name: qwen3.6-27b
    litellm_params:
      model: openai/27b-gpu0
      api_base: http://llama-swap-svc.llm.svc.cluster.local:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.00000398
      output_cost_per_token: 0.00000265

  # --- Public Model Alias 3: Qwen Coder 30B (~13 t/s avg decode, ~593W system w/ HVAC) ---
  # gpu1 listed first for the same reason as qwen3.6-27b above.
  - model_name: qwen3.6-coder-30b-a3b
    litellm_params:
      model: openai/coder30b-gpu1
      api_base: http://llama-swap-svc.llm.svc.cluster.local:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.00000431
      output_cost_per_token: 0.00000287
  - model_name: qwen3.6-coder-30b-a3b
    litellm_params:
      model: openai/coder30b-gpu0
      api_base: http://llama-swap-svc.llm.svc.cluster.local:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.00000431
      output_cost_per_token: 0.00000287

general_settings:
  health_check_interval: 300
  # No models/keys have ever been added via the admin UI (both
  # LiteLLM_ModelTable and LiteLLM_ProxyModelTable are empty) - this file is
  # the sole source of truth for model_list. Keep it that way so a DB entry
  # can never silently shadow the GPU-preference ordering above.
  store_model_in_db: false
  store_prompts_in_spend_logs: true
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
  user_api_key_cache_ttl: 300

router_settings:
  # Kept as a fallback only. LiteLLM's own in-flight counter proved
  # unreliable in practice here: its tie-break (`if v < min_traffic` over an
  # insertion-ordered dict) always resolves ties to the first-listed
  # deployment, and the counter itself drifted, producing a persistent 3:1 /
  # 5:1 skew toward one GPU even under sustained concurrent load with an
  # idle sibling GPU available. The llama_swap_affinity plugin below is the
  # primary defense and bypasses this counter entirely for every model group
  # it covers; this setting (and the GPU-preference ordering in model_list
  # above) now only matters for the cold-start case where the plugin
  # intentionally declines to narrow (nothing resident yet to prefer).
  routing_strategy: least-busy
  # Spread alternative (not used): force a genuine 50/50 split across both
  # GPUs for 35B even under sequential (non-concurrent) load, e.g.:
  #   routing_strategy: simple-shuffle
  #   + add `weight: 1` to both 35b-gpu0 and 35b-gpu1 litellm_params
  # Trade-off: loses 35b-gpu0 prompt-cache locality, and makes 27b/coder
  # collisions with a running 35B instance (forcing a matrix eviction)
  # roughly twice as likely, since either GPU is equally likely to be picked
  # for a fresh 35B request. Superseded in practice by the plugin below,
  # which already load-balances between resident deployments of the same
  # model group without needing this.
  cache_responses: true
  # llama-swap-aware routing plugin. For each request, narrows candidates
  # using llama-swap ground truth instead of LiteLLM's own counter:
  #   - nothing resident (cold start)      -> no narrowing, ordering above decides
  #   - exactly one candidate resident     -> narrow to it (avoid an
  #                                          unnecessary eviction of an
  #                                          unrelated model on the other GPU)
  #   - both candidates resident and ready -> poll llama.cpp's /slots via
  #                                          llama-swap for actual busy-slot
  #                                          counts, route to the less busy
  #                                          one, round-robin on ties
  # See llama_swap_affinity.py (mounted alongside this file at /etc/litellm)
  # for the full rationale; resolved via the dotted-path convention
  # documented at litellm.proxy.types_utils.utils.get_instance_fn. The
  # /slots poll is proxied through llama-swap's upstream.ignorePaths guard
  # (see llama-swap.yaml) so it can never itself trigger a model swap.
  plugins:
    - llama_swap_affinity.plugin
  # Required by the plugin above: narrowing candidates to a resident
  # deployment is only safe if LiteLLM can't simultaneously drop that same
  # deployment from healthy_deployments via a failure-count cooldown (that
  # combination raises "No deployments left after routing-plugin filtering"
  # instead of falling back). All deployments here are one llama-swap pod on
  # one node; llama-swap's own process state (ready/starting/...) - which the
  # plugin already reads - is a more accurate health signal for a co-located
  # local backend than LiteLLM's default 3-failures/5-second cooldown, which
  # is designed for multi-provider failover and can false-positive on normal
  # long-generation timeouts or client-aborted streams.
  disable_cooldowns: true

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: litellm-dragonfly.llm.svc.cluster.local
    port: 6379
    ttl: 86400
    namespace: "litellm-proxy"
  enable_redis_auth_cache: true
  callbacks:
    - prometheus
  require_auth_for_metrics_endpoint: false
