---
model_list:
  # --- Public Model Alias 1: Claude Sonnet 5 ---
  - model_name: claude-sonnet-5
    litellm_params:
      model: claude-sonnet-5-5

  # --- Public Model Alias 2: Claude Opus 5 ---
  - model_name: claude-opus-5
    litellm_params:
      model: claude-opus-5-5

  # --- Public Model Alias 3: Qwen 35B
  - model_name: qwen3.6-35b-a3b
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: openai/35b-gpu0
      api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.000000013
      output_cost_per_token: 0.000000013
      timeout: 900
      num_retries: 2
      retry_after: 15
      # Pass client-sent chat_template_kwargs (enable_thinking toggle,
      # e.g. the OpenCode #fast variant) through to vLLM as-is.
      allowed_openai_params: ["chat_template_kwargs"]
  # - model_name: qwen3.6-35b-a3b
  #   litellm_params:
  #     model: openai/35b-gpu1
  #     api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
  #     api_key: "dummy"
  #     input_cost_per_token: 0.000000013
  #     output_cost_per_token: 0.000000013

  # --- Qwen 35B for OpenShift Lightspeed agentic runs ---
  # Same backend as qwen3.6-35b-a3b. The "-agentic" suffix makes
  # strip_agentic_params.py drop response_format and tools[].function.strict,
  # which otherwise stop vLLM from emitting tool calls (vllm#39929, vllm#55152).
  - model_name: qwen3.6-35b-a3b-agentic
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: openai/35b-gpu0
      api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.000000013
      output_cost_per_token: 0.000000013
      timeout: 900
      num_retries: 2
      retry_after: 15
      # Client chat_template_kwargs pass-through; strip_agentic_params still
      # wins (its extra_body sets enable_thinking=false at send time).
      allowed_openai_params: ["chat_template_kwargs"]

  # --- Public Model Alias 4: Qwen 27B
  - model_name: qwen3.8-27b
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: openai/27b-gpu1
      api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.000000013
      output_cost_per_token: 0.000000013
      timeout: 900
      num_retries: 2
      retry_after: 15
      # Pass client-sent chat_template_kwargs (enable_thinking toggle,
      # e.g. the OpenCode #fast variant) through to vLLM as-is.
      allowed_openai_params: ["chat_template_kwargs"]
  # - model_name: qwen3.8-27b
  #   litellm_params:
  #     model: openai/27b-gpu0
  #     api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
  #     api_key: "dummy"
  #     input_cost_per_token: 0.000000013
  #     output_cost_per_token: 0.000000013

  # --- Qwen 3.8 Flash-Next (llama.cpp GGUF, both GPUs) ---
  # Selecting it evicts the 35b/27b chat set (matrix set flash_next) and
  # keeps embed. Requires the llama-swap image to carry a qwen4exp-capable
  # llama.cpp and the GGUF to be on the PVC (see notes/qwen3.8-flash-next.md).
  # - model_name: qwen3.8-flash-next
  #   model_info:
  #     disable_background_health_check: true
  #   litellm_params:
  #     model: openai/flash-next
  #     api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
  #     api_key: "dummy"
  #     input_cost_per_token: 0.000000013
  #     output_cost_per_token: 0.000000013
  #     timeout: 900
  #     num_retries: 2
  #     retry_after: 15

  # --- Embed Spread (0.6B, both GPUs) ---
  - model_name: qwen3-embedding-0.6b
    litellm_params:
      model: openai/embed-spread
      api_base: http://llama-swap-svc.llm.svc.cluster.local.:8080/v1
      api_key: "dummy"
      input_cost_per_token: 0.000000001
      rpm: 480
      max_parallel_requests: 10
      timeout: 600
      num_retries: 3
      retry_after: 3

  # --- Flash-Next (External OpenAI-Compatible) ---
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/flash-next
      api_base: "<path:secret/data/homelab/llm/nh#url>"
      api_key: "<path:secret/data/homelab/llm/nh#api-key>"
      input_cost_per_token: 0.000000013
      output_cost_per_token: 0.000000013
      timeout: 900
      num_retries: 2
      retry_after: 15

general_settings:
  forward_client_headers_to_llm_api: true
  health_check_interval: 300
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
  user_api_key_cache_ttl: 300

router_general_settings:
  optional_pre_call_checks:
    - enforce_model_rate_limits

  #router_settings:
  #  routing_strategy: least-busy
  #  cache_responses: true
  #  # llama-swap-aware routing plugin. For each request, narrows candidates
  #  # using llama-swap ground truth instead of LiteLLM's own counter:
  #  #   - embedding models               -> always narrow to resident GPU
  #  #                                      (matrix guarantees one model per
  #  #                                       GPU, routing elsewhere would evict
  #  #                                       the active chat model)
  #  #   - one resident, victim idle      -> expose both GPUs (LiteLLM routes
  #  #                                        to the non-resident GPU,
  #  #                                        llama-swap loads it, then the
  #  #                                        "both ready" path takes over)
  #  #   - one resident, victim busy/recent -> narrow to resident to protect
  #  #                                         the active session (queue
  #  #                                         on the resident GPU instead)
  #  #   - both candidates resident and ready -> round-robin (Option B).
  #  #     Note: vLLM chat models lack a /slots endpoint, so least-busy
  #  #     polling via /slots only works for the embed-spread model.
  #  #     See the "Known limitation — no intra-pair load balancing for vLLM"
  #  #     section in llama_swap_affinity.py for Option C details.
  #  # Session recency window: 300s. If a GPU was served within this window,
  #  # requests are protected from triggering an eviction (covers the gap
  #  # between mid-generation and a user's read-and-reply period).
  #  # See llama_swap_affinity.py (mounted alongside this file at /etc/litellm)
  #  # for the full rationale. The /slots poll is proxied through llama-swap's
  #  # upstream.ignorePaths guard (see llama-swap.yaml) so it can never itself
  #  # trigger a model load/swap.
  #  plugins:
  #    - llama_swap_affinity.plugin
  #  # Required by the plugin above: narrowing candidates to a resident
  #  # deployment is only safe if LiteLLM can't simultaneously drop that same
  #  # deployment from healthy_deployments via a failure-count cooldown (that
  #  # combination raises "No deployments left after routing-plugin filtering"
  #  # instead of falling back). All deployments here are one llama-swap pod on
  #  # one node; llama-swap's own process state (ready/starting/...) - which the
  #  # plugin already reads - is a more accurate health signal for a co-located
  #  # local backend than LiteLLM's default 3-failures/5-second cooldown, which
  #  # is designed for multi-provider failover and can false-positive on normal
  #  # long-generation timeouts or client-aborted streams.
  # disable_cooldowns: true
  # Previously required by the llama-swap-affinity plugin (currently commented out).
  # Cooldowns can safely be re-enabled; with only one deployment per model, a
  # cooldown produces a clean failure instead of an 8×15s retry loop.

litellm_settings:
  request_timeout: 900
  cache: true
  cache_params:
    type: redis
    host: litellm-dragonfly.llm.svc.cluster.local
    port: 6379
    ttl: 21600
    namespace: "litellm-proxy"
    password: "<path:secret/data/homelab/llm/litellm/dragonfly#password>"
  enable_redis_auth_cache: true
  callbacks:
    - prometheus
    - strip_agentic_params.proxy_handler_instance
  router_settings:
    redis_host: litellm-dragonfly.llm.svc.cluster.local
    redis_port: 6379
    redis_password: "<path:secret/data/homelab/llm/litellm/dragonfly#password>"
    polling_interval: 0.03
  require_auth_for_metrics_endpoint: false
