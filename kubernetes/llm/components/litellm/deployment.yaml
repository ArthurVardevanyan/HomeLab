---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    checkov.io/skip1: CKV_K8S_40=Upstream Image Runs as Root
    checkov.io/skip2: CKV_K8S_22=Model Cache Requires Writable Root FS
    checkov.io/skip3: CKV_K8S_23=Upstream Image Requires Root
spec:
  replicas: 5
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      hostname: litellm
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: litellm
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        feature.node.kubernetes.io/custom-intel.xe.gpu: "true"
      containers:
        # renovate: datasource=docker depName=ghcr.io/berriai/litellm versioning=loose
        - image: ghcr.io/berriai/litellm:v1.100.0-dev.2@sha256:545bebaecffb357e5848c9f59eb7f292494f59da4b6544ca08bdcf3c7a8f2423
          imagePullPolicy: IfNotPresent
          name: litellm
          args: ["--config", "/etc/litellm/litellm.yaml", "--port", "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-config
                  key: LITELLM_MASTER_KEY
            - name: STORE_MODEL_IN_DB
              value: "false"
            - name: LLAMA_SWAP_BASE_URL
              value: http://llama-swap-svc.llm.svc.cluster.local.:8080
            - name: LLAMA_SWAP_PIN_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-dragonfly-redis-url
                  key: redis_url
            - name: HOME
              value: /root
            - name: GENERIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-config
                  key: GENERIC_CLIENT_ID
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-config
                  key: GENERIC_CLIENT_SECRET
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "https://zitadel.arthurvardevanyan.com/oauth/v2/authorize"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "https://zitadel.arthurvardevanyan.com/oauth/v2/token"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "https://zitadel.arthurvardevanyan.com/oidc/v1/userinfo"
            - name: PROXY_BASE_URL
              value: "https://litellm.arthurvardevanyan.com"
            - name: GENERIC_SCOPE
              value: "openid profile email"
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: "sub"
            - name: GENERIC_USER_EMAIL_ATTRIBUTE
              value: "email"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-app
                  key: fqdn-uri
            - name: SPEND_TRACKING
              value: "true"
            - name: LITELLM_SPEND_LOG_QUEUE_MAX_SIZE
              value: "256000000"
            - name: REDIS_CIRCUIT_BREAKER_FAILURE_THRESHOLD
              value: "50"
            - name: REDIS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT
              value: "30"
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
              ephemeral-storage: "128Mi"
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
