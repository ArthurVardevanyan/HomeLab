---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oikb
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: oikb
    template:
      engineVersion: v2
      data:
        OPEN_WEBUI_API_KEY: "{{ .OPEN_WEBUI_API_KEY }}"
        OIKB_API_KEY: "{{ .OIKB_API_KEY }}"
        GITHUB_ORG: "{{ .GITHUB_ORG }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        NEXTCLOUD_URL: "{{ .NEXTCLOUD_URL }}"
        NEXTCLOUD_USER: "{{ .NEXTCLOUD_USER }}"
        NEXTCLOUD_PASSWORD: "{{ .NEXTCLOUD_PASSWORD }}"
        JIRA_PROJECT: "{{ .JIRA_PROJECT }}"
        JIRA_TOKEN: "{{ .JIRA_TOKEN }}"
        DISCORD_SCOPE: "{{ .DISCORD_SCOPE }}"
        DISCORD_TOKEN: "{{ .DISCORD_TOKEN }}"
        SLACK_SCOPE: "{{ .SLACK_SCOPE }}"
        SLACK_TOKEN: "{{ .SLACK_TOKEN }}"
        ZOTERO_LIBRARY_ID: "{{ .ZOTERO_LIBRARY_ID }}"
        ZOTERO_API_KEY: "{{ .ZOTERO_API_KEY }}"
        KB_PERSONAL_SITE_ID: "{{ .KB_PERSONAL_SITE_ID }}"
        KB_HOMELAB_ID: "{{ .KB_HOMELAB_ID }}"
        KB_DOCUMENTS_ID: "{{ .KB_DOCUMENTS_ID }}"
        KB_JIRA_ID: "{{ .KB_JIRA_ID }}"
        KB_DISCORD_ID: "{{ .KB_DISCORD_ID }}"
        KB_SLACK_ID: "{{ .KB_SLACK_ID }}"
        KB_ZOTERO_ID: "{{ .KB_ZOTERO_ID }}"
  data:
    - secretKey: OPEN_WEBUI_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: api_key
        metadataPolicy: None
    - secretKey: OIKB_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: daemon_key
        metadataPolicy: None
    - secretKey: GITHUB_ORG
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: github_org
        metadataPolicy: None
    - secretKey: GITHUB_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/mcp-github
        property: token
        metadataPolicy: None
    - secretKey: NEXTCLOUD_URL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: nextcloud_url
        metadataPolicy: None
    - secretKey: NEXTCLOUD_USER
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: nextcloud_user
        metadataPolicy: None
    - secretKey: NEXTCLOUD_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: nextcloud_password
        metadataPolicy: None
    - secretKey: JIRA_PROJECT
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: jira_project
        metadataPolicy: None
    - secretKey: JIRA_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: jira_token
        metadataPolicy: None
    - secretKey: DISCORD_SCOPE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: discord_scope
        metadataPolicy: None
    - secretKey: DISCORD_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: discord_token
        metadataPolicy: None
    - secretKey: SLACK_SCOPE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: slack_scope
        metadataPolicy: None
    - secretKey: SLACK_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: slack_token
        metadataPolicy: None
    - secretKey: ZOTERO_LIBRARY_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: zotero_library_id
        metadataPolicy: None
    - secretKey: ZOTERO_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: zotero_api_key
        metadataPolicy: None
    - secretKey: KB_PERSONAL_SITE_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_personal_site
        metadataPolicy: None
    - secretKey: KB_HOMELAB_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_homelab
        metadataPolicy: None
    - secretKey: KB_DOCUMENTS_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_documents
        metadataPolicy: None
    - secretKey: KB_JIRA_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_jira
        metadataPolicy: None
    - secretKey: KB_DISCORD_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_discord
        metadataPolicy: None
    - secretKey: KB_SLACK_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_slack
        metadataPolicy: None
    - secretKey: KB_ZOTERO_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: homelab/llm/oikb
        property: kb_zotero
        metadataPolicy: None
