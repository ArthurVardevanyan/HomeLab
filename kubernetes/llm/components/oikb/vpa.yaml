---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: oikb
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: oikb
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oikb
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: oikb
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: "250m"
          memory: 512Mi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
