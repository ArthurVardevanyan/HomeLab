---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: grafana
      namespace: grafana
  hostnames: ["https-gateway"]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: grafana
