---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: stackrox
  namespace: stackrox
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway
  listeners:
    - name: https
      hostname: "central-stackrox.okd.homelab.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: stackrox-cert
