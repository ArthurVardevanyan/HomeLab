---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-loki-distributor
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.spec.template) &&
        has(object.spec.template.spec) &&
        has(object.spec.template.spec.containers)
      name: has-containers
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c, c.name == 'loki-distributor')
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) +
                '/resources',
              value: {
                "limits": {"cpu": '150m', "memory": '768Mi'},
                "requests": {"cpu": '25m', "memory": '64Mi'}
              }
            })
      patchType: JSONPatch
