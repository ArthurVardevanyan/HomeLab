---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-netobserv-plugin-static
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.metadata.labels)
        && object.metadata.labels['app'] == 'netobserv-plugin-static'
      name: label-matches
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c,
              c.name == 'netobserv-plugin-static'
              && (!has(c.resources) || !has(c.resources.limits))
            )
            .map(c,
              JSONPatch{
                op: 'add',
                path: '/spec/template/spec/containers/' +
                  string(object.spec.template.spec.containers.indexOf(c)) +
                  '/resources',
                value: {
                  "limits": {"cpu": '100m', "memory": '128Mi'},
                  "requests": {"cpu": '5m', "memory": '32Mi'}
                }
              }
            )
      patchType: JSONPatch
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: map-netobserv-plugin-static-binding
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openshift-netobserv-operator
  policyName: map-netobserv-plugin-static
