---
apiVersion: v1
kind: Service
metadata:
  name: sable-dns-udp-vlan1
  namespace: sable-dns
  labels:
    app.kubernetes.io/instance: sable-dns
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kube-vip.io/egress: "true"
    kube-vip.io/egress-internal: "true"
    kube-vip.io/loadbalancerIPs: "10.101.1.4"
spec:
  loadBalancerClass: kube-vip.io/kube-vip-class
  type: LoadBalancer
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: https
      port: 53443
      protocol: TCP
      targetPort: https-console
  selector:
    app: sable-dns
