---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sable-dns
  namespace: sable-dns
  labels:
    app.kubernetes.io/instance: sable-dns
  annotations:
    externaldns.k8s.io: unifi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: https-gateway
      namespace: openshift-ingress
  hostnames:
    - "okd.sabledns.io"
    - "okd.dns.sabledns.io"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sable-dns-service
          namespace: sable-dns
          port: 5380
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
