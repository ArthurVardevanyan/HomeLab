---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sable-dns
  namespace: sable-dns
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: sable-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: sable-dns
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: sable-dns
        minAllowed:
          cpu: 25m
          memory: 1Gi
        maxAllowed:
          cpu: 500m
          memory: 2Gi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly # RequestsAndLimits
