---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sable-dns-config
  namespace: sable-dns
  labels:
    app.kubernetes.io/instance: sable-dns
data:
  # First-boot seed for /data/sable.toml. An init container copies this into
  # the PVC only if /data/sable.toml does not exist yet; after that Sable owns
  # the file on the (writable) volume and rewrites it when settings change in
  # the console, so console changes persist across restarts. To change the seed
  # you must wipe the PVC (fresh start) or edit the running file in the console.
  sable.toml: |
    [server]
    http_listen = "0.0.0.0:5380"
    dns_listen = ["0.0.0.0:8053"]
    shutdown_timeout = "15s"

    [database]
    driver = "sqlite"
    dsn = "/data/sable.db"

    [resolver]
    # Recursion is restricted even when DNS listeners bind all interfaces.
    recursion = "private"
    mode = "forward"
    forwarders = ["10.101.10.1:53"]

    [blocking]
    enabled = true

    [query_log]
    enabled = true

    [encrypted_dns]
    dot_listen = []
    doh_listen = ["0.0.0.0:53443"]
    certificate_mode = "manual"
    certificate_file = "/etc/tls/tls.crt"
    private_key_file = "/etc/tls/tls.key"
    minimum_tls_version = "1.3"

    [encrypted_dns.acme]
    storage_dir = "/data/tls/acme"

    [security]
    enabled = true
    secure_cookies = true
    secret_key_file = "/data/sable.key"

    [cluster]
    data_dir = "/data/cluster"

    [config]
    watch = true
    debounce = "250ms"
