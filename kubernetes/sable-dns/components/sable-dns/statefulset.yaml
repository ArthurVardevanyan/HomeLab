---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sable-dns
  namespace: sable-dns
  labels:
    app: sable-dns
    app.kubernetes.io/instance: sable-dns
  annotations:
    checkov.io/skip1: CKV_K8S_40=OpenShift Injects Random UID
spec:
  revisionHistoryLimit: 0
  replicas: 1
  serviceName: sable-dns-service
  selector:
    matchLabels:
      app: sable-dns
  template:
    metadata:
      labels:
        app: sable-dns
      annotations:
        enable.version-checker.io/sable-dns: "true"
        # To pin this pod to specific IPs on specific VLANs, add
        # k8s.v1.cni.cncf.io/networks Multus annotations (see technitium-dns).
    spec:
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      hostname: sable-dns
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      serviceAccountName: sable-dns-sa
      initContainers:
        # Seeds /data/sable.toml from the ConfigMap on first boot only, then
        # Sable owns the (writable) file on the PVC. Runs as the same nonroot
        # user as Sable so the seeded file is owned by the Sable user.
        # renovate: datasource=docker depName=docker.io/library/busybox
        - name: seed-config
          image: docker.io/library/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "if [ ! -f /data/sable.toml ]; then cp /config/sable.toml /data/sable.toml; fi"
          securityContext:
            privileged: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: sable-dns-config
              mountPath: /config
              readOnly: true
            - name: sable-dns-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        # renovate: datasource=docker depName=ghcr.io/drudge/sable
        - image: ghcr.io/drudge/sable:1.3.1@sha256:651fc41c8b7dcc604c70c921e18b73cc986b106aef3f08ce98f1b78898227ffa
          imagePullPolicy: IfNotPresent
          name: sable-dns
          securityContext:
            privileged: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5380
              name: http-console
              protocol: TCP
            - containerPort: 53443
              name: https-console
              protocol: TCP
            - containerPort: 8053
              name: dns-tcp
              protocol: TCP
            - containerPort: 8053
              name: dns-udp
              protocol: UDP
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "400m"
          volumeMounts:
            - name: sable-dns-data
              mountPath: /data
            - name: sable-dns-cert
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: http-console
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http-console
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: sable-dns-data
          persistentVolumeClaim:
            claimName: sable-dns-data
        - name: sable-dns-cert
          secret:
            secretName: sable-dns-cert
        - name: sable-dns-config
          configMap:
            name: sable-dns-config
        - name: tmp
          emptyDir: {}
      enableServiceLinks: false
