---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-power-manager
  namespace: intel-device-plugins-operator
  annotations:
    gitops-ci.k8s.io/exempt-image-checksum: "registry.arthurvardevanyan.com/homelab/gpu-toolbox:not_latest"
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: gpu-power-manager
spec:
  selector:
    matchLabels:
      app: gpu-power-manager
  template:
    metadata:
      labels:
        app: gpu-power-manager
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccountName: gpu-power-manager
      containers:
        - name: power-manager
          # renovate: datasource=docker depName=registry.arthurvardevanyan.com/homelab versioning=loose
          image: registry.arthurvardevanyan.com/homelab/gpu-toolbox:not_latest
          command: ["sh", "-c"]
          args:
            - |
              POWER_LIMIT_WATTS=${POWER_LIMIT_WATTS:-200}
              POWER_LIMIT_MICROWATTS=$((POWER_LIMIT_WATTS * 1000000))
              apply_power_limits() {
                applied=0
                for cap in /sys/class/drm/card*/device/hwmon/hwmon*/power1_cap; do
                  [ -e "$cap" ] || continue
                  if echo "$POWER_LIMIT_MICROWATTS" > "$cap" 2>/dev/null; then
                    applied=$((applied + 1))
                  fi
                done
                echo "GPU power limits set to ${POWER_LIMIT_WATTS}W (${POWER_LIMIT_MICROWATTS} micro-watts) on ${applied} GPU(s)"
              }
              apply_power_limits
              # Re-apply periodically (handles driver reloads, hwmon re-indexing)
              while true; do sleep 300; apply_power_limits; done
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
          env:
            - name: POWER_LIMIT_WATTS
              value: "200"
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      nodeSelector:
        feature.node.kubernetes.io/custom-intel.xe.gpu: "true"
      tolerations:
        - key: node-role.kubernetes.io/gpu
          operator: Exists
          effect: NoSchedule
