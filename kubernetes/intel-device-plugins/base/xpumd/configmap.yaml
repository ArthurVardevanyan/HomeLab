---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xpumd-config
  namespace: intel-device-plugins-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    helm.sh/chart: xpumd-2.0.1
    app.kubernetes.io/name: xpumd
    app.kubernetes.io/instance: xpumd
    app.kubernetes.io/version: "v2.0.1"
    app.kubernetes.io/managed-by: Helm
data:
  config-processor-xpustatus.yaml: |-
    processors:
      intelxpustatus:
        rules:
          - name: "Intel GPU core temperature health"
            source_metric: "hw.temperature"
            parent_metric: "hw.gpu.info"
            parent_ref_attribute: "hw.id"
            parent_filters:
              - key: "pci.vendor_id"
                values: ["8086"]
            component_filters:
              - key: "hw.sensor_location"
                values: ["gpu"]
            copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
            add_attributes:
              hw.type: "temperature"
            states:
              # Default state
              - state_name: "ok"
              - state_name: "warning"
                conditions:
                  - value: 95.0
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c1"]
                  - value: 100.0
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c0", "56c2"]
                  # Default threshold for other device IDs
                  - value: 105.0
          - name: "Intel GPU memory temperature health"
            source_metric: "hw.temperature"
            parent_metric: "hw.gpu.info"
            parent_ref_attribute: "hw.id"
            parent_filters:
              - key: "pci.vendor_id"
                values: ["8086"]
            component_filters:
              - key: "hw.sensor_location"
                values: ["memory"]
            copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
            add_attributes:
              hw.type: "temperature"
            states:
              # Default state
              - state_name: "ok"
              - state_name: "warning"
                conditions:
                  - value: 85.0
  config.yaml: |-
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8080
    extensions: {}
    processors:
      intelxpustatus: {}
    receivers:
      intelxpu:
        collection_interval: 5s
        initial_delay: 1s
        metrics: {}
        sampling_interval: 1s
        timeout: 0
    service:
      pipelines:
        metrics:
          exporters:
          - prometheus
          processors:
          - intelxpustatus
          receivers:
          - intelxpu
      telemetry:
        logs:
          disable_stacktrace: true
          level: info
