---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-openshift-logging-ingester
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['app.kubernetes.io/component'] == 'ingester' &&
        object.metadata.labels['app.kubernetes.io/created-by'] == 'lokistack-controller'
      name: matches-labels
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - statefulsets
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
            .filter(c, c.name == 'loki-ingester')
            .map(c, JSONPatch{
              op: 'add',
              path: '/spec/template/spec/containers/' +
                string(object.spec.template.spec.containers.indexOf(c)) +
                '/resources',
              value: {
                "limits": {"cpu": '500m', "memory": '12Gi'},
                "requests": {"cpu": '25m', "memory": '6Gi'}
              }
            })
      patchType: JSONPatch
