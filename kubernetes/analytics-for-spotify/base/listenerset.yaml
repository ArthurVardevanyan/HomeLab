---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: analytics-for-spotify
  namespace: analytics-for-spotify
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway
    namespace: openshift-ingress
  listeners:
    - name: https
      hostname: "spotify.arthurdevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: analytics-for-spotify-cert
