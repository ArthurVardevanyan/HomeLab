! UniFi UDM SE - BGP configuration (FRR 10.1.2 syntax)
!
! Apply via: UniFi Network -> Settings -> Routing -> BGP -> upload this file.
! This file MUST mirror the structure the UDM's config normalizer accepts
! (see `vtysh -c "show running-config"` on the device). Deviating (large
! comment banners, reordered clauses, explicit `neighbor activate`) causes a
! "Gateway Configuration Failed" alert and the upload is rejected.
!
! NOTE (UDM SE): not stored as GUI settings; may not survive firmware
! updates. This file is the source of truth; re-upload after upgrades.
!
router bgp 65000
 bgp router-id 10.101.10.1
 bgp graceful-restart
 bgp bestpath as-path multipath-relax
 neighbor K8S-NODES peer-group
 neighbor K8S-NODES remote-as 65000
 neighbor K8S-NODES bfd
 neighbor 10.101.10.101 peer-group K8S-NODES
 neighbor 10.101.10.102 peer-group K8S-NODES
 neighbor 10.101.10.103 peer-group K8S-NODES
 neighbor 10.101.10.104 peer-group K8S-NODES
 neighbor 10.101.10.105 peer-group K8S-NODES
 neighbor 10.101.10.106 peer-group K8S-NODES
 ! 10.101.10.107 (gpu-1) removed - node not present in the cluster; a dead
 ! neighbor causes constant BGP "resetting connection" churn on the router.
 ! Re-add if gpu-1 rejoins.
 !
 address-family ipv4 unicast
  ! CRITICAL FIX: install ALL equal-cost iBGP paths for a VIP instead of a
  ! single best-path. Without this, an externalTrafficPolicy: Local VIP
  ! (10.101.10.240 internal ingress, advertised only by the 3 control-plane
  ! nodes) pins to ONE next-hop and blackholes when that node rolls.
  maximum-paths ibgp 8
  neighbor K8S-NODES next-hop-self
  neighbor K8S-NODES soft-reconfiguration inbound
  neighbor K8S-NODES prefix-list METALLB-POOL in
  neighbor K8S-NODES route-map ALLOW-METALLB-LB in
 exit-address-family
exit
!
ip prefix-list METALLB-POOL seq 10 permit 10.101.10.240/28 le 32
!
route-map ALLOW-METALLB-LB permit 10
 match ip address prefix-list METALLB-POOL
exit
!
