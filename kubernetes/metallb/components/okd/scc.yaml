---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-system-cr
  labels:
    app.kubernetes.io/instance: metallb-system
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - metallb-speaker
    resources:
      - securitycontextconstraints
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-system-crb
  labels:
    app.kubernetes.io/instance: metallb-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-system-cr
subjects:
  - kind: ServiceAccount
    name: speaker
    namespace: metallb-system
