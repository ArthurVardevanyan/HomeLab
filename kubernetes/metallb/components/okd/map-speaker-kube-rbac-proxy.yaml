---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: map-metallb-speaker-kube-rbac-proxy
spec:
  reinvocationPolicy: Never
  failurePolicy: Fail
  matchConditions:
    - expression: >-
        'app' in object.metadata.labels
        && object.metadata.labels['app'] == 'metallb'
        && 'component' in object.metadata.labels
        && object.metadata.labels['component'] == 'speaker'
      name: label-matches
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - daemonsets
        scope: Namespaced
  mutations:
    - jsonPatch:
        expression: >-
          object.spec.template.spec.containers
                      .filter(c, c.name == 'kube-rbac-proxy')
                      .map(c,
                        !has(c.resources)
                        ? [JSONPatch{op: 'add',
                            path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources',
                            value: {"limits": {"cpu": '10m', "memory": '40Mi'}, "requests": {"cpu": '5m', "memory": '20Mi'}}}]
                        : ((has(c.resources.limits)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/limits/cpu', value: '10m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/limits/memory', value: '40Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/limits',
                          value: {"cpu": '10m', "memory": '40Mi'}}])
                    + (has(c.resources.requests)
                      ? [
                        JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests/cpu', value: '5m'},
                            JSONPatch{op: 'add', path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests/memory', value: '20Mi'}]
                      : [JSONPatch{op: 'add',
                          path: '/spec/template/spec/containers/' +
                              string(object.spec.template.spec.containers.indexOf(c)) +
                              '/resources/requests',
                          value: {"cpu": '5m', "memory": '20Mi'}}]))
                      )
                      .flatten()
      patchType: JSONPatch
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: map-metallb-speaker-kube-rbac-proxy-binding
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: metallb-system
  policyName: map-metallb-speaker-kube-rbac-proxy
